# Supabase Edge Function 배포 (2026-11-25)
#   main 에 머지된 supabase/functions/<이름>/ 을 그대로 Supabase 에 올린다.
#   사람이 코드를 옮겨 적어 올리지 않는다 — 머지된 파일과 라이브가 늘 같게.
#   필요한 비밀값(이름만): SUPABASE_ACCESS_TOKEN — 없으면 배포를 건너뛰고 요약에 알린다(실패로 만들지 않는다).
#   연결은 노션 「🔌 필요연동」 트리거로 피클이 한다.
name: deploy-edge

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      fn:
        description: '배포할 함수 이름(비우면 assistant-proxy)'
        required: false
        default: 'assistant-proxy'

permissions:
  contents: read

concurrency:
  group: deploy-edge
  cancel-in-progress: false

env:
  PROJECT_REF: vzxwdfswlolhcluljkgi

jobs:
  deploy:
    name: deploy-edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 비밀값 확인 (값은 찍지 않는다)
        id: tok
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "### Edge Function 배포 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            echo "SUPABASE_ACCESS_TOKEN 이 없다 — 노션 「🔌 필요연동」에서 연결하면 다음 실행부터 배포된다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 배포할 함수 고르기
        id: fns
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ github.event.inputs.fn || 'assistant-proxy' }}" >> "$GITHUB_OUTPUT"
          else
            # 이번 push 에서 바뀐 함수 폴더만
            list=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions/ 2>/dev/null \
              | awk -F/ 'NF>=3 {print $3}' | sort -u | tr '\n' ' ')
            echo "list=${list:-assistant-proxy}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: denoland/setup-deno@v2
        if: steps.tok.outputs.ok == '1'
        with:
          deno-version: v2.x

      - name: 타입 검사 (참고 — 실패해도 배포는 막지 않고 요약에 남긴다)
        if: steps.tok.outputs.ok == '1'
        continue-on-error: true
        run: |
          for fn in ${{ steps.fns.outputs.list }}; do
            f="supabase/functions/$fn/index.ts"
            [ -f "$f" ] || continue
            if deno check "$f" > /tmp/check.txt 2>&1; then echo "- $fn 타입 검사 통과" >> "$GITHUB_STEP_SUMMARY";
            else echo "- $fn 타입 검사 경고(배포는 계속): $(tail -n 3 /tmp/check.txt | tr '\n' ' ' | cut -c1-300)" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == '1'
        with:
          version: latest

      - name: 배포
        if: steps.tok.outputs.ok == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.fns.outputs.list }}; do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            # 세션 확인은 함수가 직접 한다 — Supabase JWT 검사는 끈다(README 「함수 배포」와 같다).
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "- $fn 배포함" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 살아 있는지 확인 (잘못된 요청에 5xx가 아니면 통과)
        if: steps.tok.outputs.ok == '1'
        run: |
          sleep 5
          for fn in ${{ steps.fns.outputs.list }}; do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -H 'origin: https://witw.pages.dev' \
              --data '{"action":"ping"}' "https://$PROJECT_REF.supabase.co/functions/v1/$fn")
            echo "- $fn 응답 코드 $code" >> "$GITHUB_STEP_SUMMARY"
            case "$code" in 5*|000) echo "::error::$fn 이 부팅하지 못했다($code)"; exit 1;; esac
          done
