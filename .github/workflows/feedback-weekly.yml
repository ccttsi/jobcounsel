# AUP-8 답 평가 주간 집계 — 자료실 비서 (MCL Goal · 2026-11-27)
#   Supabase 함수 jc_assistant_feedback_week(7) 의 «유형 × 섹터» 묶음만 읽는다(질문·답 문장은 DB에도 없다).
#   평가 3건 이상·아쉬움 40% 이상 묶음을 «성적표 보강 후보»로 Actions 요약·산출물·진행일지 한 줄에 남긴다.
#   비밀값(이름만): SUPABASE_ACCESS_TOKEN(SQL) · NOTION_TOKEN_MCL(진행일지, 평가가 있을 때만) — 없으면 그 단계만 건너뛴다.
#   설계: ops/feedback/DESIGN.md
name: feedback-weekly

on:
  schedule:
    - cron: '41 23 * * 0'     # 매주 월요일 08:41 KST
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠(1~90)'
        required: false
        default: '7'
      notion:
        description: '진행일지에 한 줄 남기기(yes/no)'
        required: false
        default: 'yes'

permissions:
  contents: read

concurrency:
  group: feedback-weekly
  cancel-in-progress: false

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 집계 규칙 시험
        run: node ops/feedback/weekly.mjs --self-test
      - name: 주간 집계
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOTION_TOKEN_MCL: ${{ secrets.NOTION_TOKEN_MCL }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          NOTION: ${{ github.event.inputs.notion || 'yes' }}
        run: |
          set -eu
          FLAGS="--days ${DAYS}"
          if [ "$NOTION" = "yes" ]; then FLAGS="$FLAGS --notion"; fi
          node ops/feedback/weekly.mjs $FLAGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-week
          path: feedback-week.json
          if-no-files-found: ignore
          retention-days: 30
