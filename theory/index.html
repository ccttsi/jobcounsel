/* 비교 */
function eraOf(y){return y<1950?'1949년까지':y<1970?'1950–1969':y<1990?'1970–1989':y<2010?'1990–2009':y<9999?'2010년 이후':'현행 제도·실천'}
function vCompare(){const s=st.seg.compare;let b='';
  if(s==='table')b=COMPARE.map((c,i)=>`<details class="acc"${i===0?' open':''}><summary><span><b>${esc(c.t)}</b><small>${esc(c.n)}</small></span></summary><div class="in"><dl class="kv" style="margin:0">${c.rows.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>${mini(c.ids)}</div></details>`).join('');
  else if(s==='group')b=GROUPS.map(g=>`<details class="acc"><summary><span><b>${esc(g.name)}</b><small>${esc(g.key)}</small></span></summary><div class="in"><dl class="kv" style="margin:0"><div><dt>공통점</dt><dd>${esc(g.same)}</dd></div><div><dt>차이점</dt><dd>${esc(g.diff)}</dd></div><div><dt>이럴 땐</dt><dd>${esc(g.case)}</dd></div></dl>${mini(g.ids)}</div></details>`).join('');
  else{const eras={};ALL.slice().sort((a,b)=>a.y-b.y||byKo(a,b)).forEach(x=>(eras[eraOf(x.y)]??=[]).push(x));
    b=Object.entries(eras).map(([e,a])=>`<div class="sec"><p class="yr">${e} · ${a.length}개</p>${list(a)}</div>`).join('')}
  return `<header class="hero"><h1>비교</h1><p>헷갈리는 이론을 나란히 놓고 봅니다.</p></header>${seg('compare',[['table','비교표'],['group','관점 묶음'],['time','연표']])}<div class="sec">${b}</div>`}

/* 실전 */
function vPractice(){const s=st.seg.practice;let b='';
  if(s==='stage')b=`<p class="hint">국민취업지원제도 상담 흐름에 맞춰 단계마다 꺼내 쓸 이론과 질문입니다.</p><ol class="steps-n">${STAGES.map(g=>`<li><h3 style="font-size:1.08rem">${esc(g.t)}</h3><p class="hint">${esc(g.d)}</p><div class="qs">${g.q.map(q=>`<p class="q">${esc(q)}</p>`).join('')}</div>${mini(g.ids)}</li>`).join('')}</ol>`;
  else if(s==='tool')b=`<div class="card sec"><h3>첫 회기 구조</h3><dl class="kv" style="margin:0">${TOOLS.session.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl></div>

   <div class="card sec"><h3>회기를 마치기 전 다섯 가지</h3>${TOOLS.close.map((c,i)=>`<label class="ck" for="c${i}"><input type="checkbox" id="c${i}"><span>${esc(c)}</span></label>`).join('')}</div>
   <div class="card sec"><h3>윤리와 안전 점검</h3>${TOOLS.ethic.map((c,i)=>`<label class="ck" for="e${i}"><input type="checkbox" id="e${i}"><span>${esc(c)}</span></label>`).join('')}</div>`;
  else b=`<p class="note">2026년 11월 12일 기준으로 확인한 내용입니다. 예산안은 국회에서 바뀔 수 있으니 시행 지침을 꼭 확인하세요.</p>${TRENDS.map(t=>`<div class="card sec"><h3>${esc(t.t)}</h3><p>${esc(t.d)}</p>${mini(t.ids)}</div>`).join('')}<div class="card sec"><h3>출처</h3>${SOURCES.map(s=>`<p style="font-size:.86rem"><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></p>`).join('')}</div>`;
  return `<header class="hero"><h1>실전</h1><p>상담실에서 바로 쓰는 흐름, 도구, 최신 동향.</p></header>${seg('practice',[['stage','단계별 지도'],['tool','도구함'],['now','2026–27']])}<div class="sec">${b}</div>`}

/* 복습 */
function buildDeck(){let a=ALL.filter(x=>st.scope==='key'?x.key:st.scope==='saved'?store.saved.includes(x.id):st.scope==='now'?x.now:true);
  a=a.map(x=>[(store.box[x.id]||0)+Math.random()*.9,x.id]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);st.deck=a;st.di=0;st.shown=false}
function cardHTML(){if(!st.deck.length)return '<p class="empty">이 범위에 카드가 없습니다. 이론을 스크랩하거나 다른 범위를 고르세요.</p>';
  if(st.di>=st.deck.length)return `<div class="card sec" style="text-align:center"><h3>한 바퀴를 마쳤습니다</h3><p class="hint">${st.deck.length}장을 살펴봤습니다.</p><div class="btns" style="justify-content:center"><button class="btn p" data-act="redeck">다시 섞기</button></div></div>`;
  const x=T[st.deck[st.di]];
  return `<div class="fc fam" style="--h:${hue(x)}"><small class="hint">${esc(FAM[x.fam].name)} · ${st.di+1} / ${st.deck.length}</small><h2>${esc(x.title)}</h2><p class="hint">${esc(x.person)}</p>
  ${st.shown?`<div class="ans"><p><b>${esc(x.summary)}</b></p>${x.core?`<dl class="kv" style="margin:0">${x.core.map(c=>`<div><dt>${esc(c[0])}</dt><dd>${esc(c[1])}</dd></div>`).join('')}</dl>`:`<p>${esc(x.detail)}</p>`}${x.exam?`<p class="note">${esc(x.exam)}</p>`:''}</div>
  <div class="rate"><button class="btn" data-act="rate" data-v="0">다시</button><button class="btn" data-act="rate" data-v="1">알쏭달쏭</button><button class="btn p" data-act="rate" data-v="2">알아요</button></div><button class="btn s" data-act="open" data-id="${x.id}" style="align-self:flex-start">전체 내용 보기</button>`
  :`<p>누가 만들었고, 핵심 개념은 무엇이며, 상담에서 어떻게 쓰는지 떠올려 보세요.</p><button class="btn p" data-act="flip" style="margin-top:auto">답 보기</button>`}</div>`}
function dictBody(){const q=st.dictQ.trim().toLowerCase();const a=DICT.filter(d=>(!st.dictF||d[2].includes(st.dictF))&&(!q||d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q)||d[3].toLowerCase().includes(q)));
  return `<p class="hint">${a.length}개 용어</p><div class="card"><dl class="kv" style="margin:0">${a.map(dictRow).join('')||'<p class="empty">찾는 용어가 없습니다.</p>'}</dl></div>`}
function vReview(){const s=st.seg.review;let b='';
  if(s==='card'){if(!st.deck.length&&st.di===0)buildDeck();const known=ALL.filter(x=>(store.box[x.id]||0)>=2).length;
    b=`<div class="chips scroll">${[['key','핵심 이론'],['now','요즘 흐름'],['saved','스크랩'],['all','전체']].map(([v,l])=>`<button class="chip" data-act="scope" data-v="${v}" aria-pressed="${st.scope===v}">${l}</button>`).join('')}</div><div id="fc">${cardHTML()}</div><div class="sec"><div class="sh"><small>알아요로 표시한 이론 ${known} / ${ALL.length}</small></div><div class="bar"><i style="width:${Math.round(known/ALL.length*100)}%"></i></div></div>`}
  else if(s==='dict')b=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="dq" type="search" placeholder="용어 찾기" value="${esc(st.dictQ)}" aria-label="용어 검색"></div><div class="chips scroll">${[['','전체'],['직','직업상담'],['심','직업심리'],['상','일반상담'],['리','일반심리']].map(([v,l])=>`<button class="chip" data-act="dictf" data-v="${v}" aria-pressed="${st.dictF===v}">${l}</button>`).join('')}</div><div id="dres" class="sec">${dictBody()}</div>`;
  else b=list(store.saved)||'<p class="empty">아직 스크랩한 이론이 없습니다. 이론 화면 위쪽의 스크랩 버튼을 누르면 여기에 모입니다.</p>';
  return `<header class="hero"><h1>복습</h1></header>${seg('review',[['card','카드 복습'],['dict','용어사전'],['saved','스크랩 '+store.saved.length]])}<div class="sec">${b}</div>`}

/* 도식 */
function viz(v,x){if(!v)return '';const it=v.items;let h='';
  if(v.type==='steps')h=`<div class="v-steps">${it.map((s,i)=>`${i?'<i>→</i>':''}<span><b>${i+1}</b>${esc(s)}</span>`).join('')}</div>`;
  else if(v.type==='grid')h=`<div class="v-grid">${it.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`;
  else if(v.type==='pyramid')h=`<div class="v-pyr">${it.map((s,i)=>`<span style="width:${42+i*(58/Math.max(1,it.length-1))}%">${esc(s)}</span>`).join('')}</div>`;
  else if(v.type==='hex'){const P=[[170,34],[288,102],[288,238],[170,306],[52,238],[52,102]],L=[[170,18,'middle'],[300,96,'start'],[300,250,'start'],[170,330,'middle'],[40,250,'end'],[40,96,'end']];
    h=`<div class="v-hex"><svg viewBox="-30 0 400 340" role="img" aria-label="RIASEC 육각형. 이웃한 유형일수록 비슷하다"><path class="dg" d="M170 34L170 306M288 102L52 238M288 238L52 102"/><polygon class="ln" points="${P.map(p=>p.join(',')).join(' ')}"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')}${it.map((s,i)=>`<text x="${L[i][0]}" y="${L[i][1]}" text-anchor="${L[i][2]}">${esc(s)}</text>`).join('')}</svg></div><p class="hint" style="text-align:center;margin-top:6px">이웃할수록 비슷하고, 마주 볼수록 다릅니다.</p>`}
  return `<div class="viz">${h}</div>`}

/* 상세 */
function detail(id){const x=T[id];if(!x)return '';const sv=store.saved.includes(id);
  const blk=(t,body,c='')=>body?`<section class="blk ${c}"><h3>${t}</h3>${body}</section>`:'';
  $('#sheet').className='sheet fam';$('#sheet').style.setProperty('--h',hue(x));
  $('#shLab').textContent=FAM[x.fam].name;$('#shSave').textContent=sv?'스크랩됨':'스크랩';$('#shSave').dataset.id=id;$('#shSave').className='btn s'+(sv?' p':'');
  return `<div class="d-h"><h1>${esc(x.title)}</h1><p>${esc(x.ko?x.ko+' · ':'')}${esc(x.person)} · ${esc(x.year)}</p></div>
  <p class="lead">${esc(store.easy&&x.easy||x.summary)}</p>
  ${blk('무엇을 말하는 이론인가',`${store.easy&&x.easy?`<p><b>${esc(x.summary)}</b></p>`:''}<p>${esc(x.detail)}</p>`)}
  ${viz(x.viz,x)}
  ${x.core?blk('핵심 개념',`<dl class="kv" style="margin:0">${x.core.map(c=>`<div><dt>${esc(c[0])}</dt><dd>${esc(c[1])}</dd></div>`).join('')}</dl>`,'box'):''}
  ${blk('상담에서 이렇게 씁니다',`<p>${esc(x.use)}</p>`)}
  ${x.ask?blk('이렇게 물어보세요',`<div class="qs">${x.ask.map(q=>`<p class="q">${esc(q)}</p>`).join('')}</div><button class="btn s" data-act="copy" data-t="${esc(x.ask.join('\n'))}" style="align-self:flex-start">질문 복사</button>`):''}
  ${blk('주의할 점',`<p>${esc(x.limits)}</p>`,'warn')}
  ${x.exam?blk('시험·헷갈림 포인트',`<p>${esc(x.exam)}</p>`,'box'):''}
  ${blk('핵심어',`<div class="chips">${String(x.keywords).split(',').map(k=>k.trim()).filter(Boolean).map(k=>`<button class="chip" data-act="kw" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>`)}
  ${x.rel.length?blk('함께 보면 좋은 이론',list(x.rel)):''}`}
let lastView='home';
function openSheet(id){if(!T[id])return;store.seen[id]=(store.seen[id]||0)+1;store.recent=[id,...store.recent.filter(i=>i!==id)].slice(0,8);persist();
  $('#shBody').innerHTML=detail(id);$('#shBody').scrollTop=0;document.documentElement.classList.add('lock');$('#ov').classList.add('open');$('#shClose').focus({preventScroll:true})}
function closeSheet(){$('#ov').classList.remove('open');document.documentElement.classList.remove('lock')}

/* 라우팅 */
function render(){const v=st.view;$('#main').innerHTML=({home:vHome,theories:vTheories,compare:vCompare,practice:vPractice,review:vReview})[v]();
  document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===v?'page':'false'))}
function route(){const h=(location.hash||'#home').slice(1);
  if(h.startsWith('t-')&&T[h.slice(2)]){if(!$('#main').innerHTML)render();openSheet(h.slice(2));return}
  closeSheet();const v=VIEWS.includes(h)?h:'home';const ch=v!==st.view||!$('#main').innerHTML;st.view=v;lastView=v;if(ch){if(v!=='theories'&&v!=='home')st.q='';render();window.scrollTo(0,0)}}
const go=h=>{if(location.hash==='#'+h)route();else location.hash=h};
window.addEventListener('hashchange',route);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600)}
function copy(text){const ok=()=>toast('복사했습니다');const no=()=>toast('복사하지 못했습니다. 길게 눌러 직접 복사해 주세요');
  try{navigator.clipboard.writeText(text).then(ok,no)}catch(e){no()}}
function applyPrefs(){const r=document.documentElement;r.classList.remove('fs0','fs1','fs2');r.classList.add('fs'+store.fs);
  if(store.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',store.theme);
  document.querySelectorAll('[data-pref]').forEach(b=>{const [k,v]=b.dataset.pref.split(':');b.setAttribute('aria-pressed',String(store[k])===v)})}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-nav],[data-pref]');
  if(!e.target.closest('#pop')&&!e.target.closest('#popBtn'))$('#pop').classList.remove('on');
  if(!b)return;
  if(b.dataset.nav){go(b.dataset.nav);return}
  if(b.dataset.pref){const [k,v]=b.dataset.pref.split(':');store[k]=k==='fs'?+v:k==='easy'?v==='true':v;persist();applyPrefs();if(k==='easy')render();return}
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='open')go('t-'+b.dataset.id);
  else if(a==='close')go(lastView);
  else if(a==='fam'){st.filter=v;st.q='';st.keyOnly=false;st.view='';go('theories')}
  else if(a==='filter'){st.filter=v;render()}
  else if(a==='keyonly'){st.keyOnly=!st.keyOnly;$('#res').innerHTML=thBody()}
  else if(a==='sort'){st.sort=st.sort==='ko'?'yr':'ko';$('#res').innerHTML=thBody()}
  else if(a==='seg'){st.seg[b.dataset.name]=v;render()}
  else if(a==='save'){const id=b.dataset.id;store.saved=store.saved.includes(id)?store.saved.filter(i=>i!==id):[id,...store.saved];persist();const on=store.saved.includes(id);b.textContent=on?'스크랩됨':'스크랩';b.className='btn s'+(on?' p':'');toast(on?'스크랩에 담았습니다':'스크랩에서 뺐습니다');if(st.view==='review')render()}
  else if(a==='kw'){st.q=v;st.filter='all';st.keyOnly=false;st.view='';go('theories')}
  else if(a==='copy')copy(b.dataset.t);
  else if(a==='memo'){const t=TOOLS.memo.map((m,i)=>`[${m}]\n${$('#m'+i).value.trim()||'-'}`).join('\n\n');copy(t)}
  else if(a==='memoclr'){TOOLS.memo.forEach((m,i)=>$('#m'+i).value='')}
  else if(a==='flip'){st.shown=true;$('#fc').innerHTML=cardHTML()}
  else if(a==='rate'){const id=st.deck[st.di];store.box[id]=+v===0?0:+v===1?1:Math.min(3,Math.max(2,(store.box[id]||0)+1));persist();st.di++;st.shown=false;render()}
  else if(a==='scope'){st.scope=v;buildDeck();render()}
  else if(a==='redeck'){buildDeck();render()}
  else if(a==='dictf'){st.dictF=v;render()}
  else if(a==='pop'){$('#pop').classList.toggle('on')}
  else if(a==='reset'){if(b.dataset.sure){store.saved=[];store.seen={};store.box={};store.recent=[];persist();delete b.dataset.sure;b.textContent='학습 기록 지우기';toast('기록을 지웠습니다');render()}else{b.dataset.sure=1;b.textContent='한 번 더 누르면 지워집니다'}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){st.q=t.value;$('#res').innerHTML=st.view==='home'?homeBody():thBody()}
  else if(t.id==='dq'){st.dictQ=t.value;$('#dres').innerHTML=dictBody()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov').classList.contains('open'))go(lastView);$('#pop').classList.remove('on')}});
applyPrefs();route();

</script><script src="../assets/marker.js" defer></script>
</body></html>
