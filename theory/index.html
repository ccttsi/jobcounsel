<!DOCTYPE html>
<html lang="ko"><head>
<script>
/* 사이트 공통 테마. 첫 화면의 설정(jc-theme)을 따르고, 자동이면 오전 7시~오후 7시는 밝게, 그 밖에는 어둡게 바꾼다.
   이 문서의 테마 버튼을 누르면 그 선택이 사이트 전체 설정이 된다. */
(function(){var K='jc-theme',d=document.documentElement,ready=false;
function mode(){try{var m=localStorage.getItem(K);return (m==='light'||m==='dark')?m:'auto';}catch(e){return 'auto';}}
function want(){var m=mode();if(m!=='auto')return m;var h=new Date().getHours();return (h>=7&&h<19)?'light':'dark';}
function apply(){var t=want();if(d.getAttribute('data-theme')!==t)d.setAttribute('data-theme',t);}
apply();
if(window.MutationObserver)new MutationObserver(function(list){
  for(var i=0;i<list.length;i++){
    if(!ready)continue;
    var v=d.getAttribute('data-theme');
    if(v===list[i].oldValue||v===want())continue;
    try{localStorage.setItem(K,(v==='light'||v==='dark')?v:'auto');}catch(e){}
    if(v!=='light'&&v!=='dark')apply();
  }
}).observe(d,{attributes:true,attributeFilter:['data-theme'],attributeOldValue:true});
window.addEventListener('load',function(){setTimeout(function(){apply();ready=true;},0);});
window.addEventListener('pageshow',apply);
window.addEventListener('storage',function(e){if(e.key===K)apply();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)apply();});
setInterval(apply,30000);})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>직업상담 이론 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 모바일은 상단 바 + 하단 탭 5개, 넓은 화면은 상단 탭. 본문은 한 단, 상세는 시트로 연다. */
  --bg:#f3f5f1;--surface:#ffffff;--sunk:#e9ede7;--ink:#14201b;--muted:#5a6660;--line:#dde2db;
  --accent:#0a6b58;--accent-ink:#ffffff;--accent-soft:#dcefe8;--warn:#9a5b00;--warn-soft:#fbf0d9;
  --fam-s:58%;--fam-l:36%;--fam-a:.13;
  --display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --fs:17px;--r:16px;--shadow:0 1px 2px rgba(20,32,27,.05),0 8px 24px -12px rgba(20,32,27,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412;--surface:#171f1c;--sunk:#1e2824;--ink:#e9efeb;--muted:#9aa9a2;--line:#2a3631;
  --accent:#5fd0b3;--accent-ink:#06231c;--accent-soft:#17332b;--warn:#f0b455;--warn-soft:#33270f;
  --fam-s:55%;--fam-l:70%;--fam-a:.2;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412;--surface:#171f1c;--sunk:#1e2824;--ink:#e9efeb;--muted:#9aa9a2;--line:#2a3631;
  --accent:#5fd0b3;--accent-ink:#06231c;--accent-soft:#17332b;--warn:#f0b455;--warn-soft:#33270f;
  --fam-s:55%;--fam-l:70%;--fam-a:.2;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);color-scheme:dark}
:root.fs0{--fs:15.5px}:root.fs2{--fs:19.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.65 var(--body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
.fam{--c:hsl(var(--h) var(--fam-s) var(--fam-l));--cb:hsl(var(--h) 55% 50% / var(--fam-a))}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:880px;margin:auto;display:flex;align-items:center;gap:12px;height:54px;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.brand{font-family:var(--display);font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand i:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.tnav{display:none;gap:2px}
.tnav button{padding:7px 13px;border-radius:99px;font-size:.88rem;font-weight:600;color:var(--muted)}
.tnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none}
.ib:hover{background:var(--sunk);color:var(--ink)}
main{max-width:880px;margin:auto;padding:20px max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:26px;min-height:70vh}

/* 하단 탭 */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.68rem;font-weight:600;color:var(--muted)}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--accent)}
@media (min-width:860px){.bnav{display:none}.tnav{display:flex}main{padding-bottom:64px}}

/* 공통 */
.hero h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:700}
.hero p{color:var(--muted);margin-top:8px;max-width:34em}
.sec{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sh h2{font-size:1.2rem;font-weight:700}
.sh small,.hint{color:var(--muted);font-size:.84rem}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:54px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 44px 0 46px;font-size:1rem;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .clr{position:absolute;right:8px;top:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:.55em}
.rt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.rt b{font-weight:700;line-height:1.4}
.rt small{color:var(--muted);font-size:.8rem}
.rt em{font-style:normal;color:var(--muted);font-size:.9rem;line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd{flex:none;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-top:.3em;white-space:nowrap}
.bd.w{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip .dot{margin:0;width:8px;height:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--c)}
.tile b{line-height:1.35}
.tile small{color:var(--muted);font-size:.82rem;line-height:1.45}
.tile:hover{box-shadow:var(--shadow)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(225deg)}
details.acc>summary span{display:flex;flex-direction:column}
details.acc>summary small{color:var(--muted);font-size:.84rem;font-weight:400}
details.acc .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
details.acc .list{border-radius:12px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:.88rem;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kv{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
.kv>div{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv dt{font-weight:700}
.kv dd{margin:0;color:var(--muted)}
@media (min-width:600px){.kv>div{grid-template-columns:11em 1fr;gap:16px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:.92rem}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{padding:6px 11px;font-size:.8rem;border-radius:9px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.88rem}
.steps-n{counter-reset:s;display:flex;flex-direction:column;gap:0}
.steps-n>li{counter-increment:s;list-style:none;position:relative;padding:0 0 18px 42px}
.steps-n>li:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.steps-n>li:after{content:"";position:absolute;left:13.5px;top:32px;bottom:4px;width:1.5px;background:var(--line)}
.steps-n>li:last-child:after{display:none}
.steps-n{margin:0;padding:0}
.qs{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.q{background:var(--accent-soft);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:.93rem}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button{font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--cb);color:var(--c)}
.mini button:hover{outline:1.5px solid var(--c)}
textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:600}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
label.ck input{width:20px;height:20px;margin-top:.2em;accent-color:var(--accent);flex:none}
.yr{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.95rem;margin:6px 0 2px}

/* 상세 시트 */
.back{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.45);display:none}
.sheet{position:fixed;z-index:41;inset:0;background:var(--bg);display:none;flex-direction:column}
.open .back{display:block}.open .sheet{display:flex;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.open .sheet{animation:none}}
.sh-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-top .lab{margin-right:auto;font-size:.82rem;font-weight:700;color:var(--c);background:var(--cb);padding:4px 10px;border-radius:99px;margin-left:4px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px max(18px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.sh-body>*{max-width:680px;width:100%;margin-left:auto;margin-right:auto}
.d-h h1{font-size:clamp(1.5rem,5.4vw,2rem);font-weight:700}
.d-h p{color:var(--muted);font-size:.9rem;margin-top:6px}
.lead{font-family:var(--display);font-size:1.16rem;line-height:1.6;font-weight:500;padding-left:14px;border-left:3px solid var(--c)}
.blk{display:flex;flex-direction:column;gap:8px}
.blk h3{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.blk.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.blk.warn{background:var(--warn-soft);border-radius:var(--r);padding:16px}
.blk.warn h3{color:var(--warn)}
@media (min-width:860px){.sheet{inset:4vh 0;margin:auto;width:min(760px,92vw);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}.sh-top{padding-top:10px}}

/* 도식 */
.viz{background:var(--sunk);border-radius:var(--r);padding:16px}
.v-steps{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}
.v-steps span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.86rem;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.v-steps span b{color:var(--c);font-variant-numeric:tabular-nums}
.v-steps i{color:var(--muted);font-style:normal;padding:0 2px}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v-grid span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:.9rem;text-align:center}
.v-pyr{display:flex;flex-direction:column;align-items:center;gap:5px}
.v-pyr span{background:var(--c);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:.84rem;font-weight:700;text-align:center;min-width:42%}
.v-hex svg{display:block;width:100%;max-width:340px;margin:auto;height:auto}
.v-hex text{font:600 13px var(--body);fill:var(--ink)}
.v-hex .ln{stroke:var(--c);stroke-width:2;fill:hsl(var(--h) 55% 50% / .1)}
.v-hex .dg{stroke:var(--line);stroke-width:1}
.v-hex circle{fill:var(--c)}

/* 카드 복습 */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;min-height:260px;box-shadow:var(--shadow);border-top:5px solid var(--c)}
.fc h2{font-size:1.45rem}
.fc .ans{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.86rem;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.pop{position:fixed;z-index:50;right:max(12px,env(safe-area-inset-right));top:calc(58px + env(safe-area-inset-top));width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:none;flex-direction:column;gap:14px}
.pop.on{display:flex}
.pop h3{font-family:var(--body);font-size:.8rem;color:var(--muted)}
footer{color:var(--muted);font-size:.78rem;line-height:1.6;border-top:1px solid var(--line);padding-top:16px}

</style></head><body>

<script>
const BASE=[{"id":"parsons","title":"특성-요인이론","person":"Frank Parsons · E. G. Williamson","year":"1909","keywords":"자기이해, 직업이해, 합리적 추론","summary":"개인의 특성과 직업의 요건을 체계적으로 연결한다.","detail":"① 자기이해: 흥미·능력·성격·가치 탐색 ② 직업이해: 과업·자격·환경·전망 조사 ③ 추론: 두 정보를 비교해 선택한다. 윌리엄슨은 이를 분석-종합-진단-예후-상담-추수의 지시적 과정으로 구조화했다.","use":"정보가 부족하거나 선택지를 좁혀야 할 때 직무요건표와 개인 특성표를 나란히 놓는다.","limits":"사람을 고정된 점수로 환원하거나 검사 하나로 직업을 처방하지 않는다. 기회·차별·돌봄 등 환경 요인도 함께 본다.","related":"holland,twa,cip","fam":"fit"},{"id":"freud","title":"정신분석·정신역동 관점","person":"Sigmund Freud 및 정신역동 전통","year":"1900","keywords":"무의식, 방어기제, 갈등, 전이, 승화","summary":"현재의 선택과 관계에 영향을 주는 무의식적 갈등과 반복 패턴을 살핀다.","detail":"직업은 욕구·갈등·가치가 표현되는 삶의 영역일 수 있다. 방어기제(억압·합리화·투사 등), 전이·역전이, 초기 관계 경험을 탐색하되 현대 직업상담에서는 진단보다 현재 기능과 의미를 이해하는 보조 렌즈로 쓴다.","use":"반복되는 직업 선택, 권위자와의 갈등, 실패 회피, 과도한 성취 추구의 정서적 의미를 탐색한다.","limits":"직업선택을 단일한 무의식 원인으로 설명하지 않는다. 깊은 외상 탐색은 전문 임상 역량과 안전한 의뢰 체계가 필요하다.","related":"adler,rogers,defense","fam":"mind"},{"id":"adler","title":"개인심리학","person":"Alfred Adler","year":"1912","keywords":"열등감, 보상, 생활양식, 사회적 관심, 격려","summary":"사람은 열등감의 보상과 소속·기여를 향해 목적 지향적으로 움직인다고 본다.","detail":"생활양식은 자신·타인·세계에 대한 일관된 믿음과 행동양식이다. 직업·우정·사랑은 주요 생활과제이며, 사회적 관심과 공동체 감각을 강조한다.","use":"실패 후 위축된 내담자의 강점과 기여 경험을 찾고, 격려와 작은 도전 과제를 설계한다.","limits":"열등감이라는 말로 구조적 차별이나 실제 자원 부족을 개인 심리로 돌리지 않는다.","related":"freud,rogers,maslow","fam":"mind"},{"id":"jung","title":"분석심리·심리유형","person":"Carl Jung","year":"1921","keywords":"내향·외향, 심리기능, 원형, 개성화","summary":"개인의 심리적 선호와 통합·성장 과정을 이해한다.","detail":"내향/외향과 사고·감정·감각·직관의 기능 개념이 이후 성격유형 도구에 영향을 주었다. 유형은 선호를 대화하는 언어이지 능력이나 직업 적합성을 확정하는 진단이 아니다.","use":"에너지 충전 방식, 정보 처리, 의사결정 선호를 묻는 대화의 출발점으로 활용한다.","limits":"유형검사를 고정된 꼬리표나 채용·배치의 단독 기준으로 사용하지 않는다.","related":"holland,bigfive","fam":"fit"},{"id":"skinner","title":"조작적 조건형성","person":"B. F. Skinner","year":"1938","keywords":"강화, 소거, 벌, 행동형성, 강화계획","summary":"행동은 그 뒤에 따르는 결과에 의해 빈도와 지속성이 달라진다.","detail":"정적 강화는 자극을 더해 행동을 늘리고, 부적 강화는 불쾌한 자극을 제거해 행동을 늘린다. 벌은 행동을 줄이려는 결과이며 강화와 혼동하면 안 된다. 행동형성은 목표 행동을 작은 단계로 나눠 근사 행동을 강화한다.","use":"구직 행동을 주간 단위의 관찰 가능한 행동으로 쪼개고, 실행 직후 자기강화·피드백을 연결한다.","limits":"외적 보상만으로 동기를 설명하지 않으며, 자율성·경제적 조건·정서적 장벽을 함께 고려한다.","related":"bandura,beck,deciryan","fam":"learn"},{"id":"rogers","title":"인간중심·내담자중심 상담","person":"Carl Rogers","year":"1942/1957","keywords":"공감, 무조건적 긍정적 존중, 일치성, 자기개념","summary":"관계의 안전감 속에서 내담자가 자기 경험을 탐색하고 성장하도록 돕는다.","detail":"상담자의 핵심 태도는 공감적 이해, 무조건적 긍정적 존중, 진실성/일치성이다. 상담자는 답을 대신 정하기보다 내담자의 경험과 자기개념을 명료화한다.","use":"진로 갈등을 충분히 말할 수 있는 관계를 만들고, 외부 기대와 자신의 욕구를 구분한다.","limits":"비지시성이 정보 제공이나 구조화의 부재를 뜻하지 않는다. 필요할 때 전문적 정보와 구조를 제공한다.","related":"maslow,frankl,gestalt","fam":"mind"},{"id":"maslow","title":"욕구위계이론","person":"Abraham Maslow","year":"1943","keywords":"생리, 안전, 소속, 존중, 자아실현","summary":"욕구 충족의 맥락이 동기와 선택에 영향을 준다고 본다.","detail":"흔히 생리-안전-소속-존중-자아실현으로 설명하지만 욕구가 항상 엄격한 한 방향으로만 작동하는 것은 아니다. 직업은 생계·안전·관계·인정·성장 욕구를 동시에 충족하거나 좌절시킨다.","use":"이직 희망을 성장 욕구로만 해석하지 말고 임금·안전·관계·존중 조건을 함께 확인한다.","limits":"단계표를 보편적이고 고정된 법칙처럼 적용하지 않는다.","related":"deciryan,herzberg,frankl","fam":"motive"},{"id":"frankl","title":"의미치료·로고테라피","person":"Viktor Frankl","year":"1946","keywords":"의미 의지, 태도 가치, 창조 가치, 경험 가치, 의미","summary":"인간은 상황 속에서도 의미를 발견하고 태도를 선택하려는 존재라고 본다.","detail":"의미의 통로를 창조 가치(무엇을 하는가), 경험 가치(무엇을 경험하고 누구를 만나는가), 태도 가치(바꿀 수 없는 상황에 취하는 태도)로 설명한다. 창조 가치는 일을 통해 무엇을 만들어 내는가, 경험 가치는 관계와 경험에서 무엇을 얻는가, 태도 가치는 바꿀 수 없는 상황에 어떤 태도를 취하는가에 관한 구분이다.","use":"일의 의미, 소명, 상실 이후의 방향을 탐색하되 현실적인 생계 계획과 병행한다. 직무를 바꾸기 어려운 시기에는 현재 가능한 과업·관계의 의미와 바꿀 수 있는 노동조건을 구분해 본다.","limits":"부당한 노동조건이나 빈곤을 의미 찾기로 견디라고 요구하지 않는다. 태도 가치를 강조해 부당한 환경을 감내하도록 해서는 안 된다. 가능한 환경 개선과 권리 행사를 함께 다룬다.","related":"rogers,savickas,pwt","fam":"mind"},{"id":"ellis","title":"합리정서행동치료 REBT","person":"Albert Ellis","year":"1955","keywords":"ABC, 비합리적 신념, 논박, 수용","summary":"사건 자체보다 사건에 대한 신념이 정서와 행동에 영향을 준다고 본다.","detail":"A(선행사건)-B(신념)-C(정서·행동 결과)를 살피고, 당위적 요구·파국화·좌절 인내력 부족·자기/타인 가치의 전면 평가 등을 논박한다.","use":"면접 탈락을 “나는 무가치하다”로 일반화하는 생각을 검토하고 유연한 대안 신념을 만든다.","limits":"현실적인 차별·불안정 노동시장 문제를 왜곡된 생각으로 치부하지 않는다.","related":"beck,skinner,rogers","fam":"learn"},{"id":"beck","title":"인지치료·인지행동 접근","person":"Aaron T. Beck","year":"1960s","keywords":"자동적 사고, 인지왜곡, 핵심신념, 행동실험","summary":"생각·감정·행동의 상호작용을 파악하고 검증 가능한 대안 행동을 실험한다.","detail":"자동적 사고→중간신념→핵심신념의 층으로 인지를 보고, 흑백논리·과잉일반화·파국화 같은 인지왜곡을 협력적 경험주의로 점검한다. 사고기록지·행동실험·소크라테스식 질문을 쓴다.","use":"구직 회피를 유발하는 “연락하면 거절당할 것”을 작은 행동실험으로 검증한다.","limits":"긍정적으로 생각하라는 조언으로 축소하지 말고 실제 장벽과 감정 조절을 다룬다.","related":"ellis,skinner,bandura","fam":"learn"},{"id":"bandura","title":"사회인지이론·자기효능감","person":"Albert Bandura","year":"1977/1986","keywords":"자기효능감, 대리학습, 상호결정론, 자기조절","summary":"개인·행동·환경이 서로 영향을 주며, 할 수 있다는 믿음이 시도와 지속에 영향을 준다.","detail":"자기효능감의 주요 원천은 성공 경험, 대리 경험, 언어적 설득, 생리·정서 상태다. 행동은 개인 요인과 환경과 함께 상호결정된다.","use":"성공 가능성이 높은 작은 구직 과제를 설계하고 모델링·피드백·환경 지원을 붙인다.","limits":"자기효능감 부족을 개인 탓으로만 보지 말고 기술·자원·차별·접근성 문제를 확인한다.","related":"scct,krumboltz,skinner","fam":"learn"},{"id":"holland","title":"성격유형·직업환경 RIASEC","person":"John Holland","year":"1959/1997","keywords":"현실형, 탐구형, 예술형, 사회형, 진취형, 관습형","summary":"개인의 흥미 유형과 직업환경 유형의 일치가 만족·안정과 관련된다고 본다.","detail":"RIASEC 여섯 유형은 현실형(R), 탐구형(I), 예술형(A), 사회형(S), 진취형(E), 관습형(C)이다. 육각형 인접성은 유사성, 대각선은 상대적 차이를 시각화한다. 일치성·일관성·정체성·계층성·환경 특성을 함께 본다.","use":"상위 흥미 코드에서 직무 후보를 만들고 실제 과업·환경·자격을 확인한다.","limits":"흥미 코드가 곧 능력·가치·취업 가능성을 뜻하지 않는다. 육각형 점수는 단독 처방이 아니다.","related":"parsons,twa,super","fam":"fit"},{"id":"super","title":"생애진로발달·생애공간이론","person":"Donald Super","year":"1953/1990","keywords":"자아개념, 생애단계, 생애역할, 진로성숙, 무지개","summary":"진로는 생애 전반에 걸쳐 자아개념을 실행하고 역할을 조정하는 발달 과정이다.","detail":"성장-탐색-확립-유지-쇠퇴 단계는 전형적 경향이며 연령에 기계적으로 고정되지 않는다. 생애진로무지개는 생애공간(학생·근로자·부모 등 역할)과 생애기간을 함께 본다.","use":"경력 공백·돌봄·재취업을 생애역할 변화와 연결해 생애선·역할 지도를 그린다.","limits":"연령 규범으로 내담자의 선택을 제한하지 않는다. 현대 경력은 반복적 전환을 포함한다.","related":"ginzberg,savickas,schlossberg","fam":"dev"},{"id":"ginzberg","title":"직업선택 발달이론","person":"Eli Ginzberg 외","year":"1951/1972","keywords":"환상기, 잠정기, 현실기, 탐색, 구체화","summary":"직업선택은 발달하며 흥미·능력·가치와 현실 조건을 점차 조정하는 과정이다.","detail":"초기 이론은 환상기-잠정기(흥미·능력·가치·전환)-현실기(탐색·구체화·특수화)로 설명했고 이후 수정되었다.","use":"청소년·초기 성인기의 선택 발달을 이해하고 탐색 기회를 제공한다.","limits":"초기 단계 모델을 모든 성인에게 선형적으로 적용하지 않는다.","related":"super,gottfredson","fam":"dev"},{"id":"roe","title":"욕구이론·직업분류","person":"Anne Roe","year":"1951/1956","keywords":"아동기 양육, 욕구, 사람지향·비사람지향","summary":"초기 양육 경험과 욕구 충족이 직업 지향에 관련될 수 있다고 제안한다.","detail":"사람지향/비사람지향과 직업군·수준 분류를 제시했다. 아동기 부모-자녀 관계를 직업선택과 연결하는 가설적 설명이다.","use":"직업 선호와 대인관계 환경 선호를 탐색하는 보조 관점으로 사용한다.","limits":"초기 양육 경험만으로 현재 직업 선택을 예측하거나 단정하지 않는다.","related":"freud,adler,holland","fam":"fit"},{"id":"twa","title":"일-환경 조화이론 TWA","person":"René Dawis · Lloyd Lofquist","year":"1964","keywords":"능력-요구, 욕구-강화, 만족, 충족, 적응, 인내","summary":"개인과 직업환경의 상호 적합과 적응 과정을 설명한다.","detail":"개인의 능력은 환경의 요구를 충족시키고, 환경의 강화체계는 개인의 욕구를 충족시킨다. 환경이 개인에 만족하고 개인이 환경에 만족하는 두 축을 구분한다. 개인은 환경이 제공하는 보상에 만족하고, 환경은 개인의 능력이 요구를 충족할 때 대응이 이루어진다. 만족(satisfaction)과 충족(satisfactoriness)을 구분하며, 근속·인내는 시간과 연결된다.","use":"직무수행은 괜찮지만 만족하지 못하는지, 만족은 하지만 요구를 충족하기 어려운지 나눠 묻는다. “내가 이 직무에서 만족하는가?”와 “조직은 내 수행을 충족스럽게 보는가?”를 분리해 면담한다.","limits":"적합을 개인의 순응으로만 보지 말고 직무 재설계·환경 조정 가능성을 확인한다. 불일치의 책임을 개인에게만 돌리지 않는다. 직무 요구·보상·관리 방식의 조정 가능성을 살핀다.","related":"holland,parsons,super","fam":"fit"},{"id":"krumboltz","title":"사회학습 진로이론·계획된 우연","person":"John Krumboltz","year":"1976/1999/2009","keywords":"학습경험, 유전·환경 요인, 과제접근기술, 호기심, 유연성","summary":"진로는 학습경험과 환경 사건의 상호작용 속에서 형성되며 우연을 기회로 전환할 수 있다.","detail":"진로선택에 영향을 주는 유전적·특수능력, 환경조건·사건, 학습경험, 과제접근기술을 본다. 계획된 우연에서는 호기심·인내·유연성·낙관성·위험감수를 강조한다.","use":"완벽한 진로계획 대신 정보인터뷰·단기 프로젝트·체험 등 작은 탐색 실험을 만든다.","limits":"우연을 강조해 구조적 불평등이나 계획의 필요성을 무시하지 않는다.","related":"bandura,scct,savickas","fam":"learn"},{"id":"scct","title":"사회인지진로이론 SCCT","person":"Robert Lent · Steven Brown · Gail Hackett","year":"1994","keywords":"자기효능감, 결과기대, 목표, 맥락적 지원·장벽","summary":"흥미·선택·수행을 자기효능감, 결과기대, 목표와 환경 맥락의 상호작용으로 설명한다.","detail":"개인 입력·배경 맥락과 학습경험이 자기효능감과 결과기대를 형성하고 흥미·목표·행동으로 이어진다. 근접 맥락의 지원과 장벽은 선택 실행에 영향을 준다.","use":"관심은 높지만 지원이 부족한 내담자에게 효능감 훈련과 장벽 완화 계획을 함께 설계한다.","limits":"자기효능감만 높이면 장벽이 사라진다고 보지 않는다.","related":"bandura,krumboltz,pwt","fam":"learn"},{"id":"gottfredson","title":"제한과 타협이론","person":"Linda Gottfredson","year":"1981","keywords":"성역할, 사회적 지위, 직업 이미지, 제한, 타협","summary":"사회적으로 학습한 직업 이미지가 선택 가능한 대안을 좁히고 현실 조건에 따라 타협이 일어난다고 본다.","detail":"아동·청소년은 성역할과 사회적 지위, 직업의 위신 이미지 등을 바탕으로 수용 가능한 직업 범위를 제한할 수 있다. 현실 제약에 따라 선호와 접근 가능성을 조정한다.","use":"“관심이 없다”는 말 뒤에 성별 규범·계층·가족 기대·접근성 장벽이 있는지 확인한다.","limits":"타협을 개인의 포기로만 보지 말고 제약을 바꿀 수 있는 자원과 정책을 탐색한다.","related":"super,pwt,blustein","fam":"dev"},{"id":"savickas","title":"진로구성주의·생애설계","person":"Mark Savickas","year":"2005/2013","keywords":"진로적응성, 생애주제, 진로정체성, 이야기, 관심, 통제, 호기심, 자신감","summary":"사람은 경험을 이야기로 구성해 진로 정체성과 다음 행동의 의미를 만든다.","detail":"진로적응성의 4C는 관심(concern), 통제(control), 호기심(curiosity), 자신감(confidence)이다. 생애주제와 반복되는 이야기에서 의미를 찾고 진로를 구성한다. 관심은 미래를 준비하는 태도, 통제는 선택에 대한 책임감, 호기심은 가능한 자기·환경을 탐색하는 태도, 자신감은 장애를 극복할 수 있다는 믿음이다.","use":"전환 경험을 이야기로 재구성하고 다음 장에서 시도할 작은 행동을 정한다. 4C 중 낮은 자원을 확인하고 각 요소에 맞는 구체적 행동을 설계한다.","limits":"이야기 작업만으로 고용 기회·소득·자격 문제를 해결할 수는 없다. 적응성을 개인에게만 요구하지 말고 안전한 일자리와 지원 체계도 함께 살핀다.","related":"super,krumboltz,frankl","fam":"dev"},{"id":"cip","title":"인지정보처리 진로이론 CIP","person":"James Sampson · Gary Peterson · Janet Reardon","year":"1991/2004","keywords":"자기지식, 직업지식, 의사결정기술, 실행, 메타인지, CASVE","summary":"진로결정은 지식과 의사결정 기술을 처리하고 실행하는 인지적 과정이다.","detail":"CASVE 순환: 의사소통(문제 인식)-분석-종합-가치평가-실행. 피라미드에는 지식 기반, 의사결정 기술, 실행 처리의 층위가 있다. CASVE는 의사소통(문제 인식)→분석(자기·직업 이해)→종합(대안 생성·축소)→평가(우선순위·결과)→실행의 순환이다. 메타인지는 생각을 점검·조절하는 과정이다.","use":"결정이 막히면 자기지식·직업지식 중 부족한 부분과 메타인지적 방해 생각을 구분한다. 내담자가 직업정보만 계속 검색한다면 지금 CASVE의 어느 단계인지 확인하고 다음 단계 행동을 한 가지 정한다.","limits":"정보를 더 모으는 것이 항상 답은 아니다. 감정·경제·제도적 제약도 병행 평가한다. 모든 내담자에게 선형 단계를 강요하지 않는다. 정서·가족·경제 장벽은 별도로 다룬다.","related":"gati,gelatt,parsons","fam":"decide"},{"id":"gati","title":"진로의사결정 어려움 분류","person":"Itamar Gati 외","year":"1996","keywords":"준비 부족, 정보 부족, 정보 불일치","summary":"진로결정의 어려움을 원인별로 구분해 적절한 개입을 선택한다.","detail":"준비 부족(동기·우유부단·역기능적 신념), 정보 부족(자기·직업·절차·정보 획득 방법), 정보 불일치(모순·신뢰도 문제) 등으로 구분한다.","use":"“결정을 못 한다”를 세분해 정보제공, 신념 점검, 기준 정리 중 무엇이 필요한지 판단한다.","limits":"분류표는 대화의 가설이며 내담자를 고정 유형으로 진단하는 도구가 아니다.","related":"cip,gelatt,ellis","fam":"decide"},{"id":"gelatt","title":"진로의사결정·긍정적 불확실성","person":"H. B. Gelatt","year":"1962/1989","keywords":"정보, 대안, 결과, 가치, 불확실성","summary":"정보와 가치에 근거해 선택하되 불확실성을 유연하게 다룬다.","detail":"가능한 대안과 결과를 탐색하고 가치·선호를 고려한다. 후기의 긍정적 불확실성은 미래의 불확실성을 제거하기보다 유연하고 개방적으로 다루는 태도를 강조한다.","use":"선택지를 2~4개로 구조화하고 결정 기준과 실험 가능한 다음 단계를 정한다.","limits":"예측 불가능성을 이유로 계획이나 책임 있는 검토를 포기하지 않는다.","related":"cip,gati,krumboltz","fam":"decide"},{"id":"tiedeman","title":"진로의사결정 발달이론","person":"David Tiedeman · Robert O’Hara","year":"1963","keywords":"예상기, 실천기, 정체성, 분화, 통합","summary":"진로결정을 선택과 실행을 통해 정체성을 발달시키는 과정으로 본다.","detail":"예상기에는 탐색·구체화·선택·명료화가, 실천기에는 순응·개혁·통합 등이 포함된다. 선택 후 경험을 통합하는 과정도 중요하다.","use":"결정 전 탐색뿐 아니라 결정 후 적응과 재평가까지 상담 목표에 포함한다.","limits":"단계를 기계적 체크리스트로 사용하지 않는다.","related":"super,gelatt,cip","fam":"decide"},{"id":"deciryan","title":"자기결정성이론 SDT","person":"Edward Deci · Richard Ryan","year":"1985","keywords":"자율성, 유능감, 관계성, 내재동기, 외재동기","summary":"자율성·유능감·관계성 욕구의 충족이 자율적 동기와 웰빙을 돕는다.","detail":"외재적 동기도 외적 조절에서 내사·동일시·통합으로 내면화될 수 있다. 자율성은 혼자 결정한다는 뜻이 아니라 선택의 주체성을 경험하는 것이다.","use":"구직활동 계획에서 선택권·성취 가능한 과제·지지 관계를 확보한다.","limits":"내재동기만을 이상화하지 말고 생계와 외적 보상의 현실적 중요성을 인정한다.","related":"maslow,herzberg,bandura","fam":"motive"},{"id":"vroom","title":"기대이론","person":"Victor Vroom","year":"1964","keywords":"기대, 수단성, 유인가","summary":"노력이 성과로 이어질 것이라는 기대와 성과의 보상 가치가 동기를 만든다.","detail":"동기 = 기대(expectancy) × 수단성(instrumentality) × 유인가(valence)로 설명한다. 한 요소가 낮으면 전체 동기가 약해질 수 있다.","use":"구직 노력이 결과로 이어질 가능성, 취업 후 보상, 보상의 개인적 가치를 각각 질문한다.","limits":"공식은 설명 틀이며 실제 동기를 정밀 계산하는 수식으로 오해하지 않는다.","related":"locke,deciryan,bandura","fam":"motive"},{"id":"locke","title":"목표설정이론","person":"Edwin Locke · Gary Latham","year":"1968/1990","keywords":"구체적 목표, 난이도, 피드백, 몰입","summary":"구체적이고 도전적이며 수용된 목표와 피드백이 수행을 높일 수 있다.","detail":"구체적이고 도전적인 목표가 쉽거나 모호한 목표보다 수행을 높인다. 목표 수용, 피드백, 과제 복잡성, 자기효능감이 조건이며 주의 집중·노력·지속·전략이 기제다.","use":"“취업하기”를 “이번 주 채용공고 3개 분석, 1건 지원”처럼 행동 목표로 바꾼다.","limits":"목표를 강요하거나 통제 수단으로 쓰지 말고 자원과 현실 가능성을 점검한다.","related":"skinner,vroom,deciryan","fam":"motive"},{"id":"herzberg","title":"동기-위생이론","person":"Frederick Herzberg","year":"1959","keywords":"동기요인, 위생요인, 직무만족","summary":"직무만족을 높이는 요인과 불만족을 줄이는 요인을 구분한다.","detail":"성취·인정·책임·성장 등 동기요인과 급여·정책·감독·근무조건 등 위생요인을 구분한다. 위생요인 개선만으로 높은 만족이 보장되지는 않는다.","use":"이직 사유를 불만 제거와 성장·성취 추구로 나눠 탐색한다.","limits":"2요인 구분을 모든 직무·문화에 보편적으로 적용하지 않는다.","related":"maslow,deciryan,vroom","fam":"motive"},{"id":"schlossberg","title":"전환이론 4S","person":"Nancy Schlossberg","year":"1981","keywords":"상황, 자기, 지원, 전략, Situation, Self, Support, Strategies","summary":"전환 사건 자체보다 개인이 가진 자원과 대처 전략이 적응에 영향을 준다.","detail":"4S는 Situation(상황), Self(자기), Support(지원), Strategies(전략)이다. 전환은 예상·비예상, 자발·비자발 등으로 경험된다. 상황(Situation), 자기(Self), 지원(Support), 전략(Strategies)을 점검한다. 전환의 시기·통제감·역할 변화·동시 스트레스·과거 경험과 개인 자원·관계망·대처 전략을 함께 본다.","use":"퇴직·실직·복직·이민 등 전환 상황에서 4S 자원 지도를 작성한다. 퇴직·실직·이직 직후 4S 표를 작성하고, 부족한 자원 한 가지를 확보하는 행동을 정한다.","limits":"개인의 대처 전략만 강조하지 말고 제도·경제·돌봄 지원을 연결한다. 4S 체크리스트는 진단 도구가 아니다. 경제·주거·건강·법률 등 전문 서비스가 필요하면 연결한다.","related":"super,savickas,pwt","fam":"context"},{"id":"pwt","title":"심리적 일 이론 PWT","person":"David Blustein · Ryan Duffy 외","year":"2008/2016","keywords":"일할 자유, 경제적 제약, 소외, 괜찮은 일, 권력","summary":"일의 선택과 질은 개인 선호뿐 아니라 경제적 제약·권력·사회구조의 영향을 받는다.","detail":"경제적 제약과 소외 경험이 일할 자유를 제한할 수 있으며, 괜찮은 일(decent work)은 안전·공정한 보상·휴식·가치 공유·사회적 기여 등을 포함한다.","use":"선택지 부족을 동기 문제로 오인하지 말고 소득·돌봄·차별·교통·장애 접근성을 함께 파악한다.","limits":"개인 상담만으로 구조적 문제를 해결할 수 없으므로 권리·복지·고용서비스 자원과 연결한다.","related":"gottfredson,scct,super","fam":"context"},{"id":"blustein","title":"관계·일 심리학","person":"David Blustein","year":"2006","keywords":"일의 심리학, 관계, 생존, 사회적 맥락","summary":"일을 ":"초기 애착 경험이 관계에서의 안전감과 도움 요청 방식에 영향을 줄 수 있다.","detail":"안정·불안·회피 등 애착 패턴은 관계에서의 기대와 정서조절에 연결될 수 있다. 성인 애착은 맥락에 따라 달라질 수 있다. 애착이론은 초기 양육자와의 관계 경험이 내적 작동 모형과 탐색·도움 요청 방식에 영향을 줄 수 있다고 본다. 성인 진로에 직접적인 단일 예측 공식으로 쓰기보다 관계적 맥락을 이해하는 렌즈다.","use":"상담 관계에서 피드백·평가·도움 요청을 어려워하는 패턴을 조심스럽게 탐색한다. 도움 요청을 어려워하거나 평가 상황에서 과도하게 위축되는 내담자에게 안전한 지지자와 작은 탐색 행동을 연결한다.","limits":"짧은 상담으로 애착 유형을 진단하거나 직업행동을 애착으로 환원하지 않는다. 애착유형을 짧은 면담으로 진단하거나 진로 성패를 예측하지 않는다.","related":"freud,rogers,bandura","fam":"mind"},{"id":"bigfive","title":"빅파이브 성격 특질","person":"Costa · McCrae 외","year":"1985/1992","keywords":"개방성, 성실성, 외향성, 우호성, 신경성","summary":"성격 특질의 다섯 차원을 통해 개인차를 기술한다.","detail":"개방성·성실성·외향성·우호성·신경성의 5요인(OCEAN)이다. 성실성은 여러 직무의 수행을 비교적 일관되게 예측하고, 외향성은 영업·관리직에서 단서가 된다.","use":"업무 선호·협업 방식·환경 스트레스 요인을 탐색하는 보조 자료로 사용한다.","limits":"특질 점수를 직무 적합의 절대 기준이나 변화 불가능한 본질로 취급하지 않는다.","related":"jung,holland,parsons","fam":"fit"},{"id":"lewin","title":"장이론","person":"Kurt Lewin","year":"1936/1951","keywords":"B=f(P,E), 생활공간, 장, 역동","summary":"행동은 개인과 환경의 상호작용 속에서 나타난다고 본다.","detail":"B=f(P,E)는 행동이 개인(P)과 환경(E)의 함수임을 나타낸다. 심리적 생활공간과 장의 힘을 통해 행동을 이해한다.","use":"구직 실패를 개인 능력뿐 아니라 노동시장·가족·제도·지역 환경과 함께 분석한다.","limits":"환경을 막연한 배경으로 두지 말고 구체적 자원·장벽으로 기술한다.","related":"pwt,scct,twa","fam":"context"},{"id":"attribution","title":"귀인이론","person":"Fritz Heider · Bernard Weiner","year":"1958/1985","keywords":"내적·외적, 안정성, 통제가능성, 귀인","summary":"성공과 실패의 원인을 어떻게 해석하는지가 기대·정서·후속 행동에 영향을 준다.","detail":"귀인을 소재(내적/외적), 안정성(안정/불안정), 통제가능성 차원으로 살핀다. 능력·노력·과제난이도·운 등을 구분한다.","use":"면접 실패 원인을 “나는 안 돼”로 고정하는지, 수정 가능한 전략과 외부 조건으로 구분하는지 살핀다.","limits":"실패 원인을 무조건 노력 부족으로 돌리지 않는다.","related":"beck,bandura,ellis","fam":"learn"},{"id":"locus","title":"통제소재·사회학습이론","person":"Julian Rotter","year":"1954/1966","keywords":"내적 통제, 외적 통제, 기대, 강화가치","summary":"행동은 결과에 대한 기대와 결과의 가치, 심리적 상황에 영향을 받는다.","detail":"내적 통제소재는 결과가 자신의 행동에 달렸다고 보는 경향, 외적 통제소재는 운·타인·상황에 달렸다고 보는 경향이다.","use":"내가 통제할 수 있는 행동과 통제할 수 없는 구조 조건을 구분해 실행 계획을 세운다.","limits":"내적 통제만 건강하다고 보지 않는다. 현실의 통제 불가능성을 인정해야 한다.","related":"bandura,attribution,scct","fam":"learn"},{"id":"erikson","title":"심리사회적 발달이론","person":"Erik Erikson","year":"1950","keywords":"점성원리, 근면성, 유능감, 정체감, 역할혼미, 심리사회적 유예, 충실성, 친밀감, 생산성, 자아통합","summary":"생애 8단계의 심리사회적 위기와, 그 해결에서 얻는 자아 자질(덕목)로 정체성 발달을 설명한다.","detail":"점성원리에 따라 발달은 정해진 순서로 펼쳐지고 단계마다 위기(전환점)가 있다. ①신뢰 대 불신→희망 ②자율성 대 수치·의심→의지 ③주도성 대 죄책감→목적의식 ④근면성 대 열등감→유능감 ⑤정체감 대 역할혼미→충실성 ⑥친밀감 대 고립→사랑 ⑦생산성 대 침체→배려 ⑧자아통합 대 절망→지혜. 긍정 극이 우세하게 해결되면 자아 자질(덕목)이 얻어진다.","use":"학령기 근면성·유능감 경험은 직업 흥미와 성취감의 토대가 된다(슈퍼의 성장기와 연결). 청소년·청년기에는 심리사회적 유예를 허용하며 진로정체감을, 중년에는 생산성과 멘토링 동기를, 노년에는 일의 의미 통합을 다룬다.","limits":"단계·연령은 규범이나 결핍 판정이 아니며 문화·성별·시대에 따라 다르다. 유능감은 근면성 단계의 자아 자질이고, 특정 과제를 해낼 수 있다는 신념인 반두라의 자기효능감과 구분해야 한다.","related":"super,marcia,savickas,havighurst,levinson","fam":"mind"},{"id":"marcia","title":"정체감 지위이론","person":"James Marcia","year":"1966","keywords":"탐색, 전념, 성취, 유예, 폐쇄, 혼미","summary":"탐색과 전념 수준에 따라 정체감 형성 상태를 설명한다.","detail":"정체감 성취(탐색 후 전념), 유예(탐색 중), 폐쇄(탐색 없이 전념), 혼미(탐색·전념 모두 낮음)를 구분한다.","use":"진로결정을 서두르기보다 탐색이 필요한지, 선택을 구체화할 시점인지 판단한다.","limits":"상태를 고정된 성격이나 병리로 보지 않고 영역·시점에 따라 달라짐을 고려한다.","related":"erikson,super,gati","fam":"mind"},{"id":"piaget","title":"인지발달이론","person":"Jean Piaget","year":"1936","keywords":"도식, 동화, 조절, 평형화","summary":"사람은 경험을 기존 도식에 통합하거나 도식을 수정하며 인지를 발달시킨다.","detail":"인지는 감각운동기(0~2세)→전조작기(2~7세)→구체적 조작기(7~11세)→형식적 조작기(11세~)로 질적으로 달라진다. 동화·조절을 통한 평형화로 도식이 발달한다.","use":"직업 세계에 대한 고정관념을 실제 직무 체험과 정보로 재검토하도록 돕는다.","limits":"아동 발달 단계 모델을 성인 진로상담에 직접 적용하지 않는다.","related":"kelly,beck,krumboltz","fam":"dev"},{"id":"kelly","title":"개인구성개념이론","person":"George Kelly","year":"1955","keywords":"개인구성개념, 양극, 레퍼토리 그리드","summary":"개인은 자신만의 해석 틀로 경험과 사람·직업을 이해한다고 본다.","detail":"개인구성개념은 경험을 예측하고 해석하는 틀이며, 양극적 차원으로 표현되기도 한다. 레퍼토리 그리드는 구성개념을 탐색하는 도구다.","use":"“좋은 직업/나쁜 직업”을 가르는 내담자만의 기준을 언어화하고 재구성한다.","limits":"상담자가 가진 가치 기준을 내담자에게 투사하지 않는다.","related":"savickas,rogers,beck","fam":"dev"},{"id":"narrative","title":"이야기치료·내러티브 접근","person":"Michael White · David Epston 외","year":"1990","keywords":"외재화, 지배적 이야기, 대안 이야기, 재저작, 생애주제, 전환 이야기, 롤모델, 초기기억","summary":"문제를 사람과 분리하고 대안적 삶의 이야기를 발견한다.","detail":"문제의 외재화, 지배적 이야기의 해체, 예외·가치·관계의 발견, 대안 이야기의 재저작을 활용한다. 내러티브 접근은 사실의 나열보다 사건에 부여한 의미와 정체성 이야기를 탐색한다. 사비카스의 진로구성 면접은 롤모델·좋아한 이야기·좌우명·초기기억 등에서 생애 주제를 찾는다.","use":"“나는 실패자”를 “실패 경험이 나를 압도한 시기”로 분리하고 예외 경험을 찾는다. 중요한 전환 3개를 적고 각 사건에서 반복된 가치·강점·관계 주제를 찾아 다음 직업 실험으로 연결한다.","limits":"구조적 문제를 개인의 이야기 재구성으로만 해결할 수 있다고 말하지 않는다. 상담자가 이야기를 대신 해석하거나 특정한 긍정 서사를 강요하지 않는다.","related":"savickas,kelly,rogers","fam":"dev"},{"id":"selfconcept","title":"자아개념·자기불일치","person":"Carl Rogers · E. Tory Higgins 외","year":"1950s/1987","keywords":"실제자기, 이상자기, 당위자기, 자기일치","summary":"자신이 누구라고 느끼는지와 기대되는 모습의 차이가 정서·선택에 영향을 준다.","detail":"로저스의 자기개념과 히긴스의 실제-이상-당위 자기 간 불일치 관점을 구분해 참고한다.","use":"부모·사회가 기대하는 직업과 자신이 원하는 삶의 차이를 구체화한다.","limits":"자기일치만을 정답으로 두지 말고 생계·관계·책임을 함께 고려한다.","related":"rogers,erikson,savickas","fam":"mind"},{"id":"stress","title":"스트레스·대처 이론","person":"Richard Lazarus · Susan Folkman","year":"1984","keywords":"인지적 평가, 문제중심, 정서중심 대처","summary":"스트레스는 상황에 대한 평가와 대처 자원의 상호작용으로 경험된다.","detail":"라자루스와 폴크먼의 상호작용 모형: 1차 평가(위협·도전)와 2차 평가(대처 자원)로 스트레스 정도가 정해지며, 문제중심·정서중심 대처를 구분한다.","use":"면접 불안·실직 스트레스에서 바꿀 수 있는 문제와 정서 조절이 필요한 부분을 나눈다.","limits":"정서중심 대처를 회피로 단정하지 않으며 심각한 정신건강 문제는 적절히 의뢰한다.","related":"schlossberg,bandura,beck","fam":"motive"},{"id":"burnout","title":"직무소진·직무요구-자원 관점","person":"Christina Maslach · Demerouti 외","year":"1981/2001","keywords":"정서적 고갈, 냉소, 효능감, 요구, 자원, 노력-보상 불균형","summary":"지속적인 직무요구와 부족한 자원이 소진 위험을 높일 수 있다.","detail":"소진의 대표 차원은 정서적 고갈·냉소·개인적 성취감 저하다. JD-R은 직무요구와 직무자원의 균형을 살핀다. 마슬랙의 소진 차원은 정서적 고갈·냉소(비인격화)·개인적 성취감 저하다. 노력-보상 불균형과 직무환경의 비타민 모형은 스트레스 맥락을 추가로 설명한다.","use":"이직 상담에서 개인 회복 전략과 업무량·통제권·지원·보상 등 조직 요인을 함께 평가한다. 업무량·감정노동·통제권·보상·공정성·지원·회복시간을 점검하고, 직무조정·휴식·조직 내 협의·전직 선택지를 검토한다.","limits":"소진을 개인의 회복탄력성 부족으로만 설명하지 않는다. 소진을 시간관리나 마음가짐 문제로만 다루지 않는다. 심각한 우울·불안·자살 위험은 전문 평가와 위기 대응이 필요하다.","related":"herzberg,pwt,stress","fam":"motive"},{"id":"positive","title":"긍정심리·강점 접근","person":"Martin Seligman · Mihaly Csikszentmihalyi 외","year":"1998–","keywords":"강점, 몰입, 희망, 회복탄력성, PERMA","summary":"결함 교정뿐 아니라 강점과 웰빙 자원을 발견하고 활용한다.","detail":"PERMA는 긍정정서·몰입·관계·의미·성취를 설명하는 틀이다. 강점은 맥락과 과제에 따라 다르게 발휘된다.","use":"과거 몰입 경험에서 강점과 환경 조건을 추출해 직무 탐색에 연결한다.","limits":"긍정성 강요, 고통의 축소, 구조적 문제의 개인 책임화를 피한다.","related":"frankl,savickas,deciryan","fam":"motive"},{"id":"socialjustice","title":"다문화·사회정의 진로상담","person":"Frederick Leong · Fouad · 상담 사회정의 전통","year":"1990s–","keywords":"문화, 권력, 차별, 접근성, 옹호, 교차성","summary":"진로는 문화·권력·제도와 연결되므로 개인과 환경을 함께 변화 대상으로 본다.","detail":"문화적 정체성, 차별 경험, 제도적 장벽, 자원 접근, 상담자의 권력·편견을 점검한다. 개인 개입과 조직·지역사회 옹호를 연결한다.","use":"장애·이주·성별·연령·계층 맥락에서 지원·편의·권리·정책 자원을 함께 탐색한다.","limits":"내담자를 집단 고정관념으로 해석하지 않고 자기정의와 동의를 우선한다.","related":"pwt,blustein,gottfredson","fam":"context"},{"id":"assessment","title":"심리검사·평가의 통합 원칙","person":"직업심리평가 전반","year":"현대","keywords":"타당도, 신뢰도, 규준, 다방법, 피드백","summary":"검사는 상담 질문을 정교화하는 자료이지 사람을 대신 판단하는 결론이 아니다.","detail":"흥미·적성·성격·가치·역량·직업정보를 목적에 맞게 선택한다. 표준화·타당도·신뢰도·규준·검사 상황을 확인하고 면담·행동·환경정보와 통합한다.","use":"검사 전 목적과 한계를 설명하고, 결과를 내담자 언어로 피드백하며 불일치 자료를 함께 검토한다.","limits":"검사 결과만으로 진단·채용·직업 처방을 하지 않는다. 저작권·자격·윤리 기준을 준수한다.","related":"parsons,holland,bigfive","fam":"assess"},{"id":"defense","title":"방어기제","person":"정신역동 전통","year":"1900–","keywords":"억압, 부인, 투사, 합리화, 반동형성, 승화, 부정, 지성화","summary":"불안을 줄이기 위해 자동적으로 작동하는 심리적 처리 방식을 이해한다.","detail":"방어는 맥락에 따라 일시적으로 보호 기능을 할 수 있다. 억압·부인·투사·합리화·반동형성·승화 등 용어를 구분하되 관찰만으로 단정하지 않는다. 방어기제는 불안·갈등을 다루는 방식이다. 부정·투사·합리화·지성화·억압·승화 등으로 설명되며, 같은 행동도 맥락에 따라 다른 의미를 가질 수 있다.","use":"“관심 없다”는 표현 뒤의 불안·수치·실패 두려움을 비판 없이 탐색한다. 실패 경험 뒤 “그 회사는 원래 별로였다”고 말할 때 이를 방어로 단정하지 말고 실망·상처·현실적 판단이 각각 있는지 탐색한다.","limits":"상담자가 방어기제를 낙인처럼 붙이거나 내담자에게 해석을 강요하지 않는다. 상담자가 방어기제를 진단명처럼 붙이지 않는다. 방어는 적응 기능도 가질 수 있다.","related":"freud,adler,rogers","fam":"mind"},{"id":"careeranchors","title":"경력닻","person":"Edgar Schein","
