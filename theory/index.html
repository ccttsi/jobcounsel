다.","use":"경력단절·이직 상담에서 근무시간·돌봄 분담·유연근무·가족 지원을 구체적으로 확인한다.","limits":"돌봄 책임을 개인의 선택 문제로만 보지 말고 성별·제도·조직 조건을 함께 본다.","related":"super,pwt,schlossberg","fam":"motive"},{"id":"williamson","title":"지시적 상담·특성-요인 상담","person":"E. G. Williamson","year":"1939","keywords":"분석, 종합, 진단, 예후, 상담, 추수","summary":"검사와 직업정보를 분석해 상담자가 구조화된 선택 지원을 제공한다.","detail":"미네소타식 6단계는 분석(자료 수집)→종합(자료 조직)→진단(문제 규정)→예후(가능성 검토)→상담(개입)→추수(결과 점검)이다. 무선택·불확실한 선택·흥미와 적성 불일치·비현실적 선택 등 문제 유형을 구분한다.","use":"내담자가 선택지를 전혀 좁히지 못하면 흥미·능력·가치와 직무요건을 표로 정리하고, 정보 공백을 확인한 뒤 선택 대안을 함께 검토한다.","limits":"상담자 주도는 정보와 전문성을 제공한다는 뜻이지 내담자의 자율성을 대신한다는 뜻이 아니다. 검사 결과만으로 진단·처방하지 않는다.","related":"parsons,holland,assessment","fam":"fit"},{"id":"hoppock","title":"욕구충족 직업선택이론","person":"Robert Hoppock","year":"1957","keywords":"욕구충족, 직업만족, 정보, 선택","summary":"직업은 개인의 욕구를 충족하는 수단이며 만족은 욕구 충족과 관련된다.","detail":"직업 선택은 개인이 중요하게 여기는 욕구를 인식하고, 직업이 그 욕구를 얼마나 충족할지 지각하는 과정으로 이해한다. 욕구는 생계·안전뿐 아니라 관계·인정·성장 등 다양하다.","use":"“이 일이 무엇을 충족해 주어야 오래 할 수 있나요?”를 묻고 욕구별 중요도와 후보 직무의 실제 조건을 비교한다.","limits":"욕구 위계처럼 고정된 단계로 단순화하지 말고, 개인·문화·생애 맥락에 따라 욕구의 우선순위가 달라짐을 고려한다.","related":"maslow,herzberg,workvalues","fam":"motive"},{"id":"crites","title":"진로성숙·포괄적 직업상담 모형","person":"John O. Crites","year":"1961/1973/1981","keywords":"진로성숙, 적응성, 결정성, 현실성, 진단-과정-결과","summary":"진로 문제를 적응성·결정성·현실성으로 나누고 진단-과정-결과를 연결한다.","detail":"진로성숙은 진로 선택과 발달 과업을 다룰 준비도와 관련된다. 크라이티스는 직업문제를 적응성(선택과 자아·직업의 조화), 결정성(선택의 확실성), 현실성(선택의 현실적 실행 가능성)으로 구분하고 상담을 진단·과정·결과로 체계화했다.","use":"내담자의 문제를 “결정하지 못함”으로 뭉뚱그리지 말고 결정성·현실성·적응성 중 어디가 취약한지 구분해 개입한다.","limits":"발달 단계나 검사 점수로 사람을 서열화하지 않는다. 준비도는 상황과 기회에 따라 달라질 수 있다.","related":"careerdecision,super,gati","fam":"dev"},{"id":"dinklage","title":"딩클리지의 의사결정 8유형","person":"Lee Dinklage","year":"1968","keywords":"충동형, 운명형, 순응형, 지연형, 고민형, 직관형, 마비형, 계획형","summary":"사람마다 결정을 미루거나 내리는 방식이 다르므로 의사결정 과정에 맞춰 돕는다.","detail":"대표 유형은 충동형·운명형·순응형·지연형·고민형·직관형·마비형·계획형이다. 유형은 고정 성격이 아니라 특정 상황에서 나타나는 경향으로 다룬다.","use":"“결정을 앞두면 보통 무엇을 하시나요?”라고 묻고 정보 수집·타인 의존·지연·충동 중 현재 패턴을 확인한다.","limits":"유형을 낙인처럼 붙이지 않는다. 시간 압박, 정보 접근성, 위험 수준이 의사결정 방식에 영향을 준다.","related":"harren,gelatt,gati","fam":"decide"},{"id":"harren","title":"해런의 의사결정 3양식","person":"Vance Harren","year":"1979","keywords":"합리적, 직관적, 의존적","summary":"합리적·직관적·의존적 의사결정 양식을 구분해 상담 방식을 조정한다.","detail":"합리적 양식은 정보와 대안을 체계적으로 검토하고, 직관적 양식은 감각·정서적 판단을 활용하며, 의존적 양식은 타인의 조언과 승인을 크게 참고한다.","use":"내담자가 타인의 허락만 기다리면 자신의 기준을 먼저 적고, 직관에만 의존하면 검증 가능한 정보와 행동실험을 추가한다.","limits":"한 양식이 항상 우월한 것은 아니다. 결정의 중요도와 불확실성에 따라 혼합 전략이 필요하다.","related":"dinklage,gelatt,cip","fam":"decide"},{"id":"strong","title":"스트롱 직업흥미검사 계보","person":"Edward K. Strong Jr.","year":"1927/1994","keywords":"흥미, 직업 종사자 준거, 직업흥미","summary":"직업 종사자 집단의 흥미 패턴과 비교해 개인의 흥미 방향을 탐색한다.","detail":"직업흥미는 좋아하는 활동·주제·환경에 관한 정보다. 스트롱 검사는 직업 종사자 준거집단과 응답 패턴을 비교하는 경험적 접근으로 발전했다.","use":"상위 흥미 영역에서 직업 후보를 만든 뒤 실제 과업·근무환경·훈련 요건을 조사한다.","limits":"흥미는 능력·가치·기회와 다르다. 검사 결과를 직업 처방이나 채용 선발의 단독 기준으로 쓰지 않는다.","related":"holland,kuder,assessment","fam":"assess"},{"id":"kuder","title":"쿠더 직업흥미·선호 검사","person":"G. Frederic Kuder","year":"1939","keywords":"활동 선호, 흥미, 선호 패턴","summary":"활동 선호를 체계적으로 확인해 직업 탐색의 출발점을 제공한다.","detail":"쿠더 계열 검사는 직업명 자체보다 활동에 대한 선호를 파악하는 전통을 갖는다. 흥미를 직업군·활동 영역과 연결해 탐색한다.","use":"“직업 이름”보다 “어떤 활동을 할 때 시간이 빨리 가는가”를 구체적으로 물어보고 경험 사례와 대조한다.","limits":"검사 버전·규준·해석 지침을 확인한다. 흥미 하나로 직업 적합성을 확정하지 않는다.","related":"strong,holland,assessment","fam":"assess"},{"id":"prediger","title":"직업세계지도·흥미의 두 축","person":"Dale Prediger","year":"1982","keywords":"사람-사물, 자료-아이디어, 직업세계지도","summary":"흥미를 사람-사물과 자료-아이디어의 두 축으로 단순화해 직업세계를 탐색한다.","detail":"RIASEC를 직업세계의 활동 차원으로 재구성해 사람/사물, 자료/아이디어 축을 제시한다. 직업을 과업 내용과 상호작용 방식으로 비교하는 보조 지도다.","use":"흥미검사 코드가 복잡한 내담자에게 “사람을 돕는가, 사물을 다루는가”, “자료를 정리하는가, 아이디어를 만드는가”를 물어 후보를 확장한다.","limits":"두 축은 직업을 완전히 설명하지 않는다. 직무마다 여러 차원이 섞여 있고 조직·근무조건도 중요하다.","related":"holland,strong,assessment","fam":"assess"},{"id":"thorndike","title":"효과의 법칙·시행착오 학습","person":"Edward Thorndike","year":"1911","keywords":"효과의 법칙, 시행착오, 결과","summary":"행동 뒤의 만족스러운 결과가 유사한 상황에서 행동의 반복 가능성을 높인다.","detail":"효과의 법칙은 행동과 결과의 연결이 학습에 중요함을 설명한다. 스키너의 조작적 조건형성보다 초기의 시행착오 학습 연구에 해당한다.","use":"구직 행동 후 피드백을 빠르게 제공하고, 무엇이 효과 있었는지 회고해 다음 행동에 반영한다.","limits":"복잡한 인간 동기와 사회적 조건을 단순한 보상-반응으로 축소하지 않는다.","related":"skinner,bandura,krumboltz","fam":"learn"},{"id":"pavlov","title":"고전적 조건형성","person":"Ivan Pavlov","year":"1927","keywords":"조건자극, 조건반응, 연합학습","summary":"중립 자극이 정서·생리 반응과 반복적으로 연결되며 조건반응을 형성할 수 있다.","detail":"고전적 조건형성은 자극 간 연합을 통해 반응이 학습되는 과정을 설명한다. 직업상담에서는 면접·평가 상황과 불안 반응의 연결을 이해하는 보조 틀이다.","use":"특정 장소·전화·면접 질문에 불안이 자동으로 올라오는지 확인하고, 안정화 기술과 점진적 연습을 결합한다.","limits":"조건형성만으로 불안의 원인을 전부 설명하지 않는다. 의학적·외상 관련 문제가 의심되면 전문 평가가 필요하다.","related":"wolpe,skinner,stress","fam":"learn"},{"id":"meichenbaum","title":"인지행동수정·스트레스 면역훈련","person":"Donald Meichenbaum","year":"1977","keywords":"자기대화, 대처기술, 스트레스 면역훈련","summary":"자기대화와 단계별 대처기술 훈련으로 스트레스 상황에 대응하도록 돕는다.","detail":"개념화·대처기술 습득·실제 적용의 단계로 스트레스 상황을 연습한다. 준비적 자기진술, 문제해결, 이완, 역할연습을 결합할 수 있다.","use":"면접 전 불안이 높으면 준비 단계의 자기지시문, 모의면접, 피드백, 실제 적용 후 회고를 구성한다.","limits":"자기대화만 바꾸면 모든 문제가 해결된다고 보지 않는다. 과도한 업무요구나 차별 등 환경 조건도 함께 다룬다.","related":"beck,ellis,wolpe","fam":"learn"},{"id":"lazarus","title":"다중양식 접근 BASIC I.D.","person":"Arnold Lazarus","year":"1976","keywords":"행동, 정서, 감각, 심상, 인지, 대인관계, 생물학","summary":"문제를 한 가지 심리 차원으로 환원하지 않고 여러 양식에서 평가한다.","detail":"BASIC I.D.는 행동(Behavior), 정서(Affect), 감각(Sensation), 심상(Imagery), 인지(Cognition), 대인관계(Interpersonal), 생물학적 요인(Drugs/Biology)을 살핀다.","use":"구직 회피를 행동(지원 횟수), 정서(불안), 인지(실패 신념), 신체(수면), 관계(지원망)로 나눠 사정한다.","limits":"상담자가 모든 영역을 치료할 수 있는 것은 아니다. 의학·정신건강 영역은 동의와 적절한 의뢰·협력 범위를 지킨다.","related":"assessment,beck,stress","fam":"skill"},{"id":"yocum","title":"해결중심 단기상담","person":"Steve de Shazer · Insoo Kim Berg","year":"1982/1985","keywords":"예외질문, 기적질문, 척도질문, 강점, 작은 변화, 대처질문","summary":"문제 원인의 장기 분석보다 원하는 미래와 이미 작동하는 예외·자원을 찾아 작은 변화를 만든다.","detail":"기적질문으로 선호하는 미래를 구체화하고, 예외질문으로 문제가 덜했던 때의 조건을 찾으며, 척도질문으로 현재 위치와 다음 한 걸음을 정한다. 기적질문은 선호 미래를, 예외질문은 문제가 덜했던 때의 조건을, 척도질문은 현재 위치와 다음 한 걸음을, 대처질문은 어려움 속에서도 버틴 자원을 드러낸다.","use":"“다음 주에 상담이 도움이 됐다고 느끼게 할 가장 작은 변화는 무엇일까요?”를 묻고 행동으로 관찰 가능한 과제를 정한다. “0~10점 중 지금 구직 자신감은 몇 점인가요? 1점 높아지려면 이번 주 무엇이 달라져야 할까요?”","limits":"구조적 장벽이나 복합적인 정신건강 문제를 개인의 해결 의지로만 다루지 않는다. 질문을 기계적으로 던지지 말고 충분히 경청한 뒤 내담자의 언어를 반영한다.","related":"egan,mi,positive","fam":"skill"},{"id":"mi","title":"동기강화상담","person":"William R. Miller · Stephen Rollnick","year":"1991/2013","keywords":"양가감정, OARS, 변화대화, 저항","summary":"양가감정을 존중하고 내담자 자신의 변화 이유와 언어를 이끌어낸다.","detail":"OARS는 열린 질문(Open questions), 인정(Affirmations), 반영(Reflections), 요약(Summaries)이다. 지시·설득보다 협력적 대화로 변화대화를 강화한다.","use":"구직을 원하면서도 두려워하는 내담자에게 “변화했을 때 좋은 점과 걱정되는 점은?”을 묻고 스스로 말한 이유를 반영한다.","limits":"동기 부족으로 판단하기 전에 건강·돌봄·교통·차별·기술·자원 등 실행 장벽을 확인한다.","related":"yocum,deciryan,bandura","fam":"skill"},{"id":"act","title":"수용전념치료 ACT","person":"Steven C. Hayes","year":"1999","keywords":"심리적 유연성, 수용, 탈융합, 가치, 전념행동","summary":"불편한 생각과 감정을 없애기보다 그것을 안고 가치에 맞는 행동을 선택하도록 돕는다.","detail":"핵심은 심리적 유연성이다. 수용, 인지적 탈융합, 현재 순간 접촉, 맥락으로서의 자기, 가치, 전념행동의 과정으로 설명한다.","use":"“불안이 사라져야 지원할 수 있다”는 규칙을 알아차리고, 불안을 동반한 채 가능한 작은 지원 행동을 정한다.","limits":"수용은 부당한 환경을 참으라는 뜻이 아니다. 가치와 안전, 현실적 대안 및 권리 옹호를 함께 고려한다.","related":"beck,frankl,deciryan","fam":"learn"},{"id":"prochaska","title":"변화단계모형 TTM","person":"James Prochaska · Carlo DiClemente","year":"1983","keywords":"전숙고, 숙고, 준비, 행동, 유지, 재발","summary":"변화 준비도에 따라 개입의 초점과 강도를 조절한다.","detail":"전숙고(변화 필요성 미인식)→숙고(양가감정)→준비(계획)→행동(실행)→유지(지속)의 순환적 단계로 설명한다. 재발은 학습과 재조정의 계기가 될 수 있다.","use":"구직 의지가 낮아 보이면 즉시 지원서 작성부터 요구하지 말고 변화의 장단점과 준비도를 확인한다. 준비 단계에는 구체적 실행계획을 세운다.","limits":"단계가 선형·고정적으로 진행된다고 보지 않는다. 외부 기회와 제약이 변화 가능성에 영향을 준다.","related":"mi,skinner,bandura","fam":"skill"},{"id":"egan","title":"숙련된 조력자 모형","person":"Gerard Egan","year":"1975","keywords":"현재 상황, 선호 미래, 실행 전략, 탐색-통찰-행동","summary":"상담 대화를 현재 문제 이해에서 바람직한 미래와 실행 계획으로 구조화한다.","detail":"세 단계로 현재 상황 탐색, 선호하는 미래 구체화, 전략·행동 계획을 다룬다. 단계는 유연하게 오가며 내담자의 언어와 자원을 중심에 둔다.","use":"초기에는 “무엇이 가장 힘든가”, 중기에는 “무엇이 달라지면 좋나”, 후반에는 “이번 주 어떤 행동을 해볼까”를 묻는다.","limits":"상담을 체크리스트처럼 기계적으로 진행하지 않는다. 관계 형성과 내담자의 속도를 우선한다.","related":"rogers,yocum,mi","fam":"skill"},{"id":"hill","title":"도움기술 3단계 모형","person":"Clara Hill","year":"1982/1999","keywords":"탐색, 통찰, 행동, 경청, 질문, 반영","summary":"탐색에서 통찰을 거쳐 행동으로 나아가는 상담 기술의 틀이다.","detail":"탐색 단계는 경험을 말하고 정서·생각을 명료화하며, 통찰 단계는 패턴과 의미를 이해하고, 행동 단계는 새로운 선택과 실천을 설계한다.","use":"내담자가 충분히 말하지 못한 초기에는 경청·반영을 쓰고, 반복 패턴이 드러나면 의미를 함께 정리한 뒤 행동 과제를 만든다.","limits":"통찰을 상담자가 일방적으로 해석하지 않는다. 내담자가 동의하고 유용하다고 느끼는지 확인한다.","related":"egan,rogers,beck","fam":"skill"},{"id":"satir","title":"경험적 가족치료·의사소통 유형","person":"Virginia Satir","year":"1964/1972","keywords":"회유, 비난, 초이성, 산만, 일치형, 자존감","summary":"가족 의사소통 패턴과 자존감이 진로 선택에 미치는 영향을 탐색한다.","detail":"회유형·비난형·초이성형·산만형은 스트레스 상황의 불일치적 의사소통으로 설명되고, 일치형은 자기·타인·상황을 함께 존중한다.","use":"부모와 진로 갈등이 있는 청년에게 각자의 기대와 두려움을 비난 없이 표현하는 대화 문장을 연습한다.","limits":"가족상담 전문성이 필요한 복합 갈등은 적절히 의뢰한다. 내담자의 안전과 자율성을 최우선으로 둔다.","related":"bowen,minuchin,attachment","fam":"mind"},{"id":"schema","title":"도식치료","person":"Jeffrey Young","year":"1990/2003","keywords":"초기부적응도식, 핵심욕구, 대처양식, 반복패턴","summary":"초기 경험에서 형성된 깊은 믿음과 대처 패턴이 현재의 직업 선택·관계에 반복될 수 있음을 본다.","detail":"초기부적응도식은 자신·타인·관계에 관한 지속적인 패턴이다. 직업상담에서는 실패·복종·인정추구·엄격한 기준 등 반복되는 신념을 가설적으로 탐색한다.","use":"“실수하면 가치가 없다”는 믿음이 지원 회피나 과로와 연결되는지 살피고, 현재 상황에서 그 믿음이 얼마나 정확한지 검토한다.","limits":"도식치료는 전문 심리치료 영역일 수 있다. 직업상담자는 진단을 단정하지 말고 필요 시 임상 전문가와 협력한다.","related":"freud,beck,attachment","fam":"mind"},{"id":"dbt","title":"변증법적 행동치료 DBT","person":"Marsha Linehan","year":"1993","keywords":"마음챙김, 정서조절, 고통감내, 대인관계 효율성","summary":"정서가 급격히 흔들리는 상황에서 수용과 변화 기술을 함께 훈련한다.","detail":"마음챙김·고통감내·정서조절·대인관계 효율성의 기술 모듈로 설명된다. 직업상담에서는 면접 불안이나 직장 갈등에 기초 기술을 참고할 수 있다.","use":"감정이 격해질 때 잠시 멈추기, 감정 이름 붙이기, 요청 문장 연습 등 안전한 기술을 연습한다.","limits":"자살·자해 위험, 심각한 정서 불안정은 전문 임상 서비스와 위기 절차가 우선이다.","related":"stress,mi,rogers","fam":"skill"},{"id":"cft","title":"연민중심치료·자기자비","person":"Paul Gilbert · Kristin Neff","year":"2003/2009","keywords":"자기친절, 보편적 인간성, 마음챙김, 수치심","summary":"실패 후 자기비난과 수치심을 낮추고 현실적인 회복 행동을 돕는다.","detail":"자기자비는 자기친절, 보편적 인간성, 마음챙김을 포함한다. 연민중심 접근은 위협·추동·진정 체계와 수치심·자기비판을 다룬다.","use":"탈락 후 “나는 쓸모없다”는 자기비난을 완화하고, 친구에게 하듯 자신에게 말하는 문장과 회복 행동을 정한다.","limits":"자기자비를 책임 회피나 무조건적 긍정으로 오해하지 않는다. 구조적 실패 원인과 개선점을 함께 검토한다.","related":"positive,beck,frankl","fam":"mind"},{"id":"jobcraft","title":"직무 재창조 Job Crafting","person":"Amy Wrzesniewski · Jane Dutton","year":"2001","keywords":"과업 재창조, 관계 재창조, 인지 재창조, 주도성","summary":"현재 직무 안에서 과업·관계·일의 의미를 조정해 일 경험을 개선한다.","detail":"과업 경계, 관계 경계, 인지적 경계를 개인이 주도적으로 조정하는 접근이다. 조직 권한과 안전 범위 내에서 작은 변화를 실험한다.","use":"업무의 의미가 약해진 내담자와 에너지 소모가 큰 과업·강점 활용 과업·도움을 주고받는 관계를 지도화해 조정안을 만든다.","limits":"권한 밖 업무 변경이나 무급 노동 증가를 개인의 주도성으로 포장하지 않는다. 관리자 협의와 업무량·보상 조건을 확인한다.","related":"jdr,herzberg,workvalues","fam":"motive"},{"id":"jdr","title":"직무요구-자원 모형 JD-R","person":"Arnold Bakker · Evangelia Demerouti","year":"2001/2007","keywords":"직무요구, 직무자원, 소진, 몰입","summary":"높은 직무요구와 부족한 자원이 소진을, 충분한 자원이 몰입을 설명하는 틀이다.","detail":"직무요구(업무량·시간압박·정서요구)는 에너지를 소모해 소진으로, 직무자원(자율성·지지·피드백)은 동기와 몰입으로 이어지는 이중 경로다. 자원은 요구의 영향을 완충한다.","use":"번아웃을 호소하면 요구와 자원을 각각 목록화하고 개인 대처뿐 아니라 업무 재설계·관리자 협의·휴식·지원 자원을 검토한다.","limits":"소진을 개인 회복탄력성 부족으로 돌리지 않는다. 임상적 우울·불안이나 건강 문제가 있으면 전문 평가와 연계한다.","related":"burnout,jobcraft,herzberg","fam":"motive"},{"id":"hollandenv","title":"사람-환경 적합 Person-Environment Fit","person":"Kurt Lewin 및 적합 연구 전통","year":"1936/1950s","keywords":"개인-환경 상호작용, 적합, 요구-능력, 욕구-공급","summary":"직무 만족과 수행은 개인 특성만이 아니라 환경과의 상호작용에서 이해한다.","detail":"장이론의 B=f(P,E)는 행동을 개인과 환경의 함수로 본다. 후속 적합 접근은 개인-직무·개인-조직 적합을 구분해 능력-요구와 욕구-공급을 살핀다.","use":"“일을 잘할 수 있는가”와 “이 환경이 내게 필요한 것을 제공하는가”를 분리해 질문한다.","limits":"적합은 개인을 조직에 맞추라는 뜻이 아니다. 환경을 바꾸거나 더 나은 조건을 협상할 가능성도 살핀다.","related":"twa,holland,parsons","fam":"fit"},{"id":"careerimpact","title":"진로 충격·우연한 전환","person":"Jos Akkermans 등","year":"2018/2020","keywords":"진로 충격, 사건, 불확실성, 재구성","summary":"예상하지 못한 사건이 경력 경로를 바꾸는 과정을 이해한다.","detail":"실직·질병·돌봄·산업 변화·팬데믹 같은 사건은 경력의 방향과 자원에 영향을 준다. 사건 자체뿐 아니라 개인의 해석·대응·사회적 자원을 함께 본다.","use":"갑작스러운 퇴직 뒤 사건 타임라인, 상실한 자원, 남은 역량·관계, 당장 필요한 지원과 중기 탐색을 나눠 계획한다.","limits":"모든 위기를 성장의 기회로 포장하지 않는다. 애도·생계·권리·안전의 우선순위를 존중한다.","related":"schlossberg,savickas,krumboltz","fam":"dev"},{"id":"sustainable","title":"지속가능 경력","person":"Ans De Vos · Beatrice Van der Heijden · Jos Akkermans","year":"2020","keywords":"건강, 행복, 생산성, 시간, 맥락","summary":"경력의 지속가능성을 건강·행복·생산성의 균형으로 본다.","detail":"경력은 시간에 걸쳐 개인과 맥락이 상호작용하는 과정이다. 건강·행복·생산성은 개인의 생애단계와 환경에 따라 달라진다.","use":"장기근속이나 승진만 성공으로 보지 않고 건강, 가족 역할, 의미, 역량 유지, 소득 안정의 균형을 점검한다.","limits":"지속가능성을 개인의 자기관리만으로 해결하지 않는다. 노동조건과 조직·제도적 지원을 포함한다.","related":"super,workfamily,jdr","fam":"dev"},{"id":"protean","title":"프로티언 경력","person":"Douglas T. Hall","year":"1996/2004","keywords":"자기주도, 가치주도, 심리적 성공","summary":"경력의 방향을 조직보다 개인의 가치와 자기주도성이 이끈다고 본다.","detail":"개인이 경력의 주체가 되어 자신의 가치에 따라 경력을 관리하고, 객관적 승진보다 심리적 성공을 중요하게 볼 수 있다.","use":"“외부에서 성공이라고 보는 경력”과 “내가 성공이라고 느끼는 경력”을 나눠 가치 기준을 명료화한다.","limits":"불안정 노동을 개인의 유연성 부족 탓으로 돌리지 않는다. 선택 가능성과 자원 격차를 함께 본다.","related":"careeranchors,workvalues,sustainable","fam":"dev"},{"id":"boundaryless","title":"무경계 경력","person":"Michael Arthur · Denise Rousseau","year":"1994/1996","keywords":"조직 경계 이동, 이동성, 경력 자본","summary":"한 조직에 머무는 경력만이 아니라 조직·직무·산업 경계를 넘는 경력을 설명한다.","detail":"경력 이동은 물리적 이동뿐 아니라 심리적 경계 이동도 포함한다. 이동성은 기회·네트워크·기술·시장 조건에 영향을 받는다.","use":"이직을 고려할 때 기술·성과·관계망·학습 경험 등 이동 가능한 경력 자본을 점검한다.","limits":"이동을 무조건 진보로 보지 않는다. 안정성·돌봄·지역·비자·장애 등 현실 조건을 고려한다.","related":"protean,careeranchors,krumboltz","fam":"dev"},{"id":"marland","title":"진로교육·포괄적 진로지도","person":"Sidney Marland · Kenneth Hoyt · Norman Gysbers","year":"1971/1981","keywords":"진로교육, 전 생애, 프로그램, 학교-지역 연계","summary":"진로개발을 개인상담만이 아니라 교육·조직·지역 프로그램으로 지원한다.","detail":"진로교육은 교육과정과 생활 경험 속에 진로 탐색·의사결정·준비를 통합한다. 포괄적 진로지도는 개인상담, 교육과정, 정보, 배치·추수 등을 체계로 구성한다.","use":"개별 상담 외에 진로정보 수업, 직업인 인터뷰, 현장 체험, 취업 후 추수 지원을 설계한다.","limits":"프로그램 참여량만으로 성과를 판단하지 않는다. 실제 역량·선택·전환·고용의 질을 평가한다.","related":"super,assessment,careerdecision","fam":"dev"},{"id":"jobanalysis","title":"직무분석·직업정보 활용","person":"Frederick Taylor · Sidney Fine · O*NET 계보","year":"1911/1974/1998","keywords":"직무과업, 지식·기술·능력, 자료-사람-사물, 직업정보","summary":"직업명을 넘어 실제 수행 과업과 요구 역량·환경을 분석한다.","detail":"직무분석은 과업·책임·도구·작업조건·요구 역량을 구조화한다. FJA의 자료-사람-사물 차원과 O*NET의 직업정보 구조를 참고할 수 있다.","use":"관심 직업 3개를 골라 하루 업무, 핵심 과업, 진입 자격, 근무시간, 임금 범위, 고용전망, 위험·부담을 비교한다.","limits":"직업정보는 시점·지역·산업에 따라 달라진다. 최신 공식 자료와 실제 종사자 정보를 교차 확인한다.","related":"parsons,strong,prediger","fam":"assess"},{"id":"assessmentethics","title":"심리검사 해석·윤리 원칙","person":"Cronbach · Campbell & Fiske 등 측정 전통","year":"1951/1955/1959","keywords":"신뢰도, 타당도, 규준, 다방법, 피드백","summary":"검사 점수는 구성개념을 추정하는 자료이며 면담·행동·환경 정보와 통합해야 한다.","detail":"신뢰도는 점수의 일관성, 타당도는 점수 해석과 사용의 근거를 말한다. 규준·측정오차·검사 목적·집단 적합성을 확인한다.","use":"검사 전 목적·한계·비밀보장 범위를 설명하고, 결과 피드백에서 내담자의 실제 경험과 불일치하는 부분을 함께 탐색한다.","limits":"검사 결과를 진단·선발·직업 처방의 단독 근거로 쓰지 않는다. 자격과 사용권한, 개인정보 보호, 문화적 타당성을 확인한다.","related":"assessment,holland,strong","fam":"assess"},{"id":"workmeaning","title":"일의 의미·직업·경력·소명","person":"Amy Wrzesniewski · David Blustein · Ryan Duffy","year":"1997/2006/2016","keywords":"직업, 경력, 소명, 생존, 관계, 자기결정","summary":"일은 생계뿐 아니라 정체성·관계·의미를 제공하거나 박탈할 수 있다.","detail":"일을 직업(job), 경력(career), 소명(calling)으로 경험하는 지향이 다를 수 있다. 일의 심리학 관점은 생존·사회적 연결·자기결정과 괜찮은 일의 접근성을 함께 본다.","use":"“일에서 꼭 얻어야 하는 것은 무엇인가요?”를 묻고 생계·안전·관계·의미·자율성의 우선순위를 정리한다.","limits":"소명을 강요하거나 열정으로 저임금·불안정 노동을 정당화하지 않는다. 생계와 노동권을 우선 고려한다.","related":"frankl,pwt,workvalues","fam":"mind"},{"id":"careerbarriers","title":"진로 장벽·지원 지도","person":"Lent · Brown · Hackett 및 사회인지·사회정의 접근","year":"1994/2015","keywords":"맥락적 장벽, 지원, 접근성, 차별, 자원","summary":"진로 선택과 실행은 개인 신념뿐 아니라 현실의 지원·장벽에 의해 형성된다.","detail":"장벽은 개인 내부의 기술 부족뿐 아니라 경제·제도·지역·돌봄·장애 접근성·차별·정보 불균형 등에서 발생한다. 지원은 관계망·제도·멘토·서비스 접근을 포함한다.","use":"지원 행동이 막히면 개인 요인과 환경 장벽을 두 칸으로 나누고, 바꿀 수 있는 것·협상할 것·지원기관과 연결할 것을 정한다.","limits":"구조적 장벽을 자기효능감 부족으로 환원하지 않는다. 내담자 동의 없이 민감한 정보를 공유하지 않는다.","related":"scct,pwt,socialjustice","fam":"context"},{"id":"familycareer","title":"가족체계와 진로 선택","person":"Murray Bowen · Salvador Minuchin · Virginia Satir","year":"1966/1974","keywords":"자아분화, 삼각관계, 경계, 하위체계, 의사소통","summary":"진로 결정은 개인 내부뿐 아니라 가족 관계와 상호작용 속에서 영향을 받는다.","detail":"보웬은 자아분화·삼각관계·다세대 전수를, 미누친은 경계·하위체계·위계를, 사티어는 의사소통과 자존감을 강조한다.","use":"부모 기대가 큰 내담자에게 자신의 선호, 가족의 우려, 현실적 의존관계, 협상 가능한 조건을 구분해 대화 계획을 세운다.","limits":"가족을 문제 원인으로 단정하지 않는다. 폭력·강압·경제적 통제 위험이 있으면 안전과 개별 지원을 우선한다.","related":"bowen,minuchin,satir","fam":"mind"},{"id":"decisionpic","title":"PIC 진로대안 탐색 모형","person":"Itamar Gati · Asher","year":"2001","keywords":"사전선별, 심층탐색, 선택, 대안축소","summary":"많은 직업 대안을 단계적으로 좁혀 탐색 부담을 줄인다.","detail":"PIC는 Prescreening(사전 선별)→In-depth exploration(심층 탐색)→Choice(선택)의 절차다. 처음부터 모든 직업을 깊게 조사하지 않고 핵심 기준으로 후보를 줄인 뒤 비교한다.","use":"직업 후보가 너무 많으면 필수조건과 선호조건을 구분해 5개 이하로 사전 선별하고, 남은 대안을 실제 정보로 비교한다.","limits":"초기 필터가 편견이나 제한된 정보에 기반하지 않는지 점검한다. 사회적 고정관념으로 대안을 과도하게 제외하지 않는다.","related":"gati,cip,careerdecision","fam":"decide"},{"id":"gendercareer","title":"성별·사회화·진로 제한","person":"Helen Astin · Ruth Fassinger · Linda Gottfredson","year":"1981/1984/1985","keywords":"성역할, 사회화, 기회구조, 타협","summary":"진로 선택은 성별 역할 기대와 기회구조의 영향을 받을 수 있다.","detail":"여성 진로 연구는 개인 욕구뿐 아니라 사회화·가족 역할·기회구조·성역할 태도와 노동시장 조건을 분석했다. 오늘날에는 성별을 고정된 특성으로 보지 않고 교차하는 정체성과 제도적 맥락을 살핀다.","use":"“관심이 없어서 제외한 직업”과 “주변에서 불가능하다고 말해 제외한 직업”을 구분해 탐색한다.","limits":"성별에 따라 직업을 추천하거나 내담자의 정체성을 추정하지 않는다. 차별 경험과 안전을 존중한다.","related":"gottfredson,socialjustice,pwt","fam":"context"},{"id":"multicultural","title":"다문화상담 역량·문화적 겸손","person":"Derald Wing Sue · Tervalon & Murray-Garcia · Ratts","year":"1982/1998/2015","keywords":"자기성찰, 문화적 겸손, 권력, 특권, 옹호","summary":"상담자의 문화적 위치와 권력 차이를 성찰하고 내담자의 맥락에 맞춰 협력한다.","detail":"문화적 겸손은 자기성찰·권력 불균형 인식·평생 학습의 태도다. 사회정의 상담 역량은 상담자-내담자, 상담·기관, 지역·사회 수준의 개입을 함께 본다.","use":"내담자가 경험한 차별을 판단하거나 축소하지 않고, 개인상담·기관 조정·제도 정보·권리 옹호 중 무엇이 필요한지 함께 결정한다.","limits":"문화 집단을 고정관념으로 설명하지 않는다. 상담자의 무지를 인정하고 내담자에게 설명 책임을 전가하지 않는다.","related":"socialjustice,pwt,careerbarriers","fam":"context"},{"id":"learnedhelplessness","title":"학습된 무기력","person":"Martin Seligman","year":"1967","keywords":"통제불능 경험, 귀인, 무기력, 낙관성","summary":"통제할 수 없는 실패 경험이 이후 시도와 기대를 약화시킬 수 있다.","detail":"반복된 통제불능 경험은 행동을 시작하지 않거나 결과를 바꾸기 어렵다고 느끼게 할 수 있다. 귀인 양식과 실제 환경 통제 가능성을 구분해 본다.","use":"“해도 소용없다”는 내담자에게 과거 실패를 인정하고, 통제 가능한 아주 작은 행동과 외부 지원을 함께 설계한다.","limits":"무기력을 개인의 비관적 성격으로 단정하지 않는다. 실제로 기회가 제한된 환경일 수 있다.","related":"bandura,attribution,skinner","fam":"learn"},{"id":"atkinson","title":"성취동기와 성공·실패 기대","person":"John W. Atkinson","year":"1957","keywords":"성공추구, 실패회피, 과제 난이도, 기대","summary":"성공 가능성과 실패의 부담이 과제 선택과 노력에 영향을 준다.","detail":"성취 상황에서 성공을 향한 동기와 실패를 피하려는 동기가 상호작용한다. 과제 난이도와 성공 가능성의 지각도 행동에 영향을 준다.","use":"도전을 과도하게 피하는 내담자에게 성공 확률이 너무 높거나 낮지 않은 단계적 과제를 정한다.","limits":"실패회피를 의지 부족으로 해석하지 말고 실패 비용, 과거 차별·처벌 경험, 생계 위험을 함께 확인한다.","related":"mcclelland,bandura,locke","fam":"motive"},{"id":"freire","title":"비판의식·의식화와 진로","person":"Paulo Freire · Matthew Diemer","year":"1970/2006","keywords":"의식화, 권력, 구조적 제약, 주체성","summary":"진로 문제를 개인의 결함만이 아니라 사회·경제적 구조와 권력 관계 속에서 이해한다.","detail":"의식화는 억압적 조건을 비판적으로 인식하고 변화 가능성을 모색하는 과정이다. 진로상담에서는 개인의 선택과 노동시장·교육·제도 장벽을 함께 본다.","use":"내담자의 반복 실업을 개인 기술 부족만으로 해석하지 않고 지역 일자리, 차별, 교육 접근, 돌봄 책임, 제도 요인을 함께 지도화한다.","limits":"상담자가 특정한 정치적 해석이나 행동을 강요하지 않는다. 내담자의 안전·선택·목표에 따라 정보와 자원을 연결한다.","related":"pwt,socialjustice,careerbarriers","fam":"context"},{"id":"flow","title":"몰입과 직무 경험","person":"Mihaly Csikszentmihalyi","year":"1990","keywords":"도전-기술 균형, 몰입, 피드백, 집중","summary":"도전 수준과 기술 수준이 적절히 맞을 때 몰입 경험이 나타날 수 있다.","detail":"칙센트미하이: 도전과 기술이 균형을 이루고 목표·즉각적 피드백이 분명할 때 몰입한다. 도전이 기술보다 크면 불안, 기술이 더 크면 지루함이 생긴다.","use":"과거 몰입 경험을 분석해 과업의 난이도·자율성·피드백·환경 조건을 찾고 직무 탐색 기준에 반영한다.","limits":"몰입 경험만으로 직업 적합성을 판단하지 않는다. 보상·안전·고용의 질도 중요하다.","related":"positive,jobcharacteristics,holland","fam":"motive"},{"id":"careerchaos","title":"카오스이론 진로 CTC","person":"Robert Pryor · Jim Bright","year":"2003","keywords":"복잡성, 비선형, 창발, 우연, 맥락","summary":"진로는 예측 가능한 직선 경로가 아니라 복잡하고 비선형적인 변화 과정일 수 있다.","detail":"복잡성 관점은 작은 사건이 경로를 바꾸고, 우연·맥락·상호작용이 새로운 가능성을 만드는 과정을 본다.","use":"장기 계획이 불확실한 내담자에게 하나의 정답 경로 대신 여러 시나리오와 저비용 탐색 실험을 설계한다.","limits":"불확실성을 미화하거나 계획·안전망의 필요성을 무시하지 않는다.","related":"krumboltz,careerimpact,savickas","fam":"dev"},{"id":"jobsearch","title":"구직행동·구직 클럽","person":"Nathan Azrin · Richard Bolles","year":"1970s","keywords":"구직기술, 목표, 네트워킹, 모의면접, 피드백","summary":"구직을 막연한 노력보다 반복 가능한 기술과 행동으로 훈련한다.","detail":"구직 클럽은 집단의 지지·모델링·피드백을 활용해 구직 행동을 연습한다. 구직은 정보 탐색, 이력서, 네트워킹, 면접, 후속 연락 등 기술 묶음으로 나눌 수 있다.","use":"주간 지원 목표, 이력서 수정, 정보 인터뷰, 모의면접, 지원 후 회고를 계획하고 동료 피드백을 연결한다.","limits":"지원 건수만으로 성과를 평가하지 않는다. 직무 질·적합성·차별·노동시장 상황을 함께 본다.","related":"skinner,bandura,krumboltz","fam":"skill"},{"id":"jobloss","title":"실직의 잠재적 박탈·심리사회 기능","person":"Marie Jahoda","year":"1933/1982","keywords":"시간구조, 사회적 접촉, 공동목표, 지위·정체성, 활동","summary":"일은 임금 외에도 시간·관계·정체성·공동 목표를 제공하므로 실직은 다층적 상실을 낳을 수 있다.","detail":"잠재적 기능에는 시간 구조, 사회적 접촉, 공동 목표, 지위·정체성, 활동성이 포함된다. 실직은 소득뿐 아니라 일상 구조와 소속감에도 영향을 준다.","use":"실직 내담자와 소득 지원뿐 아니라 일상 리듬, 관계망, 의미 있는 활동, 사회적 역할을 회복하는 계획을 세운다.","limits":"실직을 개인의 실패로 해석하지 않는다. 경제적 지원과 고용서비스 연계가 심리 지원과 함께 필요하다.","related":"pwt,frankl,stress","fam":"context"},{"id":"realitytherapy","title":"현실치료·선택이론 WDEP","person":"William Glasser","year":"1965/1998","keywords":"욕구, 전행동, 선택, WDEP, 책임","summary":"현재의 욕구와 행동을 점검하고 실행 가능한 선택을 계획한다.","detail":"선택이론은 생존·사랑과 소속·힘·자유·즐거움 욕구를 제시한다. WDEP는 원하는 것(Wants), 현재 행동(Doing), 평가(Evaluation), 계획(Planning)을 점검하는 실천 틀이다.","use":"구직을 미루는 내담자와 원하는 결과·현재 행동·효과 평가·작은 계획을 구체화한다.","limits":"선택을 강조하더라도 구조적 장벽과 정신건강 문제를 개인 책임으로 돌리지 않는다.","related":"skinner,mi,deciryan","fam":"skill"},{"id":"havighurst","title":"발달과업 이론","person":"Robert Havighurst","year":"1948","keywords":"발달과업, 가르칠 수 있는 순간, 성숙, 사회적 기대","summary":"생애 각 시기에 성취해야 할 과업을 제시하고, 성취 여부가 이후 적응을 좌우한다고 본다.","detail":"발달과업은 신체 성숙·사회적 기대·개인 가치가 만나는 지점에서 생긴다. 청소년기에는 직업 선택과 준비, 성인 초기에는 직업 시작, 중년기에는 직업적 성취 유지가 과업이다. 준비도가 높은 때가 가르칠 수 있는 순간이다.","use":"내담자가 지금 시기의 과업을 미룬 것인지, 앞선 과업이 미해결인지 구분해 개입 시점을 정한다.","limits":"시기별 과업은 시대·문화의 영향을 받으므로 규범으로 단정하지 않는다.","related":"super,erikson,levinson","fam":"dev"},{"id":"levinson","title":"성인 발달·인생구조 이론","person":"Daniel Levinson","year":"1978","keywords":"인생구조, 전환기, 꿈, 멘토, 중년 전환","summary":"성인기를 안정기와 전환기가 번갈아 오는 인생구조의 변화로 설명한다.","detail":"성인 초기 전환(17~22세), 30세 전환, 중년 전환(40~45세)에서 인생구조를 점검한다. 젊은 시절의 꿈과 멘토 관계가 직업 선택과 경력 형성에 영향을 주며, 중년 전환에서는 꿈과 현실의 차이를 재평가한다.","use":"30~40대 직무전환 내담자의 불안을 전환기의 재평가로 이해하고 꿈·역할·관계를 다시 정리한다.","limits":"초기 연구가 미국 남성 표본이어서 연령 구간을 그대로 일반화하지 않는다.","related":"erikson,super,havighurst","fam":"dev"},{"id":"bridges","title":"전환 3단계 모델","person":"William Bridges","year":"1980","keywords":"끝맺음, 중립지대, 새로운 시작, 상실","summary":"전환은 외적 변화가 아니라 끝맺음-중립지대-새로운 시작이라는 내적 과정이다.","detail":"변화(change)는 상황의 바뀜이고 전환(transition)은 그에 적응하는 심리 과정이다. 끝맺음에서 상실을 인정하고, 중립지대에서 혼란과 재정비를 겪으며, 새로운 시작에서 새 정체성과 역할에 전념한다.","use":"실직·이직 직후 내담자에게 지금이 어느 단계인지 말해 주고 결정을 서두르지 않게 돕는다.","limits":"단계가 순서대로만 진행되지 않고 오갈 수 있다.","related":"schlossberg,jobloss","fam":"context"},{"id":"gatb","title":"일반직업적성검사 GATB","person":"U.S. Department of Labor","year":"1947","keywords":"적성, 지능, 언어능력, 수리능력, 공간판단력, 운동조절","summary":"9개 적성요인으로 여러 직업군에 필요한 능력을 측정하는 적성검사 배터리다.","detail":"적성요인은 지능(G)·언어(V)·수리(N)·사무지각(Q)·공간판단(S)·형태지각(P)·운동조절(K)·손가락 재치(F)·손 재치(M)이다. 직업군별 적성 패턴과 내담자 점수를 비교해 직업군을 탐색한다.","use":"흥미 결과와 나란히 놓고, 흥미는 높지만 필요한 적성이 낮은 직업군의 후속 탐색 과제를 정한다.","limits":"적성 점수만으로 직업을 배제하지 않고 훈련 가능성과 환경을 함께 본다.","related":"assessment,holland,strong","fam":"assess"},{"id":"projective","title":"투사검사","person":"Hermann Rorschach · Henry Murray","year":"1921/1935","keywords":"로르샤하, TAT, 문장완성검사, 투사, 방어","summary":"모호한 자극에 대한 반응으로 내면의 욕구·갈등을 추론하는 검사다.","detail":"로르샤하는 잉크반점 10장에 대한 반응, TAT는 그림 카드로 만든 이야기, 문장완성검사는 미완성 문장을 채운 내용으로 욕구·갈등·대인 지각을 살핀다. 방어가 낮아지는 장점이 있다.","use":"말로 표현하기 어려운 내담자의 욕구·갈등 가설을 세우는 보조 자료로 쓰고 면담으로 확인한다.","limits":"채점·해석의 신뢰도와 타당도가 객관적 검사보다 낮고 숙련된 검사자가 필요하다. 단독으로 직업을 판단하지 않는다.","related":"assessment,freud,assessmentethics","fam":"assess"},{"id":"worknet","title":"직업정보 체계: 한국표준직업분류·한국직업사전·워크넷","person":"통계청 · 고용노동부 · 한국고용정보원","year":"현행","keywords":"한국표준직업분류, 한국직업사전, 워크넷, 직업정보","summary":"공식 직업정보를 분류·사전·포털 순서로 찾아 쓰는 흐름이다.","detail":"한국표준직업분류는 직업을 체계적으로 분류하는 통계 기준이고, 한국직업사전은 직무 내용과 요건을 기술하며, 워크넷은 채용·직업정보를 제공하는 포털이다. 분류로 직업을 찾고 사전으로 하는 일을 확인한다.","use":"내담자가 관심 직업의 정식 명칭·직무·요건을 확인하고 현직자 정보 인터뷰 질문을 만든다.","limits":"공식 정보는 갱신 시차가 있으므로 최신 공고와 현직자 이야기로 보완한다.","related":"jobanalysis,assessment,marland","fam":"assess"},{"id":"mmpi","title":"MMPI-2·다면적 인성검사","person":"Starke Hathaway · J. C. McKinley","year":"1943","keywords":"MMPI-2, 임상척도, 타당도 척도, 선별, 의뢰","summary":"10개 임상척도와 타당도 척도로 정서·성격 문제를 선별하는 자기보고식 검사다.","detail":"임상척도는 건강염려(Hs)·우울(D)·히스테리(Hy)·반사회성(Pd)·남성성-여성성(Mf)·편집증(Pa)·강박(Pt)·정신분열(Sc)·경조증(Ma)·사회적 내향성(Si)이다. L·F·K 등 타당도 척도로 응답 태도를 먼저 확인하고, T점수 65 이상을 주목한다.","use":"직업 문제의 배경에 정서적 어려움이 의심될 때 선별하고, 필요하면 전문기관에 의뢰하는 판단 자료로 쓴다.","limits":"진단·선발 도구가 아니다. 단독 해석을 피하고 면담·동의·비밀보장 범위를 함께 확인한다.","related":"assessment,assessmentethics,projective","fam":"assess"},{"id":"firstinterview","title":"초기면담·구조화","person":"직업상담 실천 표준 절차","year":"현행","keywords":"구조화, 라포, 주호소, 사전 동의, 비밀보장","summary":"첫 회기에서 관계를 맺고 문제를 파악하며 상담의 틀과 목표를 합의하는 과정이다.","detail":"내담자의 주호소·직업력·기대를 듣고, 상담의 목적·절차·시간과 비밀보장 및 그 한계를 설명해 사전 동의를 받는다. 라포 형성, 문제 확인, 목표 합의, 다음 회기 약속이 1회기의 기본 구조다.","use":"마지막 10분에 합의한 목표와 과제를 내담자의 말로 요약해 확인한다.","limits":"정보 수집을 서두르면 취조처럼 느껴져 라포가 약해진다. 내담자의 속도를 따른다.","related":"egan,hill,assessmentethics","fam":"skill"},{"id":"groupcounsel","title":"집단상담·집단 프로그램","person":"Irvin Yalom","year":"1970","keywords":"치료적 요인, 집단 응집력, 보편성, 희망 고취, 집단 발달단계","summary":"집단원 간 상호작용으로 정보 공유와 변화를 돕는 상담이다.","detail":"얄롬의 치료적 요인은 희망 고취·보편성·정보 전달·이타심·사회기술 발달·모방행동·대인관계 학습·집단 응집력·카타르시스·실존적 요인·원가족 재현이다. 집단은 시작-갈등-작업-종결로 진행되며 터크먼의 형성-격동-규범-성취와 비교된다.","use":"구직 클럽·취업 스트레스 집단에서 비슷한 어려움을 확인하고 면접 연습을 서로 피드백한다.","limits":"비밀보장은 집단원 모두의 약속에 달려 있으므로 한계를 먼저 안내하고, 위기 신호는 개별 면담으로 연결한다.","related":"jobsearch,egan,assessmentethics","fam":"skill"},{"id":"kohlberg","title":"도덕성 발달이론","person":"Lawrence Kohlberg","year":"1958/1969","keywords":"전인습, 인습, 후인습, 도덕성 발달","summary":"도덕 판단이 3수준 6단계로 발달한다고 설명한다.","detail":"전인습(처벌과 복종, 도구적 교환), 인습(대인 조화, 법과 질서), 후인습(사회계약, 보편적 원리) 수준으로 구분한다. 판단의 결과보다 이유의 구조를 본다.","use":"비밀보장과 위험 보고처럼 윤리 딜레마에서 규정 준수와 원칙 기반 판단을 구분해 숙고한다.","limits":"정의 중심 모형이라는 비판이 있고 길리건은 돌봄 관점을 강조했다. 단계를 사람의 우열로 쓰지 않는다.","related":"piaget,erikson,assessmentethics","fam":"dev"},{"id":"bronfenbrenner","title":"생태체계이론","person":"Urie Bronfenbrenner","year":"1979","keywords":"생태체계, 미시체계, 중간체계, 외체계, 거시체계, 시간체계","summary":"개인 발달을 여러 겹의 환경 체계와 시간의 상호작용으로 본다.","detail":"미시체계(가족·학교·직장), 중간체계(그 사이의 연결), 외체계(부모 직장 같은 간접 환경), 거시체계(문화·법·노동시장), 시간체계(시대와 전환 시점)로 구성된다.","use":"내담자의 어려움을 층위별 자원과 장벽으로 나눠, 환경 문제를 개인 동기로 환원하지 않는다.","limits":"층위를 나눠도 상호작용을 단선적 원인으로 보지 않는다.","related":"pwt,blustein,socialjustice,lewin","fam":"context"}];
const GROUPS=[{"id":"fit","name":"매칭·적합","key":"나와 일은 어떻게 맞는가?","ids":["parsons","holland","twa","bigfive","workvalues"],"same":"개인 특성과 직무·환경의 요구를 비교해 적합을 탐색한다.","diff":"Parsons는 특성·직업정보·추론의 절차, Holland는 흥미-환경 유형, TWA는 능력-요구와 욕구-강화의 양방향 적응을 본다.","case":"흥미 코드는 높지만 실제 직무 만족이 낮다면 Holland에서 멈추지 말고 TWA로 보상·근무조건을 살펴보세요."},{"id":"choice","name":"선택·의사결정","key":"무엇 때문에 결정이 막히는가?","ids":["cip","gati","gelatt","tiedeman","parsons"],"same":"선택을 막연한 고민이 아니라 정보·기준·과정·실행으로 분해한다.","diff":"CIP는 정보처리 과정, Gati는 어려움의 원인 분류, Gelatt는 불확실성 속 대안과 가치, Tiedeman은 선택 후 정체성 발달에 초점을 둔다.","case":"정보 부족이면 CIP의 지식 탐색, 정보가 충돌하면 Gati의 불일치 점검, 결과를 예측하기 어렵다면 Gelatt식 작은 실험을 선택하세요."},{"id":"development","name":"발달·생애설계","key":"진로는 시간에 따라 어떻게 바뀌는가?","ids":["ginzberg","super","erikson","marcia","gottfredson","savickas","havighurst","levinson"],"same":"진로를 단발성 선택이 아니라 시간·정체성·역할 변화의 과정으로 본다.","diff":"Ginzberg는 선택 발달 단계, Super는 생애기간과 역할, Erikson·Marcia는 정체감, Gottfredson은 대안의 제한과 타협, Savickas는 이야기와 적응성을 강조한다. Erikson은 단계별 위기와 자아 자질(덕목), Havighurst는 발달과업, Levinson은 인생구조의 안정·전환을 본다.","case":"경력단절·중년 전환에는 Super의 생애역할과 Schlossberg의 전환 자원을 함께 쓰고, 좁아진 직업상에는 Gottfredson을 더하세요."},{"id":"learning","name":"학습·행동변화","key":"행동을 어떻게 시작하고 유지할까?","ids":["skinner","bandura","krumboltz","beck","ellis","locke"],"same":"행동은 경험·결과·기대·생각·목표에 의해 학습되고 변화할 수 있다.","diff":"Skinner는 결과와 강화, Bandura는 효능감·모델링·상호결정, Krumboltz는 학습경험과 우연, CBT/REBT는 생각의 검토, Locke는 목표와 피드백을 본다.","case":"지원 행동이 시작되지 않으면 작은 행동형성(Skinner), 자신감이 낮으면 성공경험(Bandura), 실패 예측이 강하면 행동실험(Beck)을 고려하세요."},{"id":"meaning","name":"의미·정체성·관계","key":"일이 나에게 어떤 의미인가?","ids":["rogers","frankl","existential","adler","kelly","narrative","selfconcept"],"same":"내담자의 경험·가치·관계·정체성을 존중하며 자기 방향을 명료화한다.","diff":"Rogers는 관계조건, Frankl·실존은 의미와 책임, Adler는 생활양식과 기여, Kelly는 개인 구성개념, 내러티브는 문제와 사람을 분리해 대안 이야기를 만든다.","case":"갈등이 심하고 자기비난이 강하면 먼저 인간중심적 관계를 확보한 뒤 의미·이야기 작업을 연결하세요."},{"id":"motivation","name":"동기·만족·조직","key":"무엇이 일할 마음과 지속을 만드는가?","ids":["maslow","herzberg","vroom","deciryan","motivation","careeranchors"],"same":"일의 선택과 지속에 영향을 주는 욕구·보상·기대·자율성을 살핀다.","diff":"Maslow는 욕구, Herzberg는 만족/불만족 요인, Vroom은 노력-성과-보상 기대, SDT는 자율성·유능감·관계성, Schein은 경력에서 포기하기 어려운 가치에 초점을 둔다.","case":"동기 저하가 생계 불안 때문이면 안전·보상부터, 성장 정체라면 동기요인·자율성·경력닻을 탐색하세요."},{"id":"context","name":"사회구조·문화·정의","key":"선택의 기회는 누구에게 열려 있는가?","ids":["pwt","blustein","socialjustice","gottfredson","lewin","scct","bronfenbrenner"],"same":"개인 내부뿐 아니라 환경·권력·제도·지원과 장벽을 진로의 일부로 본다.","diff":"PWT는 경제적 제약과 괜찮은 일, 사회정의 접근은 권력·차별·옹호, SCCT는 지원·장벽이 선택 과정에 미치는 영향, Lewin은 개인-환경 상호작용을 넓게 본다.","case":"반복되는 취업 실패를 개인 동기로 설명하기 전에 접근성·돌봄·교통·차별·지역 일자리 등 환경 장벽을 먼저 지도화하세요."},{"id":"transition","name":"전환·적응·회복","key":"변화 이후 어떻게 다시 적응할까?","ids":["schlossberg","savickas","stress","burnout","positive","super","bridges"],"same":"전환 상황의 자원과 회복·적응 행동을 점검한다.","diff":"Schlossberg는 4S 자원, Savickas는 진로적응성, 스트레스 이론은 평가·대처, 소진 관점은 직무요구와 자원 불균형을 본다.","case":"실직 직후에는 4S로 지원과 상황을 점검하고, 장기 탐색에는 진로적응성·작은 실험을 더하세요."},{"id":"assessment","name":"평가·검사·정보","key":"무엇을 어떻게 확인할 것인가?","ids":["assessment","parsons","holland","bigfive","workvalues","gatb","projective","worknet","mmpi"],"same":"평가 자료를 상담 가설과 대화의 출발점으로 사용한다.","diff":"검사는 구성개념·규준·타당도에 따라 역할이 다르며 면담·행동·직업정보와 통합해야 한다.","case":"흥미검사 결과와 실제 경험이 다르면 어느 한쪽을 오류로 보지 말고 맥락과 경험을 추가 탐색하세요."},{"id":"psychodynamic","name":"정신역동·관계 패턴","key":"반복되는 관계·정서 패턴은 무엇을 말하나?","ids":["freud","defense","bordin","adler","jung","attachment","schema","ta"],"same":"현재의 진로 선택과 직장 관계를 과거 경험·정체성·정서적 갈등과 연결해 이해한다. 단, 해석은 내담자와 함께 검증하는 가설이다.","diff":"Freud·Bordin은 무의식적 갈등과 욕구, Adler는 생활양식·격려·사회적 관심, Jung은 심리적 선호와 통합, 애착은 안전기지와 도움 요청, 도식치료는 반복되는 핵심 신념을 강조한다.","case":"권위자와 반복 충돌하면 현재의 상호작용과 경계·의사소통부터 살피고, 반복되는 자기비난은 신념과 경험을 함께 검토하세요. 심층 외상·성격 문제는 임상 전문가와 협력하세요."},{"id":"intervention","name":"상담기술·변화 준비도","key":"지금 어떤 대화와 개입이 가장 적절한가?","ids":["rogers","egan","hill","mi","yocum","prochaska","act","realitytherapy"],"same":"내담자와 협력적 관계를 만들고 현재 준비도에 맞는 작은 변화 행동을 설계한다.","diff":"Rogers는 관계조건, Egan·Hill은 상담 과정, MI는 양가감정, 해결중심은 예외와 선호미래, TTM은 준비도, ACT는 가치 기반 행동, 현실치료는 현재 선택과 계획에 초점을 둔다.","case":"저항처럼 보이면 MI로 양가감정을 탐색하고, 작은 변화가 필요하면 해결중심 질문, 행동을 미루면 준비도와 실행 장벽을 먼저 확인하세요."},{"id":"workplace","name":"직장 적응·소진·직무 설계","key":"현재 직무의 어떤 조건을 바꾸거나 떠나야 하나?","ids":["twa","herzberg","jdr","burnout","jobcraft","jobcharacteristics","workfamily"],"same":"직무 경험은 개인 특성과 업무 요구·자원·보상·관계·조직환경의 상호작용으로 형성된다.","diff":"TWA는 개인-환경 대응, JD-R은 요구-자원 균형, Herzberg는 만족·불만족 요인, 직무특성모형은 과업 설계, 직무재창조는 개인이 조정할 수 있는 경계를 본다.","case":"소진이면 업무요구·자원·보상·통제권을 먼저 점검하고, 조정 가능하면 직무재창조, 구조적 문제가 지속되면 조직 협의·전직·권리 지원을 검토하세요."},{"id":"careeraction","name":"구직 실행·행동 설계","key":"상담실 밖에서 실제 행동을 어떻게 만들까?","ids":["skinner","bandura","jobsearch","krumboltz","locke","thorndike","beck","meichenbaum"],"same":"행동은 작게 나누고, 시도·피드백·성공경험·학습을 반복할 때 지속 가능성이 높아진다.","diff":"Skinner는 행동 결과와 강화, Bandura는 효능감·모델링, Locke는 목표·피드백, Beck은 예측 사고 검증, 구직클럽은 반복 연습과 동료 피드백을 강조한다.","case":"지원 행동이 없으면 과제를 작게 쪼개고, 실패 예측이 강하면 행동실험, 기술 부족이면 모의면접·직무 샘플 과제를 설계하세요."},{"id":"careercrisis","name":"실직·전환·불확실성","key":"변화로 잃은 것과 새로 만들 자원은 무엇인가?","ids":["jobloss","schlossberg","careerimpact","careerchaos","sustainable","super","savickas"],"same":"전환은 직업명 변경만이 아니라 역할·정체성·관계·시간 구조·경제 자원의 재조정이다.","diff":"Jahoda는 일의 잠재 기능과 실직 상실, Schlossberg는 4S 자원, Super는 생애역할, Savickas는 적응성과 이야기, 카오스 관점은 비선형 가능성을 강조한다.","case":"실직 직후에는 생계·일상·지원망을 안정화하고, 이후 작은 탐색 실험과 생애역할 재조정을 순서대로 진행하세요."},{"id":"ethics","name":"상담 구조·윤리","key":"어떻게 시작하고 어디까지 하며 무엇을 지켜야 하는가?","ids":["firstinterview","groupcounsel","assessmentethics","multicultural","kohlberg","mmpi"],"same":"상담의 내용이 아니라 구조(초기면담·집단), 검사 사용의 한계, 윤리적 판단의 기준을 다룬다.","diff":"초기면담은 라포와 구조화, 집단상담은 치료적 요인과 집단 역동, 검사 해석 윤리는 결과의 한계와 동의, 콜버그는 도덕 판단의 수준, 다문화 역량은 문화적 겸손을 강조한다.","case":"검사 결과가 내담자에게 충격일 때는 단정하지 않고 동의와 한계를 설명한 뒤 면담으로 의미를 함께 확인하며, 필요하면 의뢰한다."}];
const DICT=[["16PF","16 Personality Factors","심","커텔이 16개 근원특성으로 성격을 측정하도록 만든 검사.","사회적 대담성이 높게 나와 대인 접촉이 많은 직무를 함께 탐색한다."],["2요인 이론","Two-factor theory","리직","허즈버그: 만족을 주는 동기요인과 불만을 막는 위생요인은 서로 다르다는 이론.","급여(위생)를 올려도 성취감(동기)이 없으면 지루함은 남는다."],["5요인 모델","Big Five","심리","개방성·성실성·외향성·우호성·신경성 다섯 차원으로 성격을 설명하는 모델.","성실성이 높다는 결과를 이력서의 꼼꼼함 사례로 연결한다."],["ABC 모델","ABC model","상리","엘리스: 사건(A)이 아니라 신념(B)이 정서·행동 결과(C)를 만든다는 틀.","면접 탈락(A) → '난 무능해'(B) → 지원 중단(C)을 나눠 적는다."],["ACT","Acceptance and Commitment Therapy","상","불편한 생각을 없애기보다 수용하고 가치 있는 행동을 선택하도록 돕는 접근.","불안은 두되, 오늘 이력서 한 장 쓰기를 가치 행동으로 정한다."],["CASVE 순환","CASVE cycle","직","인지정보처리 이론의 결정 단계: 의사소통·분석·종합·평가·실행.","종합에서 대안을 5개로 넓히고 평가에서 3개로 좁힌다."],["CBT","Cognitive Behavioral Therapy","상","생각·감정·행동의 연결을 점검하고 바꾸는 인지행동치료.","'연락하면 거절당할 것'이라는 생각을 작은 행동으로 검증한다."],["MBTI","Myers-Briggs Type Indicator","심","융의 심리유형에 기반해 선호를 네 지표(E/I, S/N, T/F, J/P)로 나타내는 도구.","결과는 선호를 이야기하는 출발점일 뿐 직업을 처방하지 않는다고 안내한다."],["MMPI-2","Minnesota Multiphasic Personality Inventory-2","심","10개 임상척도와 타당도 척도로 정서·성격 문제를 선별하는 자기보고식 검사.","결과를 진단으로 말하지 않고 의뢰 여부를 판단하는 참고로 쓴다."],["O*NET","Occupational Information Network","직","미국의 직업정보 데이터베이스. 직무·기술·흥미·전망을 제공.","관심 직업의 필요 기술을 O*NET에서 확인해 표로 만든다."],["PIC 모형","Prescreening-In-depth-Choice","직","가티의 결정 모형: 예비선별 → 심층탐색 → 선택.","직업 40개를 조건으로 8개로 줄인 뒤 깊이 비교한다."],["RIASEC","Holland codes","직심","홀랜드의 여섯 유형: 현실·탐구·예술·사회·진취·관습.","상위 코드 SIA에서 상담·교육·콘텐츠 직무를 후보로 놓는다."],["SMART 목표","SMART goals","직상","구체적·측정가능·달성가능·관련성·기한을 갖춘 목표.","'이번 달 안에 현직자 2명과 정보 인터뷰'로 목표를 정한다."],["STAR 기법","Situation-Task-Action-Result","직","경험을 상황·과제·행동·결과로 정리하는 면접 답변 구조.","팀 프로젝트 경험을 STAR로 1분 답변으로 만든다."],["TWA(일 적응 이론)","Theory of Work Adjustment","직심","개인 욕구·능력과 환경의 요구·보상이 조화를 이룰수록 만족과 근속이 높다는 이론.","기술은 충분하나 보상이 욕구와 어긋나 이직을 고민한다."],["T점수","T-score","심","평균 50, 표준편차 10으로 환산한 표준점수.","T점수 65면 평균보다 1.5 표준편차 높다."],["가치관","Values","직심","일과 삶에서 무엇을 중요하게 여기는지에 대한 신념과 기준.","연봉보다 안정이 중요하다는 말에서 선택 기준을 확인한다."],["강점 기반 접근","Strengths-based approach","직상","결함보다 강점·자원을 중심으로 변화를 설계하는 접근.","이직 실패 뒤에도 '일정 관리를 잘한다'는 점을 계획에 쓴다."],["강화","Reinforcement","상리","행동 뒤의 결과로 그 행동이 늘어나는 과정.","지원서 제출 직후 스스로 보상 시간을 두어 구직 행동을 유지한다."],["개방형 질문","Open-ended question","상","'예/아니오'로 답할 수 없고 자유롭게 말하게 하는 질문.","그 일을 하면서 어떤 순간이 가장 힘들었나요?"],["개인-환경 적합","Person-Environment fit","직심","개인 특성과 환경 요건이 맞을수록 만족과 적응이 높다는 관점.","내담자 흥미 유형과 직무환경 유형을 나란히 비교한다."],["객관적 검사","Objective test","심","채점 기준이 정해져 평가자의 주관이 개입되기 어려운 검사.","선택형 흥미검사 점수를 규준과 비교해 설명한다."],["경력 닻","Career anchors","직심","샤인이 말한, 쉽게 포기하지 않는 핵심 가치·역량·동기.","자율성 닻이 강해 규정 많은 조직이 답답하다고 말한다."],["경력 적응성","Career adaptability","직심","변화하는 일 환경에 대비하고 대처하는 자원. 관심·통제·호기심·자신감.","경력 단절 후에도 호기심을 살려 새 분야 강의를 먼저 들어본다."],["계획된 우연","Planned happenstance","직","크럼볼츠: 예기치 않은 사건을 호기심·끈기·융통성으로 기회로 만드는 태도.","우연히 만난 지인의 소개를 정보 인터뷰로 이어 간다."],["공감","Empathy","상","내담자의 경험을 그의 관점에서 이해하고 전달하는 것.","기대했던 면접에서 떨어져 많이 허탈하셨겠어요."],["관습형(C)","Conventional","직심","질서·규칙·정확성을 선호하는 홀랜드 유형.","회계·행정처럼 절차가 분명한 직무에서 안정감을 느낀다."],["구조화","Structuring","상직","상담의 목적·절차·시간·역할·비밀보장을 먼저 설명해 틀을 세우는 일.","첫 회기에 상담의 흐름과 비밀보장의 한계를 안내한다."],["구조화 면접","Structured interview","심","모든 지원자에게 같은 질문을 같은 순서로 묻는 면접. 신뢰도와 공정성이 높다.","직무 기준 질문 5개와 평가표로 면접을 진행한다."],["귀인","Attribution","리","사건의 원인을 노력·능력·운·환경 등에 돌리는 방식.","탈락을 '내 능력 부족'으로만 돌리면 다른 원인도 함께 점검한다."],["규준","Norm","심","점수를 해석하는 비교 기준이 되는 집단의 점수 분포.","원점수를 동년배 규준의 백분위로 바꿔 설명한다."],["근면성","Industry","리직","학령기의 긍정 극. 과제를 끝까지 해내며 노력의 가치를 배우는 감각. 반대 극은 열등감.","학창 시절 끝까지 해낸 경험을 물어 숙달의 단서를 찾는다."],["내담자","Client","상","도움을 구하는 사람. 직업상담에서는 구직자·재직자·학생 등.","내담자의 표현을 그대로 목표 문장에 반영한다."],["내재적 동기","Intrinsic motivation","리심","흥미·즐거움 자체가 이유가 되어 행동하려는 동기.","보상 없이도 데이터 정리를 즐긴다는 말에서 단서를 찾는다."],["논박","Disputing","상","비합리적 신념의 근거와 유용성을 따져 보게 하는 개입.","'모두에게 인정받아야 한다'는 생각의 증거를 함께 묻는다."],["다문화 상담 역량","Multicultural competence","상직","문화적 배경의 차이를 인식하고 존중하며 적절히 개입하는 능력.","이주배경 내담자의 자격 인정 문제를 환경 장벽으로 함께 본다."],["대리학습","Vicarious learning","리","타인의 행동과 결과를 관찰하며 배우는 학습.","현직자 사례를 듣고 '나도 할 수 있겠다'는 기대를 얻는다."],["도덕성 발달","Moral development","리","콜버그: 도덕 판단이 전인습·인습·후인습 수준으로 발달한다는 관점.","윤리 딜레마를 판단 이유의 수준에서 토론한다."],["동기강화상담","Motivational interviewing","상직","양가감정을 탐색해 내담자 스스로 변화 동기를 끌어내는 대화 방식.","바꾸고 싶은 점과 지금이 편한 점을 모두 말하게 한다."],["라포","Rapport","상","상담자와 내담자 사이의 신뢰하고 편안한 관계.","첫 회기에 근황과 기대를 먼저 물어 긴장을 풀어 준다."],["메타인지","Metacognition","리직","자신의 생각·학습·결정 과정을 점검하고 조절하는 능력.","'내가 왜 계속 결정을 미루지?'라고 스스로 점검해 보게 한다."],["명료화","Clarification","상","모호한 말을 구체적으로 확인해 의미를 분명히 하는 기법.","'그냥 안 맞아요'는 어떤 장면에서 그렇게 느끼셨나요?"],["몰입","Flow","리직","도전과 능력이 균형을 이루어 시간 가는 줄 모르고 집중하는 상태.","몰입했던 경험 장면에서 흥미와 강점의 단서를 찾는다."],["무의식","Unconscious","상리","스스로 알아차리지 못하지만 감정과 행동에 영향을 주는 마음의 영역.","권위자와 반복되는 갈등의 정서적 의미를 함께 탐색한다."],["무조건적 긍정적 존중","Unconditional positive regard","상","내담자를 조건 없이 가치 있는 존재로 받아들이는 태도.","계획이 바뀌어도 평가하지 않고 이유를 먼저 듣는다."],["반영","Reflection","상","내담자의 내용·감정을 되돌려 말해 이해했음을 전하는 기법.","'기대와 불안이 함께 있었군요.'"],["발달과업","Developmental task","리직","특정 시기에 성취해야 하며 이루면 이후 적응이 쉬워진다고 보는 과제(하비거스트).","청소년기의 직업 선택·준비 과업 수행 정도를 점검한다."],["방어기제","Defense mechanism","상리","불안·갈등에서 자신을 지키려 무의식적으로 쓰는 전략(억압·합리화·투사 등).","'그 회사는 어차피 별로였어'라는 합리화 뒤 마음을 살핀다."],["백분위","Percentile rank","심","전체 집단에서 그 점수 이하인 사람의 비율.","백분위 80이면 100명 중 약 80명보다 높은 점수다."],["변별성","Differentiation","직심","홀랜드 유형 점수 간 차이가 뚜렷한 정도.","여섯 점수가 비슷하면 변별성이 낮아 추가 경험 탐색을 권한다."],["변화단계 모델","Transtheoretical model","상직","전숙고·숙고·준비·행동·유지로 변화 준비도를 보는 모델.","숙고 단계 내담자에게는 정보 제공보다 이유 탐색부터 한다."],["부적 강화","Negative reinforcement","리","싫은 자극을 없애 주어 행동이 늘어나는 것. 벌과 다르다.","이력서를 쓰고 나면 불안이 줄어 쓰기가 늘어난다."],["비밀보장","Confidentiality","상직","상담 내용을 동의 없이 공개하지 않는 원칙. 생명·안전 위험 등은 예외.","한계를 첫 회기에 먼저 설명한다."],["비합리적 신념","Irrational belief","상리","경직된 당위·파국화로 정서 문제를 낳는 생각.","'절대 실수하면 안 된다'가 지원 회피로 이어진다."],["사례개념화","Case conceptualization","상직","내담자의 문제 원인·유지 요인·강점을 정리해 개입 방향을 세우는 과정.","개인 요인과 환경 장벽을 나눠 가설을 적는다."],["사전 동의","Informed consent","상직","상담의 목적·절차·한계를 알려 주고 동의를 받는 것.","검사 목적과 결과 활용 범위를 설명한 뒤 동의를 받는다."],["사회인지진로이론","SCCT","직심","자기효능감·결과기대·목표가 흥미·선택·수행에 영향을 준다는 이론.","관심은 있으나 자신 없는 내담자에게 작은 성공 과제를 준다."],["사회적 관심","Social interest","상","공동체에 소속되고 기여하려는 마음. 아들러가 건강함의 지표로 봄.","자원봉사 경험이 주는 의미를 직업 목표와 연결한다."],["생산성","Generativity","리직","다음 세대를 돌보고 가치 있는 것을 남기려는 관심. 반대 극은 침체.","중년 내담자의 멘토링·지식 전수 욕구를 직무전환 동기로 확인한다."],["생애 주제","Life theme","직","사비카스: 내담자 이야기 속에 반복되는 핵심 의미.","'도움이 되고 싶다'는 말이 어린 시절부터 반복됨을 짚는다."],["생애진로무지개","Life-Career Rainbow","직","슈퍼의 모형. 시간(생애 공간)과 역할(자녀·학생·직업인 등)을 무지개로 나타냄.","돌봄 역할이 커진 시기의 직업 선택 조건을 함께 본다."],["생태체계","Ecological systems","리직","브론펜브레너: 미시·중간·외·거시·시간체계로 환경을 겹겹이 보는 관점.","내담자의 장벽을 가족·직장·제도 층위로 나눠 정리한다."],["성격","Personality","심리","개인의 비교적 일관된 사고·감정·행동 패턴.","외향성이 높아 사람을 만나는 일에서 에너지를 얻는다."],["성장 마인드셋","Growth mindset","리","능력이 노력과 학습으로 발전한다는 믿음.","'아직 못하는 것'으로 말을 바꿔 보게 한다."],["소거","Extinction","리","강화를 더 주지 않아 행동이 점차 줄어드는 것.","관심 끌기용 연락에 반응하지 않아 행동이 줄어든다."],["소진","Burnout","직심리","만성 업무 스트레스로 인한 정서적 고갈·냉소·효능감 저하.","휴식으로 회복되지 않는 피로를 호소한다."],["수용","Acceptance","상","상황·감정을 바꾸려 애쓰기 전에 있는 그대로 인정하는 태도.","바꿀 수 없는 조건과 바꿀 수 있는 조건을 구분한다."],["스트레스","Stress","리심","요구가 자원을 넘는다고 지각할 때 나타나는 신체·심리 반응.","면접 전 긴장을 호흡 조절로 낮추는 연습을 한다."],["신뢰도","Reliability","심","측정 결과의 일관성과 안정성.","재검사 신뢰도가 높아 한 달 뒤에도 비슷한 결과가 기대된다."],["심리검사","Psychological test","심","표준화된 절차로 심리적 특성을 측정하는 도구.","검사 한 가지로 단정하지 않고 면담과 함께 해석한다."],["심리사회적 유예","Psychosocial moratorium","리직","책임 있는 역할 선택을 잠시 미루고 여러 역할을 시험해 보는 유예 기간.","진학·취업을 서두르지 않고 체험 활동으로 탐색 기간을 설계한다."],["양가감정","Ambivalence","상직","같은 대상에 상반된 마음이 동시에 있는 상태.","이직하고 싶지만 안정도 놓기 싫다는 마음을 함께 인정한다."],["역량","Competency","직심","성과를 내는 데 필요한 지식·기술·태도의 묶음.","직무 역량 목록과 내담자 경험을 대응해 본다."],["역전이","Countertransference","상","내담자에게 상담자가 느끼는 감정 반응.","유독 답답함을 느끼는 이유를 슈퍼비전에서 점검한다."],["역할혼미","Role confusion","리","정체감 형성에 실패해 자신이 누구인지, 어떤 역할을 택할지 흐릿한 상태.","목표가 자주 바뀌는 이유를 탐색 부족과 불안으로 나눠 묻는다."],["외재적 동기","Extrinsic motivation","리심","보상·인정·처벌 회피 등 외부 결과 때문에 행동하려는 동기.","연봉·평판 때문에 지원하는지 흥미 때문인지 구분한다."],["요약","Summarizing","상","대화의 핵심을 정리해 되짚어 주는 기법.","오늘 나온 세 가지 쟁점을 정리하고 우선순위를 묻는다."],["욕구위계","Hierarchy of needs","리직","매슬로: 생리-안전-소속-존중-자아실현으로 욕구를 설명한 이론.","이직 이유를 성장뿐 아니라 안전·존중 욕구까지 확인한다."],["유능감","Competence","리직","근면성 대 열등감 단계에서 얻는 자아 자질(에릭슨). 특정 과제 수행 신념인 반두라의 자기효능감과 구분한다.","성취 경험이 적었다면 작은 숙달 경험부터 확인한다."],["의뢰","Referral","상직","자신의 범위를 넘는 문제를 다른 전문가·기관에 연결하는 것.","심한 우울 호소가 있어 정신건강 전문기관을 안내한다."],["의사결정 스타일","Decision-making style","직심","합리적·직관적·의존적 등 선택하는 방식.","의존적 유형에게는 결정 기준을 스스로 세우는 연습을 돕는다."],["인생구조","Life structure","리직","레빈슨: 한 시기 삶의 기본 패턴. 일·관계를 중심으로 안정기와 전환기가 번갈아 온다.","30대 후반 이직 고민을 인생구조 재점검으로 이해한다."],["인지왜곡","Cognitive distortion","상리","현실을 편향되게 해석하는 사고 오류(흑백논리·과잉일반화 등).","한 번 탈락했다고 '나는 항상 안 된다'로 일반화한다."],["일관성","Consistency","직심","홀랜드: 개인의 높은 유형들이 육각형에서 서로 인접한 정도.","RI는 일관성이 높고 RS는 낮다."],["일치성(홀랜드)","Congruence","직심","개인 유형과 직업환경 유형이 맞는 정도.","사회형 내담자가 고립된 사무직에서 만족이 낮은 이유를 본다."],["임상척도","Clinical scales","심","MMPI-2에서 건강염려·우울·편집증·경조증 등 정서·행동 양상을 나타내는 10개 척도.","T점수 65 이상 척도를 면담 질문의 단서로 삼는다."],["자기개념","Self-concept","상리직","자신에 대해 가지는 지각과 평가의 총체.","일을 통해 어떤 사람으로 보이고 싶은지 묻는다."],["자기개방","Self-disclosure","상","상담자가 의도를 갖고 자신의 경험 일부를 나누는 기법.","비슷한 전환을 겪었다고 짧게 나눈 뒤 초점을 내담자로 돌린다."],["자기결정성 이론","Self-Determination Theory","리직","자율성·유능감·관계성이 충족될 때 동기가 높아진다는 이론.","선택권이 있는 과제로 구직 활동을 설계한다."],["자기효능감","Self-efficacy","리직심","특정 과제를 해낼 수 있다는 믿음. 성공·대리 경험, 설득, 정서 상태가 원천.","면접 연습 성공 경험을 쌓아 자신감을 높인다."],["자동적 사고","Automatic thought","상","상황에서 저절로 떠오르는 순간적 생각.","메일을 보내기 전 '무시당할 거야'가 떠오른다."],["자아 자질","Ego strength · Virtue","리상","에릭슨: 위기를 긍정적으로 해결할 때 얻는 힘. 희망·의지·목적의식·유능감·충실성·사랑·배려·지혜.","현재 시기의 위기와 자질을 함께 말해 보게 한다."],["자아통합","Ego integrity","리","노년기에 삶을 있는 그대로 받아들이고 의미를 통합하는 상태. 반대 극은 절망.","은퇴 상담에서 일 경험의 의미를 정리하게 돕는다."],["작업 동맹","Working alliance","상","목표·과제·정서적 유대에 대한 합의로 이루어진 협력 관계.","과제가 부담된다는 말에 목표와 과제를 다시 합의한다."],["저항","Resistance","상","변화나 상담 과정에 대한 내담자의 망설임·회피.","과제를 안 해 온 이유를 비난 없이 탐색한다."],["적성","Aptitude","심직","훈련 전의 잠재적 수행 능력. 이미 배운 것을 재는 성취도와 구분한다.","흥미는 높지만 적성이 낮은 영역은 훈련 가능성을 함께 본다."],["전이","Transference","상리","과거 중요한 인물에 대한 감정이 현재 상담자에게 옮겨지는 현상.","상담자를 평가자처럼 두려워하는 반응을 관찰한다."],["전환","Transition","직리","슐로스버그: 삶의 역할·관계·일상이 바뀌는 사건. 상황·자기·지지·전략(4S)으로 점검.","실직을 전환으로 보고 지지 자원부터 확인한다."],["점성원리","Epigenetic principle","리","발달이 정해진 순서로 펼쳐지며 각 요소가 지배적으로 떠오르는 시기가 있다는 에릭슨의 원리.","청소년기 정체감 과제를 아동기 근면성 경험의 연장에서 살핀다."],["정보 인터뷰","Informational interview","직","관심 직업의 현직자에게 직무 현실을 묻는 면담.","현직자에게 하루 일과와 입문 경로를 묻는다."],["정체감","Identity","리직","자신이 누구이며 어디로 가는지에 대한 일관된 느낌. 청소년기의 핵심 과제.","진로 선택을 정체감 탐색의 일부로 다루며 이야기를 듣는다."],["조작적 조건형성","Operant conditioning","리","스키너: 행동이 결과에 따라 늘거나 줄어드는 학습.","구직 행동 직후 피드백을 붙여 지속성을 높인다."],["중립지대","Neutral zone","직상","브리지스: 끝맺음과 새로운 시작 사이의 불확실한 중간 시기. 혼란이자 재정비의 기회.","실직 직후엔 결정을 재촉하지 않고 이 시기를 정상화한다."],["직면","Confrontation","상","내담자의 말과 행동·감정 사이의 불일치를 지적하는 기법.","'가고 싶다면서 지원은 미루고 계시네요. 어떤 마음일까요?'"],["직무 기술서","Job description","직심","직무의 과업·책임·환경을 서술한 문서.","공고문의 과업이 내담자 경험과 겹치는지 대조한다."],["직무 만족","Job satisfaction","심직","자신의 일에 대해 느끼는 긍정적 태도와 정서.","업무 내용 불만인지 관계 불만인지 구분해 묻는다."],["직무 명세서","Job specification","직심","직무 수행에 필요한 인적 요건(지식·기술·자격)을 서술한 문서.","요구 자격 중 부족한 항목을 학습 계획으로 만든다."],["직무 크래프팅","Job crafting","직심","구성원이 과업·관계·의미를 스스로 조정해 일을 재설계하는 것.","이직 전에 업무 순서와 협업 방식을 조정해 본다."],["직무분석","Job analysis","직심","직무의 내용과 필요 요건을 체계적으로 조사하는 과정.","현직자 면담과 관찰로 핵심 과업을 정리한다."],["직무특성모형","Job characteristics model","심직","기술 다양성·과업 정체성·중요성·자율성·피드백이 동기와 만족을 높인다는 모형.","반복 업무가 많은 직무에서 자율성을 늘릴 방법을 찾는다."],["직업 정보","Occupational information","직","직업의 하는 일·자격·근무 조건·전망에 관한 자료.","공식 직업정보와 현직자 이야기를 함께 확인한다."],["직업 정체성","Vocational identity","직심","자신의 흥미·능력·목표를 안정적으로 아는 정도.","목표가 자주 바뀌면 정체성 점수가 낮은지 살핀다."],["직업 흥미","Vocational interest","직심","특정 직업 활동에 대한 지속적인 선호.","흥미검사 상위 영역을 실제 활동 경험과 대조한다."],["진로 결정 자기효능감","CDSE","직심","진로 결정에 필요한 과제를 해낼 수 있다는 믿음.","정보 수집 과제부터 성공 경험을 쌓게 한다."],["진로 미결정","Career indecision","직","진로를 정하지 못한 상태. 발달상 미결정과 만성적 우유부단을 구분한다.","정보 부족인지 불안 때문인지 확인한다."],["진로 성숙","Career maturity","직심","발달 과제에 맞게 진로를 준비하고 결정할 수 있는 정도.","계획성과 탐색 행동을 점검해 성숙도를 파악한다."],["진로 장벽","Career barriers","직","진로 선택·진입·적응을 막는 개인·환경 요인.","돌봄·소득·차별 같은 장벽을 개인과 환경으로 나눠 확인한다."],["집단 상담","Group counseling","상직","소규모 집단 상호작용으로 정보 공유와 변화를 돕는 상담.","취업 스트레스 집 williamson:{easy:'상담자가 검사와 자료로 진단하고 방향을 제시하는 방식입니다.',core:[['변별진단 4유형','무선택 · 불확실한 선택 · 흥미와 적성의 모순 · 어리석은 선택'],['상담 기술','촉진적 관계 형성, 자기이해 증진, 행동계획 권고·설계, 계획 수행, 위임(의뢰)'],['검사 해석 3기법','직접 충고 · 설득 · 설명']],ask:['검사 결과 중에서 본인 경험과 맞는 부분, 다른 부분은 어디인가요?'],exam:'6단계: 분석 → 종합 → 진단 → 예후(처방) → 상담 → 추수지도. 진단 다음이 예후라는 순서를 자주 묻는다.',viz:{type:'steps',items:['분석','종합','진단','예후','상담','추수지도']}},
holland:{easy:'사람도 여섯 유형, 일터도 여섯 유형. 비슷한 유형끼리 만나면 오래 만족합니다.',core:[['일치성','개인 유형과 환경 유형이 맞는 정도'],['일관성','상위 코드가 육각형에서 이웃할수록 높다 (RI 높음, RS 낮음)'],['차별성(변별성)','특정 유형 점수가 다른 유형보다 뚜렷한 정도'],['정체성','목표·흥미·재능이 분명하고 안정된 정도'],['계측성','육각형 위의 거리로 유형 간 관계를 설명']],ask:['시간 가는 줄 모르고 했던 활동은 무엇이었나요?','결과 코드가 실제 경험과 다르게 느껴지는 부분이 있나요?'],exam:'일관성은 개인 내부 코드 간 관계, 일치성은 개인과 환경의 관계. 관련 검사: 직업선호도검사(VPI), 자기탐색검사(SDS), 스트롱 검사의 일반직업분류(GOT).',viz:{type:'hex',items:['R 현실형','I 탐구형','A 예술형','S 사회형','E 진취형','C 관습형']}},
twa:{easy:'내가 일터에 맞추고 일터도 나에게 맞춰 줄 때 오래 다닙니다.',core:[['만족(satisfaction)','내 욕구·가치를 직장의 보상이 채워 주는 정도'],['충족(satisfactoriness)','내 능력이 직무 요구를 채우는 정도. 조직이 나를 평가하는 쪽'],['성격양식 4','민첩성 · 역량(속도) · 리듬 · 지구력'],['적응양식 4','융통성 · 끈기 · 적극성 · 반응성'],['검사','MIQ(욕구·가치), MJDQ(직무 강화인), MSQ(만족)']],ask:['지금 직장에서 받지 못하고 있는 것은 무엇인가요?','회사가 나에게 기대하는 것 중 버거운 것은요?'],exam:'만족은 개인이 느끼는 것, 충족은 환경이 개인을 평가하는 것. 둘 다 높아야 근속으로 이어진다. 적극성은 환경을 바꾸려는 것, 반응성은 자신을 바꾸려는 것.',viz:{type:'steps',items:['욕구 ↔ 강화인 = 만족','능력 ↔ 요구 = 충족','근속']}},
roe:{easy:'어릴 때 부모와의 관계가 사람 쪽 일을 좋아할지, 사물 쪽 일을 좋아할지에 영향을 준다는 생각입니다.',core:[['양육 분위기','정서집중형(과보호·과요구) · 회피형(무시·거부) · 수용형(무관심·애정)'],['8 직업군','서비스 · 비즈니스 · 단체 · 기술 · 옥외 · 과학 · 예술과 연예 · 일반문화'],['6 수준','고급 전문관리 · 중급 전문관리 · 준전문관리 · 숙련 · 반숙련 · 비숙련'],['이론 기반','Maslow의 욕구위계']],ask:['어릴 때 집안 분위기는 어땠나요? 지금 사람과 일하는 것과 혼자 하는 일 중 어느 쪽이 편한가요?'],exam:'8×6 분류는 Roe. 실증 근거가 약하다는 비판이 정설이므로 상담에서는 단정하지 않고 탐색 질문으로만 쓴다.'},
ginzberg:{easy:'직업 선택은 한 번의 결정이 아니라 어린 시절부터 이어지는 과정입니다.',core:[['환상기 (~11세)','현실 여건을 고려하지 않고 하고 싶은 것을 꿈꾼다'],['잠정기 (11~17세)','흥미 → 능력 → 가치 → 전환 단계'],['현실기 (17세~)','탐색 → 구체화 → 특수화 단계'],['타협','바람과 현실 사이의 절충. 후기에는 최적화로 수정']],exam:'잠정기 4단계(흥미·능력·가치·전환)와 현실기 3단계(탐색·구체화·특수화)를 섞어 내는 문제가 많다. 초기에는 비가역성을 주장했다가 후에 철회했다.',viz:{type:'steps',items:['환상기','잠정기: 흥미·능력·가치·전환','현실기: 탐색·구체화·특수화']}},
super:{easy:'직업은 평생에 걸쳐 나다움을 펼치는 과정이고, 사람은 동시에 여러 역할을 삽니다.',core:[['성장기 (~14세)','환상기 · 흥미기 · 능력기'],['탐색기 (15~24세)','잠정기 · 전환기 · 시행기'],['확립기 (25~44세)','시행기 · 안정기'],['유지기 (45~64세) · 쇠퇴기 (65세~)','쇠퇴기는 은퇴기라고도 한다'],['발달과업','결정화 → 구체화 → 실행화 → 안정화 → 공고화'],['대순환과 소순환','전환 때마다 성장-탐색-확립을 다시 거친다(재순환)'],['생애진로무지개 · 아치문 모델','생애 역할(자녀·학생·여가인·시민·직업인·배우자·주부·부모·은퇴자)과 개인·사회 요인']],ask:['지금 인생에서 가장 시간을 많이 쓰는 역할은 무엇인가요?','10년 전과 비교해 일의 의미가 어떻게 달라졌나요?'],exam:'Ginzberg를 보완한 이론. 40대의 재취업·전직은 쇠퇴가 아니라 소순환(재탐색)으로 설명한다. 진로성숙(청소년)과 진로적응성(성인)을 구분한다.',viz:{type:'steps',items:['성장기','탐색기','확립기','유지기','쇠퇴기']}},
gottfredson:{easy:'아이는 자라면서 내가 갈 수 없는 직업을 하나씩 지워 나가고, 남은 것 중에서 타협합니다.',core:[['1단계 힘과 크기 (3~5세)','어른이 된다는 것을 안다'],['2단계 성역할 (6~8세)','성별에 맞지 않다고 여기는 직업을 지운다'],['3단계 사회적 가치 (9~13세)','지위·명성 수준이 맞지 않는 직업을 지운다'],['4단계 내적 고유 자아 (14세~)','흥미·가치·능력에 맞춰 고른다'],['타협 순서','흥미를 먼저, 그다음 지위, 성역할은 가장 나중에 포기한다']],ask:['어릴 때 나는 못 할 거라고 접어 둔 일이 있었나요? 왜 그렇게 생각했나요?'],exam:'제한(circumscription)은 대안을 지우는 과정, 타협(compromise)은 현실 때문에 포기하는 과정. 타협에서 가장 끝까지 지키는 것은 성역할.',viz:{type:'steps',items:['힘과 크기','성역할','사회적 가치','내적 고유 자아']}},
tiedeman:{easy:'결정은 고민하는 시기와 실제로 부딪혀 보는 시기로 나뉩니다.',core:[['예상기','탐색 → 구체화 → 선택 → 명료화'],['실천기','순응 → 개혁 → 통합'],['분화와 통합','새 경험을 구분하고 다시 자기 것으로 합치는 과정'],['이론 기반','Erikson의 심리사회 발달']],exam:'예상기 4단계와 실천기 3단계. 순응(적응)-개혁-통합의 순서를 바꿔 내는 문제가 잦다.',viz:{type:'steps',items:['탐색','구체화','선택','명료화','순응','개혁','통합']}},
krumboltz:{easy:'진로는 타고나는 것이 아니라 배운 것의 결과이고, 우연도 준비하면 기회가 됩니다.',core:[['진로 결정 4요인','유전적 요인과 특별한 능력 · 환경 조건과 사건 · 학습경험 · 과제접근기술'],['학습경험 2종','도구적 학습(결과로 배움) · 연상적 학습(짝지어 배움)'],['결과','자기관찰 일반화, 세계관 일반화'],['계획된 우연 5기술','호기심 · 인내심 · 융통성 · 낙관성 · 위험감수'],['우연학습이론(2009)','미결정을 문제가 아니라 열린 마음으로 본다']],ask:['지금 일을 하게 된 데에 우연히 영향을 준 사람이나 사건이 있었나요?','이번 주에 평소 안 하던 것 하나를 해 본다면 무엇일까요?'],exam:'4요인 중 과제접근기술은 나머지 셋의 상호작용 결과. 계획된 우연 5기술은 단골 문제.'},
scct:{easy:'할 수 있다는 믿음과 하면 좋은 일이 생긴다는 기대가 흥미와 선택을 만듭니다.',core:[['자기효능감','특정 과제를 해낼 수 있다는 믿음'],['결과기대','그 행동을 하면 어떤 결과가 올지에 대한 예상'],['개인적 목표','특정 활동에 참여하겠다는 의도'],['효능감의 4원천','성취경험 · 대리경험 · 언어적 설득 · 생리·정서 상태'],['모형','흥미 · 선택 · 수행 모형에 만족 모형, 진로 자기관리 모형(2013)이 더해졌다'],['맥락 요인','근접·원격 지원과 장벽이 흥미가 선택으로 이어지는 것을 막거나 돕는다']],ask:['해 보지도 않고 접은 직업이 있나요? 무엇 때문에 안 된다고 생각했나요?','비슷한 처지에서 그 일을 해낸 사람을 본 적이 있나요?'],exam:'Bandura의 삼원 상호결정론을 진로에 적용. 4원천 중 영향이 가장 큰 것은 성취경험.'},
cip:{easy:'좋은 결정에는 나와 직업에 대한 지식, 결정하는 요령, 그리고 내 생각을 점검하는 힘이 필요합니다.',core:[['정보처리 피라미드','지식 영역(자기 지식·직업 지식) → 의사결정 기술 영역(CASVE) → 실행처리 영역(초인지)'],['CASVE','의사소통 → 분석 → 종합 → 평가 → 실행'],['초인지','자기 대화 · 자기 인식 · 점검과 통제'],['진로사고검사 CTI','의사결정 혼란 · 수행 불안 · 외적 갈등']],ask:['결정을 떠올리면 머릿속에서 어떤 말이 반복되나요?','후보를 몇 개까지 줄여 보셨나요? 줄인 기준은 무엇이었나요?'],exam:'종합 단계는 대안을 넓혔다가(정교화) 줄이는(결정화) 단계. 평가 단계에서 우선순위를 매긴다.',viz:{type:'pyramid',items:['실행처리: 초인지','의사결정 기술: CASVE','지식: 자기 지식 · 직업 지식']}},
savickas:{easy:'직업은 내 인생 이야기의 한 장입니다. 이야기를 다시 써 보면 다음 장이 보입니다.',core:[['직업적 성격','무엇을 하는가. 흥미·능력·가치'],['진로적응성 4C','관심(미래 준비) · 통제(내가 결정) · 호기심(탐색) · 자신감(해낼 수 있음)'],['생애주제','왜 하는가. 일에 부여하는 의미'],['진로구성 면접 CCI','역할 모델 · 즐겨 보는 매체 · 좋아하는 이야기 · 좌우명 · 초기 기억'],['생애설계 상담','구성 → 해체 → 재구성 → 공동구성']],ask:['어릴 때 닮고 싶었던 사람은 누구였나요? 어떤 점이 좋았나요?','요즘 스스로에게 자주 하는 말이 있다면요?'],exam:'Super를 구성주의로 확장. 4C의 한국어 번역(관심·통제·호기심·자신감)을 그대로 묻는다. 측정 도구는 CAAS.'},
bordin:{easy:'진로 고민 뒤에는 불안이나 의존 같은 마음의 문제가 숨어 있을 수 있습니다.',core:[['진단 5범주','의존성 · 정보의 부족 · 자아 갈등 · 진로 선택 불안 · 확신의 결여'],['상담 3단계','탐색과 계약 설정 → 핵심 결정 → 변화를 위한 노력'],['기법','명료화 · 비교 · 소망-방어 체계 해석']],exam:'Williamson(4유형), Crites(적응성·결정성·현실성)와 묶어 문제 유형 분류로 출제된다. 비교 화면에서 나란히 볼 수 있다.'},
crites:{easy:'여러 이론의 좋은 점을 모아 진단하고, 풀어 설명하고, 문제를 해결합니다.',core:[['문제 분류','적응성(적응형·부적응형) · 결정성(다재다능형·우유부단형) · 현실성(비현실형·불충족형·강압형)'],['포괄적 상담 3단계','진단 → 명료화·해석 → 문제 해결'],['진로성숙도검사 CMI','태도 척도(결정성·참여도·독립성·성향·타협성)와 능력 척도(자기평가·직업정보·목표선정·계획·문제해결)']],exam:'불충족형은 자기 능력보다 낮은 직업을 고르는 사람, 비현실형은 능력보다 높은 직업을 고르는 사람.'},
schlossberg:{easy:'변화가 닥쳤을 때 네 가지 주머니(상황·나·도움·전략)에 무엇이 들었는지 살핍니다.',core:[['상황 Situation','원인, 시기, 통제 가능성, 겹친 스트레스'],['자기 Self','나이·건강 같은 조건과 낙관성·효능감 같은 심리 자원'],['지지 Support','가족, 친구, 기관, 제도'],['전략 Strategies','상황 바꾸기, 의미 바꾸기, 스트레스 다루기'],['전환 유형','예상한 전환 · 예상 못 한 전환 · 일어나지 않은 사건']],ask:['이 일이 생긴 뒤 하루가 어떻게 달라졌나요?','지금 연락할 수 있는 사람이나 기관을 세 군데 꼽는다면요?'],exam:'기다리던 승진이 오지 않는 것처럼 일어나지 않은 사건(non-event)도 전환이다.',viz:{type:'grid',items:['상황','자기','지지','전략']}},
pwt:{easy:'일을 고를 자유는 누구에게나 똑같이 주어지지 않습니다. 먹고살 만한 괜찮은 일이 먼저입니다.',core:[['괜찮은 일 5요소','안전한 근무 조건 · 쉴 시간 · 가족·사회 가치와 맞는 조직 가치 · 적정한 보상 · 의료 접근'],['두 장벽','경제적 제약, 소외 경험'],['두 매개','일 자유의지(work volition), 진로적응성'],['일이 채우는 욕구','생존 · 사회적 연결 · 자기결정']],ask:['선택지를 좁히는 가장 큰 현실 조건은 무엇인가요? 생계, 돌봄, 거리, 건강 중에서요.'],exam:'동기가 낮아 보이는 내담자에게 먼저 구조적 장벽을 묻게 하는 이론. 국민취업지원제도 Ⅰ유형 참여자 상담의 기본 관점으로 쓸 만하다.'},
gelatt:{easy:'결정은 정보를 모아 따져 보는 과정이지만, 불확실함을 받아들이는 유연함도 필요합니다.',core:[['의사결정 순환','목표 설정 → 정보 수집 → 대안 열거 → 결과 예측 → 가능성 평가 → 가치 평가 → 결정 → 평가 → 재투입'],['긍정적 불확실성(1989)','합리성만으로 부족하다. 직관과 유연성으로 불확실성을 받아들인다']],exam:'1962년 모형은 합리적 처방 모형, 1989년에는 스스로 수정해 긍정적 불확실성을 제안했다.'},
harren:{easy:'결정하는 방식은 따져 보는 사람, 느낌대로 하는 사람, 남에게 맡기는 사람으로 나뉩니다.',core:[['합리적 유형','정보를 모아 논리적으로 결정하고 책임을 진다'],['직관적 유형','감정과 상상에 따라 결정하고 책임은 진다'],['의존적 유형','다른 사람의 기대에 따르고 책임을 밖으로 돌린다'],['과정 4단계','인식 → 계획 → 확신 → 이행']],exam:'직관적 유형도 결정 책임은 스스로 진다. 책임을 회피하는 쪽은 의존적 유형.'},
dinklage:{easy:'결정을 미루는 사람, 운에 맡기는 사람, 고민만 하는 사람. 결정 습관은 여덟 가지로 나뉩니다.',core:[['계획형','합리적으로 따져 결정'],['직관형 · 충동형','느낌으로 결정 · 첫 대안을 바로 선택'],['순응형 · 운명론형','남의 뜻에 따름 · 운에 맡김'],['지연형 · 번민형 · 무력형','미룸 · 정보만 모으며 고민 · 두려움에 결정 회피']],exam:'번민형은 정보는 많은데 결정을 못 하는 사람, 지연형은 결정 자체를 뒤로 미루는 사람.'},
rogers:{easy:'사람은 충분히 존중받고 이해받으면 스스로 답을 찾아갑니다.',core:[['상담자의 세 태도','일치성(진실성) · 무조건적 긍정적 존중 · 공감적 이해'],['자기와 경험의 불일치','이상적 자기와 실제 경험이 어긋날 때 불안이 생긴다'],['충분히 기능하는 사람','경험에 열려 있고 자기를 신뢰한다'],['진로 적용 (Patterson)','검사와 정보는 내담자가 원할 때 제공한다']],ask:['그 일을 그만두었을 때 어떤 마음이었는지 조금 더 들려주시겠어요?'],exam:'비지시적 → 내담자 중심 → 인간 중심으로 이름이 바뀌었다. 진단과 검사를 최소화하는 점이 특성-요인 상담과 대비된다.'},
freud:{easy:'지금의 선택과 불안에는 스스로 알아차리지 못한 과거 경험이 섞여 있습니다.',core:[['성격 구조','원초아 · 자아 · 초자아'],['의식 수준','의식 · 전의식 · 무의식'],['불안 3종','현실 불안 · 신경증적 불안 · 도덕적 불안'],['기법','자유연상 · 꿈 분석 · 전이 분석 · 저항 분석 · 해석 · 훈습']],exam:'심리성적 발달: 구강기 → 항문기 → 남근기 → 잠복기 → 생식기. 직업상담에서는 Bordin, Roe의 이론 기반으로 연결된다.'},
adler:{easy:'사람은 부족함을 메우려 애쓰며 살고, 누군가에게 도움이 될 때 건강해집니다.',core:[['열등감과 보상','열등감은 성장의 동력'],['생활양식','어릴 때 형성된 삶의 방식. 지배형 · 기생형 · 회피형 · 사회적 유용형'],['사회적 관심','공동체에 기여하려는 마음. 정신건강의 기준'],['가상적 최종 목표 · 출생 순위','삶을 이끄는 허구의 목표, 형제 서열의 영향'],['상담 4단계','관계 형성 → 생활양식 탐색 → 통찰 → 재정향']],ask:['일을 통해 누구에게 어떤 도움이 되고 싶으세요?'],exam:'세 가지 인생 과제는 일 · 사랑 · 우정(사회). 생애진로사정(LCA)의 이론 기반.'},
ellis:{easy:'괴로움은 사건 때문이 아니라 사건을 받아들이는 생각 때문입니다.',core:[['ABCDE','선행 사건 → 신념 → 결과 → 논박 → 효과'],['비합리적 신념','반드시 해야 한다 · 끔찍하다 · 견딜 수 없다 · 나는 가치 없다'],['논박 종류','논리적 · 경험적 · 실용적 논박']],ask:['떨어지면 끝이라는 생각, 정말 사실일까요? 그렇게 믿으면 내게 도움이 되나요?'],exam:'Ellis는 신념을 직접 논박하고, Beck은 증거를 함께 검증한다(협력적 경험주의).'},
beck:{easy:'순간적으로 스치는 생각을 붙잡아 사실인지 확인해 봅니다.',core:[['자동적 사고','상황에서 저절로 떠오르는 생각'],['인지적 오류','흑백논리 · 과잉일반화 · 선택적 추상 · 임의적 추론 · 개인화 · 과장과 축소'],['핵심 신념(도식)','나, 세상, 미래에 대한 뿌리 깊은 믿음. 인지삼제'],['기법','사고 기록지, 소크라테스식 질문, 행동 실험']],ask:['서류에서 떨어졌다는 문자를 봤을 때 처음 든 생각은 무엇이었나요?'],exam:'한 번의 탈락으로 나는 어디에도 못 간다고 결론 내리면 과잉일반화, 근거 없이 결론 내리면 임의적 추론.'},
skinner:{easy:'행동 뒤에 좋은 일이 따르면 그 행동은 늘어납니다.',core:[['강화','정적 강화(좋은 것을 줌), 부적 강화(싫은 것을 없앰). 둘 다 행동을 늘린다'],['처벌','행동을 줄인다'],['강화 계획','고정간격 · 변동간격 · 고정비율 · 변동비율'],['행동조성','목표 행동에 가까워질 때마다 단계적으로 강화']],ask:['이력서 한 편을 쓰고 나면 스스로에게 무엇을 해 주시겠어요?'],exam:'부적 강화는 처벌이 아니다. 소거에 가장 강한 계획은 변동비율.'},
bandura:{easy:'사람은 남이 하는 것을 보고 배우고, 할 수 있다고 믿는 만큼 시도합니다.',core:[['관찰학습 4과정','주의 → 파지 → 운동 재생 → 동기화'],['자기효능감','할 수 있다는 믿음. 4원천은 성취경험 · 대리경험 · 언어적 설득 · 생리·정서 상태'],['삼원 상호결정론','개인 · 행동 · 환경이 서로 영향을 준다']],exam:'효능감(할 수 있다)과 결과기대(하면 보상이 온다)를 구분한다.'},
maslow:{easy:'배고프고 불안하면 자아실현을 생각하기 어렵습니다. 욕구에는 순서가 있습니다.',core:[['5단계','생리 → 안전 → 소속·애정 → 존중 → 자아실현'],['결핍 욕구와 성장 욕구','아래 넷은 결핍, 자아실현은 성장']],exam:'Alderfer의 ERG는 좌절-퇴행을 인정하고 여러 욕구가 동시에 작동한다고 본다.',viz:{type:'pyramid',items:['자아실현','존중','소속·애정','안전','생리']}},
herzberg:{easy:'월급이 오르면 불만은 줄지만, 일이 재미있어지지는 않습니다.',core:[['동기 요인','성취 · 인정 · 일 자체 · 책임 · 성장. 채워지면 만족'],['위생 요인','급여 · 감독 · 회사 정책 · 대인관계 · 작업 조건. 부족하면 불만족'],['핵심','만족의 반대는 불만족이 아니라 만족 없음']],exam:'급여는 위생 요인. 직무 충실화의 이론적 근거.'},
vroom:{easy:'노력하면 될 것 같고, 되면 보상이 오고, 그 보상이 내게 값질 때 움직입니다.',core:[['기대','노력하면 성과가 날 것이라는 믿음'],['수단성','성과가 보상으로 이어질 것이라는 믿음'],['유인가','그 보상이 나에게 갖는 가치'],['공식','동기 = 기대 × 수단성 × 유인가. 하나라도 0이면 동기도 0']],ask:['지원해도 안 될 것 같아서인가요, 붙어도 별로일 것 같아서인가요?']},
deciryan:{easy:'스스로 고르고, 잘한다고 느끼고, 사람들과 이어져 있을 때 저절로 하고 싶어집니다.',core:[['기본 심리 욕구 3','자율성 · 유능성 · 관계성'],['동기 연속선','무동기 → 외적 조절 → 내사 → 동일시 → 통합 → 내재 동기'],['과잉정당화','외적 보상이 내재 동기를 떨어뜨릴 수 있다']],ask:['이 구직 활동 중에서 내가 직접 고른 것은 무엇인가요?'],exam:'수당 때문에 하는 구직활동(외적 조절)을 내 목표와 연결된 활동(동일시)으로 옮기는 것이 상담 목표가 될 수 있다.'},
mi:{easy:'바꾸고 싶은 마음과 그대로 있고 싶은 마음이 함께 있을 때, 설득하지 않고 스스로 말하게 돕습니다.',core:[['정신','협동 · 수용 · 연민 · 유발'],['핵심 기술 OARS','열린 질문 · 인정하기 · 반영하기 · 요약하기'],['네 과정','관계 맺기 → 초점 맞추기 → 유발하기 → 계획하기'],['변화 대화','바람 · 능력 · 이유 · 필요에서 결심 · 실행으로'],['피할 것','교정 반사. 고쳐 주고 싶은 충동']],ask:['지금 이대로 6개월이 지나면 어떨 것 같으세요?','취업 준비를 시작한다면 0에서 10 중 지금 몇 점쯤이고, 왜 0점은 아닌가요?'],exam:'저항은 내담자의 특성이 아니라 상호작용의 신호(불화)로 본다. 수당 요건 때문에 왔다는 참여자에게 특히 잘 맞는다.'},
yocum:{easy:'문제의 원인을 캐기보다 이미 잘 되고 있는 것과 원하는 모습에 집중합니다.',core:[['질문 5종','기적 질문 · 예외 질문 · 척도 질문 · 대처 질문 · 관계성 질문'],['내담자 관계 유형','고객형 · 불평형 · 방문형'],['원칙','효과 있으면 더 하고, 효과 없으면 다른 것을 한다']],ask:['구직이 조금이라도 덜 막막했던 날은 언제였나요? 그날은 무엇이 달랐나요?'],exam:'방문형은 문제의식 없이 의뢰되어 온 사람. 칭찬과 다음 방문 약속 정도가 적절하다.'},
prochaska:{easy:'사람마다 변화할 준비 정도가 다릅니다. 지금 단계에 맞는 말을 건네야 합니다.',core:[['전숙고','문제라고 생각하지 않는다. 정보를 주고 관계를 유지'],['숙고','해야 하나 말아야 하나. 양가감정을 탐색'],['준비','곧 하려 한다. 구체적 계획'],['실행 · 유지','행동 지원, 재발 대비']],exam:'재발은 실패가 아니라 과정의 일부. 숙고 단계 내담자에게 행동 과제를 밀면 중도 탈락이 는다.',viz:{type:'steps',items:['전숙고','숙고','준비','실행','유지']}},

N('counselstages','직업상담의 과정 5단계','직업상담 실천 표준','현행','skill','관계 형성, 진단, 목표 설정, 개입, 평가','직업상담은 관계를 맺고, 진단하고, 목표를 정하고, 개입한 뒤 평가하는 순서로 진행된다.','관계 형성과 구조화 → 진단 및 측정 → 목표 설정 → 개입(중재) → 평가의 다섯 단계로 정리한다. 목표는 구체적이고 실현 가능하며 내담자가 원하는 것이어야 하고, 상담자의 기술과 맞아야 한다.','회기 기록 첫 줄에 지금 어느 단계인지 적어 두면 상담이 정보 수집에만 머무는 것을 막을 수 있다.','단계는 직선이 아니다. 개입 중에 새 정보가 나오면 진단과 목표로 돌아간다.','firstinterview,crites,egan',{easy:'친해지고, 알아보고, 목표를 정하고, 돕고, 돌아봅니다.',viz:{type:'steps',items:['관계 형성','진단·측정','목표 설정','개입','평가']},exam:'Crites의 포괄적 상담은 진단 → 명료화·해석 → 문제 해결의 3단계.'}),
N('lca','생애진로사정 LCA','Gysbers · Moore (Adler 이론 기반)','1987','skill','진로 사정, 전형적인 하루, 강점과 장애, 요약','검사 없이 구조화된 면담으로 내담자의 일·교육·여가 경험과 생활 방식을 파악하는 첫 면담 기법이다.','네 부분으로 구성된다. ① 진로 사정: 일 경험, 교육·훈련, 여가 활동. ② 전형적인 하루: 의존적인지 독립적인지, 체계적인지 자발적인지. ③ 강점과 장애: 주요 강점 3가지와 장애 3가지. ④ 요약: 내담자가 자기 말로 정리한다. Adler의 일·사회·성(사랑) 세 과제를 바탕으로 한다.','국민취업지원제도 초기 상담에서 검사 전에 15분 LCA를 하면 취업활동계획의 재료가 대부분 나온다.','검사를 꺼리거나 검사 결과가 낯설게 느껴지는 내담자에게 특히 좋다. 수치 자료는 얻을 수 없다.','adler,firstinterview,gysbers',{easy:'평소 하루를 어떻게 보내는지 들으면 그 사람의 일하는 방식이 보입니다.',core:[['진로 사정','일 경험 · 교육과 훈련 · 여가'],['전형적인 하루','의존적-독립적, 체계적-자발적'],['강점과 장애','강점 3가지, 장애 3가지'],['요약','내담자 스스로 정리']],ask:['평일 하루를 아침부터 밤까지 이야기해 주시겠어요?','지금까지 일하면서 좋았던 점과 싫었던 점을 하나씩 든다면요?'],exam:'LCA의 네 구조와 Adler 기반이라는 점이 자주 출제된다. 얻는 정보: 직업 경험과 교육 수준, 기술과 능력에 대한 자기 평가, 가치관과 자기 인식.',viz:{type:'steps',items:['진로 사정','전형적인 하루','강점과 장애','요약']}}),
N('gysbers','내담자 정보·행동 이해 9기법','Norman Gysbers · Earl Moore','1987','skill','가정 사용, 전이된 오류, 저항감, 근거 없는 믿음, 변명','내담자의 말 속에 숨은 왜곡과 저항을 알아차리고 다루는 아홉 가지 면담 기법이다.','① 가정 사용하기 ② 의미 있는 질문과 지시 사용하기 ③ 전이된 오류 정정하기(정보의 오류·한계의 오류·논리적 오류) ④ 분류와 재구성하기 ⑤ 저항감 재인식하고 다루기 ⑥ 근거 없는 믿음 확인하기 ⑦ 왜곡된 사고 확인하기 ⑧ 반성의 장 마련하기 ⑨ 변명에 초점 맞추기.','이 나이에 누가 뽑아 주겠어요 같은 말은 한계의 오류다. 실제로 지원해 본 곳과 결과를 구체적으로 물어 정보를 채운다.','기법으로 몰아세우면 취조가 된다. 관계가 먼저다.','lca,beck,mi',{easy:'내담자의 말에서 빠진 정보, 지나친 일반화, 핑계를 부드럽게 짚어 줍니다.',core:[['정보의 오류','삭제, 불확실한 명사·동사 사용, 참고 자료 없음'],['한계의 오류','예외를 인정하지 않음, 불가능을 가정, 어쩔 수 없음을 가정'],['논리적 오류','잘못된 인과관계, 마음 읽기, 제한된 일반화'],['변명 유형','책임 회피하기 · 결과를 다르게 조직하기 · 책임 변형시키기']],exam:'아홉 가지 이름을 그대로 묻는다. 전이된 오류의 세 종류도 단골.'}),
N('skills','상담 기본 기술','Carkhuff · Ivey 등 미시상담 전통','1969/1971','skill','경청, 반영, 명료화, 요약, 직면, 해석, 즉시성','이론이 무엇이든 상담자가 공통으로 쓰는 대화 기술이다.','경청(적극적 경청), 최소 격려, 내용 반영(재진술), 감정 반영, 명료화, 요약, 질문(열린·닫힌), 직면(말과 행동의 불일치를 짚음), 해석(새로운 의미 제시), 즉시성(지금 상담 관계에서 일어나는 일을 다룸), 자기 개방, 정보 제공이 있다. Carkhuff는 공감 수준을 5단계로 나누었다.','내담자의 말을 고쳐 주고 싶을 때 먼저 감정 반영을 한 번 한다. 답답하셨겠어요 한마디가 조언 세 개보다 낫다.','직면과 해석은 관계가 충분히 쌓인 뒤에 쓴다.','rogers,egan,hill',{easy:'잘 듣고, 들은 것을 돌려주고, 필요한 때 짚어 줍니다.',core:[['반영','내용 반영은 사실을, 감정 반영은 마음을 돌려준다'],['명료화','모호한 말을 분명히 해 달라고 요청'],['직면','불일치를 비난 없이 드러낸다'],['즉시성','지금 여기 상담 관계를 이야기한다'],['Carkhuff 공감 수준','3수준이 상호 교류 가능한 최소 수준']],exam:'명료화는 내담자 말이 모호할 때, 직면은 모순이 있을 때.'}),
N('ethics','직업상담 윤리','한국카운슬러협회 · NCDA 윤리강령','현행','skill','비밀보장, 사전 동의, 이중 관계, 역량 범위, 기록','내담자의 복지와 자기결정권을 지키기 위해 상담자가 따라야 하는 기준이다.','핵심은 사전 동의, 비밀보장과 그 한계, 이중 관계 회피, 역량 범위 안에서의 실천, 검사의 적절한 사용, 기록 관리다. 비밀보장의 예외: 자신이나 타인의 생명·안전이 위험할 때, 감염성 질병 등 법이 정한 경우, 법원의 명령, 아동학대 등 신고 의무 사항.','제도 운영상 고용센터에 보고되는 정보가 무엇인지 첫 회기에 알려 준다. 수당 요건 정보와 상담 내용의 경계를 분명히 한다.','위기 징후(자해·자살 생각)가 보이면 혼자 판단하지 말고 정신건강복지센터, 109 자살예방상담전화 등과 연계한다.','firstinterview,assessmentethics,multicultural',{easy:'비밀을 지키고, 동의를 받고, 내가 할 수 있는 범위 안에서 돕습니다.',exam:'상담자가 해결할 수 없는 문제는 다른 전문가에게 의뢰한다. 내담자와 금전·사적 관계를 맺지 않는다.'}),
N('tolbert','집단직업상담','E. L. Tolbert · Butcher','1974','skill','집단, 탐색, 전환, 행동, 자기 탐색','여러 구직자가 함께 자기 이해, 직업 정보 탐색, 의사결정을 연습하는 상담 형태다.','Butcher의 3단계: 탐색(자기 개방, 흥미와 적성 측정, 결과 피드백, 불일치 해결) → 전환(자기 지식을 직업 세계와 연결, 가치관 변화 조사) → 행동(목표 설정, 행동 계획, 자원 탐색, 정보 수집과 공유). Tolbert는 집단의 활동으로 자기 탐색, 상호작용, 개인 정보 검토, 직업·교육 정보 검토, 의사결정을 들었다.','국민취업지원제도 집단상담 프로그램을 설계할 때 회기를 탐색·전환·행동 세 묶음으로 나눈다.','비밀 유지가 어렵고, 개인의 문제가 묻히거나 압력을 느끼는 참여자가 생길 수 있다.','groupcounsel,jobsearch,counselstages',{easy:'비슷한 처지의 사람들과 함께하면 정보도 얻고 나만 그런 게 아니라는 걸 압니다.',exam:'Butcher 3단계는 탐색 → 전환 → 행동. 집단의 장점: 시간·경제성, 소속감, 대리 학습, 피드백.',viz:{type:'steps',items:['탐색','전환','행동']}}),
N('probtypes','직업상담 문제 유형 분류','Williamson · Bordin · Crites · Phillips','1939–1968','skill','변별진단, 무선택, 의존성, 적응성, 결정성, 현실성','내담자의 진로 문제를 유형으로 나눠 개입 방향을 정하는 네 가지 분류 체계다.','Williamson: 무선택, 불확실한 선택, 흥미와 적성의 모순, 어리석은 선택. Bordin: 의존성, 정보의 부족, 자아 갈등, 진로 선택 불안, 확신의 결여. Crites: 적응성, 결정성, 현실성. Phillips: 자기 탐색과 발견, 선택을 위한 준비, 의사결정 과정, 선택과 결정, 실천.','첫 면담 후 이 내담자의 주된 어려움이 정보 부족인지, 불안인지, 비현실적 기대인지 한 줄로 적는다.','분류는 상담자의 가설이다. 내담자에게 유형을 통보하는 용도가 아니다.','williamson,bordin,crites',{easy:'무엇 때문에 막혔는지 먼저 가려야 맞는 도움을 줄 수 있습니다.',exam:'네 학자의 분류를 섞어 누구의 분류인지 묻는다. 비교 화면에 표로 정리되어 있다.'}),
N('decisiontools','대안 평가와 의사결정 도구','Janis & Mann · de Bono · Yost','1977/1985','decide','대차대조표, 6개의 생각하는 모자, 원하는 성과 연습, 확률 추정','후보를 놓고 고민하는 내담자가 장단점과 결과를 눈에 보이게 정리하도록 돕는 도구다.','의사결정 대차대조표(Janis & Mann): 나와 타인에게 생기는 이득과 손실, 나와 타인의 인정 여부를 적는다. 6개의 생각하는 모자(de Bono): 백(사실) · 적(감정) · 흑(비판) · 황(낙관) · 녹(새 아이디어) · 청(정리). Yost의 직업 평가 기법: 원하는 성과 연습, 찬반 연습, 대차대조표 연습, 확률 추정 연습, 미래를 내다보는 연습.','후보 두 곳을 두고 망설일 때 종이를 넷으로 나눠 대차대조표를 함께 채운다. 내담자가 직접 쓰게 한다.','표의 점수가 높은 쪽이 정답은 아니다. 적고 난 뒤의 느낌을 다시 묻는다.','gelatt,cip,decisionpic',{easy:'머릿속에서만 굴리지 말고 종이에 적어 비교합니다.',exam:'6색 모자의 색과 역할 짝짓기, Yost의 다섯 연습 이름이 출제된다.'}),
N('hansen','통합적 생애설계 ILP','L. Sunny Hansen','1997','dev','통합, 전체성, 일과 가족, 다원성, 영성, 전환','일을 삶의 다른 역할들과 떼지 않고 하나의 퀼트처럼 엮어 설계해야 한다는 접근이다.','여섯 가지 과제: ① 변화하는 세계에서 해야 할 일 찾기 ② 삶을 의미 있는 전체로 엮기 ③ 가족과 일을 연결하기 ④ 다원성과 포용성 존중하기 ⑤ 영성과 삶의 목적 탐색하기 ⑥ 개인의 전환과 조직의 변화 관리하기.','경력 보유 여성이나 돌봄을 병행하는 내담자와 일·가족·건강·배움을 한 장에 그려 본다.','추상적이라는 비판이 있다. 구체적 구직 행동 계획과 함께 써야 한다.','super,workfamily,kcm',{easy:'직업만 따로 정하는 게 아니라 가족, 건강, 의미까지 함께 놓고 설계합니다.',exam:'여섯 가지 중요한 과제를 묻는다. 퀼트 비유가 특징.'}),
N('brown','가치 중심 진로 접근','Duane Brown','1996','fit','가치, 우선순위, 생애 역할, 만족','흥미보다 가치가 진로 선택과 만족을 좌우한다고 보는 모형이다.','가치는 행동의 기준이며 유전과 환경의 상호작용으로 만들어진다. 사람은 우선순위가 높은 소수의 가치에 따라 선택하고, 생애 역할 만족은 그 역할이 핵심 가치를 채워 주는 정도에 달려 있다. 가치가 뚜렷이 결정화되고 우선순위가 정해져 있어야 좋은 결정이 가능하다.','후보 직업마다 내 상위 가치 세 개를 얼마나 채워 주는지 0~10으로 적어 본다.','가치가 불분명한 내담자에게는 먼저 경험을 쌓게 해야 한다.','workvalues,careeranchors,twa',{easy:'무엇을 좋아하느냐보다 무엇을 중요하게 여기느냐가 오래갑니다.'}),
N('stf','진로 체계이론 틀 STF','Wendy Patton · Mary McMahon','1999/2014','context','개인 체계, 사회 체계, 환경-사회 체계, 순환성, 우연','개인과 그를 둘러싼 여러 겹의 체계가 서로 영향을 주고받으며 진로가 만들어진다고 보는 통합 틀이다.','가운데에 개인 체계(성별·나이·능력·흥미·가치·건강), 그 바깥에 사회 체계(가족·또래·학교·직장·매체), 가장 바깥에 환경-사회 체계(지역·노동시장·정치·역사·세계화)가 있다. 과정 요인은 순환성, 시간에 따른 변화, 우연이다. 여러 진로 이론을 하나의 지도에 얹는 메타이론이다.','나의 진로 영향 체계 그리기(MSCI): 동심원을 그려 나에게 영향을 준 사람과 조건을 적게 한다.','포괄적인 만큼 구체적 개입 절차는 다른 이론에서 가져와야 한다.','bronfenbrenner,vondracek,scct',{easy:'내 진로는 나 혼자 만든 것이 아니라 가족, 지역, 시대가 함께 만든 것입니다.',now:1}),
N('vondracek','발달적 맥락주의','Fred Vondracek · Richard Lerner · John Schulenberg','1986','context','개인-맥락 상호작용, 가소성, 역동','진로 발달을 변화하는 개인과 변화하는 환경이 계속 주고받는 과정으로 본다.','개인은 환경의 영향을 받기만 하지 않고 환경을 바꾸기도 한다. Bronfenbrenner의 생태체계를 진로 발달에 적용했으며, 발달 단계의 고정된 순서보다 맥락에 따른 가소성을 강조한다.','지역 일자리 구조가 바뀐 지역의 내담자에게 개인의 선택과 지역 여건을 나란히 놓고 이야기한다.','추상적이어서 측정과 검증이 어렵다.','bronfenbrenner,stf,super',{easy:'사람도 변하고 세상도 변하니, 진로는 둘의 주고받음입니다.'}),
N('hackettbetz','진로 자기효능감','Gail Hackett · Nancy Betz · Karen Taylor','1981/1983','learn','자기효능감, 여성 진로, 진로결정 자기효능감','자기효능감 개념을 진로 영역에 처음 적용해 여성이 특정 직업을 피하는 이유를 설명했다.','능력이 충분해도 효능감이 낮으면 선택지에서 그 직업을 지운다. 사회화 과정에서 여성은 성취경험과 역할 모델 같은 효능감 원천에 덜 접근했다고 보았다. 진로결정 자기효능감 척도(CDSE)는 자기 평가, 직업 정보 수집, 목표 선택, 계획 수립, 문제 해결 다섯 영역을 잰다.','오래 쉬었으니 못 한다는 내담자와 최근 1년간 해낸 일을 목록으로 적어 성취경험을 다시 찾는다.','효능감만 올린다고 구조적 장벽이 사라지지 않는다.','bandura,scct,gendercareer',{easy:'못해서가 아니라 못할 거라고 믿어서 포기하는 경우가 많습니다.',exam:'SCCT의 출발점이 된 연구. CDSE 5영역은 Crites의 능력 척도 5영역과 같다.'}),
N('measure','측정 기초: 신뢰도와 타당도','Cronbach · Campbell & Fiske 등','1951/1959','assess','신뢰도, 타당도, 측정 오차, 표준화','검사가 얼마나 일관되게 재는지(신뢰도)와 재려는 것을 제대로 재는지(타당도)를 따지는 기준이다.','신뢰도 종류: 검사-재검사(안정성), 동형검사(동등성), 반분, 내적 합치도(크론바흐 알파, KR-20), 채점자 간 신뢰도. 타당도 종류: 내용 타당도, 안면 타당도, 준거 타당도(예언·동시), 구성 타당도(수렴·변별·요인분석). 신뢰도는 타당도의 필요조건이지 충분조건이 아니다.','검사 결과를 설명하기 전에 이 검사는 무엇을 재고 무엇은 재지 않는지 한 문장으로 먼저 말한다.','신뢰도가 높아도 엉뚱한 것을 재고 있을 수 있다.','assessment,norms,assessmentethics',{easy:'저울이 매번 같은 값을 보여 주는가, 그리고 그 저울이 몸무게를 재는 게 맞는가.',core:[['신뢰도에 영향','문항 수가 많을수록, 개인차가 클수록, 문항 반응 수가 적정할수록 높다. 속도 검사에는 반분법이 부적절'],['준거 타당도','예언 타당도는 미래 성과와, 동시 타당도는 현재 기준과의 상관'],['구성 타당도','수렴 타당도는 높아야, 변별 타당도는 낮아야 한다'],['측정의 표준오차','점수를 한 점이 아니라 범위로 해석하게 하는 근거']],exam:'안면 타당도는 수검자 눈에 그럴듯해 보이는 정도로, 전문가가 판단하는 내용 타당도와 다르다.'}),
N('norms','규준과 표준점수 해석','심리측정 전통','현행','assess','백분위, Z점수, T점수, 스테나인, 규준 집단','원점수를 비교 집단 안에서의 위치로 바꿔 해석하는 방법이다.','백분위: 나보다 낮은 사람의 비율. Z점수: 평균 0, 표준편차 1. T점수: 평균 50, 표준편차 10 (T = 10Z + 50). 스테나인(표준등급): 1~9, 평균 5, 표준편차 2. 발달 규준에는 연령 규준, 학년 규준이 있다. 표집 방법: 단순 무선, 층화, 집락, 체계적 표집.','내담자에게는 100명 중 몇 번째쯤으로 바꿔 말한다. T점수 60은 100명 중 위에서 16번째쯤이다.','규준 집단이 내담자와 다르면(연령·학력·시기) 해석이 틀어진다. 규준의 제작 연도를 확인한다.','measure,assessment,gatb',{easy:'점수 자체보다 비슷한 사람들 사이에서 어디쯤인지를 봅니다.',core:[['Z = (원점수 − 평균) ÷ 표준편차','예: 평균 60, 표준편차 10에서 70점이면 Z = 1, T = 60'],['정규분포','평균 ±1 표준편차 안에 약 68%, ±2 안에 약 95%'],['백분위와 백분율','백분위는 상대 위치, 백분율은 맞힌 비율']],exam:'Z와 T 계산 문제는 실기 단골. 스테나인은 2차 세계대전 때 미 공군이 개발했다.'}),
N('korassess','고용24 직업심리검사 활용','고용노동부 · 한국고용정보원','현행','assess','직업선호도검사, 성인용 직업적성검사, 구직준비도검사, 직업가치관검사','고용24에서 무료로 제공하는 성인·청소년용 직업심리검사를 상담 목적에 맞게 고르는 방법이다.','성인 대상 주요 검사: 직업선호도검사 S형(흥미)과 L형(흥미·성격·생활사), 성인용 직업적성검사, 직업가치관검사, 구직준비도검사, 창업적성검사, 직업전환검사, 중장년 직업역량검사, 대학생 진로준비도검사, 이주민 취업준비도검사 등이 있다. 워크넷 직업심리검사는 2024년 고용24로 통합되었다. 검사 종류와 명칭은 개편될 수 있으니 고용24 직업심리검사 메뉴에서 확인한다.','방향을 못 잡은 내담자는 직업선호도검사 S형, 오래 쉰 내담자는 구직준비도검사, 전직 희망자는 직업전환검사나 직업가치관검사부터 권한다.','온라인 검사 결과지를 그냥 건네지 않는다. 결과를 내담자 경험과 대조하는 해석 상담이 있어야 검사가 의미를 가진다.','holland,assessment,worknet',{easy:'무료 검사가 많지만, 지금 고민에 맞는 한두 개만 고르는 것이 요령입니다.',now:1,ask:['결과에서 맞다 싶은 부분과 의외인 부분은 어디였나요?']}),
N('cardsort','직업카드 분류','Leona Tyler · Dolliver','1961/1967','assess','카드 분류, 질적 평가, 선호 이유','직업명이 적힌 카드를 좋아함·싫어함·모르겠음으로 나누며 그 이유를 이야기하는 질적 평가 도구다.','분류 자체보다 왜 그렇게 나눴는지를 묻는 과정에서 가치와 선택 기준이 드러난다. 표준화 검사에 부담을 느끼는 내담자, 읽기 부담이 큰 내담자에게 쓰기 좋다.','싫어하는 카드 더미에서 공통점을 찾으면 내담자가 피하고 싶은 근무 조건이 나온다.','카드 구성이 오래되면 요즘 직업이 빠진다. 결과를 수치로 비교할 수 없다.','holland,lca,kelly',{easy:'카드를 나누다 보면 내가 무엇을 기준으로 일을 고르는지 저절로 보입니다.'}),
N('genogram','진로 가계도','Okiishi · Bowen 가족체계 전통','1987','assess','가계도, 가족의 직업, 세대 전수, 기대','3세대 가족의 직업과 일에 대한 태도를 그림으로 그려 가족이 진로에 미친 영향을 살핀다.','가족 구성원의 직업, 학력, 일에 대한 가치, 성역할 기대, 성공과 실패의 이야기를 표시한다. 내담자가 당연하게 여겨 온 직업관이 어디에서 왔는지 보게 한다.','부모가 반대해서 못 했다는 말이 반복될 때 가계도를 그려 가족의 기대와 내 바람을 구분한다.','가족사가 아픈 내담자에게는 조심스럽게, 동의를 구하고 진행한다.','bowen,familycareer,roe',{easy:'가족이 어떤 일을 해 왔는지 그려 보면 내 직업관의 뿌리가 보입니다.'}),
N('brayfield','직업정보의 기능과 활용','Brayfield · Christensen 외','1950','assess','정보적 기능, 재조정 기능, 동기화 기능','직업정보는 알려 주고, 현실에 맞게 고쳐 주고, 움직이게 하는 세 가지 일을 한다.','Brayfield의 세 기능: 정보적 기능(모르는 것을 알려 결정을 돕는다), 재조정 기능(비현실적 선택을 점검하게 한다), 동기화 기능(결정 과정에 적극 참여하게 한다). 직업정보 처리 단계는 수집 → 분석 → 가공 → 체계화 → 제공 → 축적 → 평가다.','희망 임금이 시장과 크게 다를 때 고용24 임금 정보와 실제 공고 세 건을 함께 보며 재조정한다.','정보를 한꺼번에 쏟으면 압도된다. 내담자가 물은 만큼, 한 번에 한 가지.','worknet,jobanalysis,parsons',{easy:'좋은 정보는 눈을 뜨게 하고, 기대를 현실에 맞추고, 움직이게 합니다.',exam:'세 기능의 이름을 그대로 묻는다. 정보 제공은 상담 과정에서 내담자가 필요로 할 때 한다.'}),
N('jobstress','직무 스트레스 모형','Karasek · Siegrist · Selye','1979/1996','motive','요구-통제, 노력-보상 불균형, 일반적응증후군, 역할 갈등','일이 사람을 지치게 하는 조건을 요구와 통제, 노력과 보상의 불균형으로 설명한다.','Karasek의 요구-통제 모형: 요구가 높고 재량이 낮은 일이 가장 해롭다. 사회적 지지를 더해 요구-통제-지지 모형으로 확장되었다. Siegrist의 노력-보상 불균형: 들인 노력에 비해 임금·인정·안정이 적을 때 건강이 나빠진다. Selye의 일반적응증후군: 경고 → 저항 → 소진. 역U자 가설: 적당한 긴장에서 수행이 가장 좋다. 스트레스 요인에는 역할 갈등, 역할 모호성, 역할 과부하가 있다.','이직을 고민하는 내담자와 요구, 재량, 지지, 보상 네 칸을 채워 보면 직장을 떠날 문제인지 조정할 문제인지 구분된다.','개인의 대처만 강조하면 조직 문제를 개인 탓으로 돌리게 된다.','jdr,burnout,stress',{easy:'일이 많은 것보다 내 마음대로 할 수 있는 게 없을 때 더 지칩니다.',core:[['A유형 행동','경쟁적, 시간 압박, 적대감. 심혈관 질환과 관련'],['조절 요인','통제 소재, 사회적 지지, A/B유형'],['역할 갈등 종류','역할 내 갈등, 역할 간 갈등, 개인 내 역할 갈등, 송신자 간 갈등']],exam:'일반적응증후군 3단계 순서와 역할 갈등·역할 모호성 구분이 자주 나온다.'}),
N('adams','공정성 이론','J. Stacy Adams','1963','motive','투입, 산출, 비교 대상, 불공정','사람은 내가 들인 것과 받은 것의 비율을 다른 사람과 비교해 공정한지 판단한다.','투입(노력·경력·학력)과 산출(임금·인정·승진)의 비율이 비교 대상과 다르면 긴장이 생기고, 투입을 줄이거나 산출을 요구하거나 비교 대상을 바꾸거나 떠나는 방식으로 균형을 맞추려 한다.','같은 일을 하는데 월급이 다르다는 불만이 이직 사유일 때, 다음 직장에서 무엇과 무엇이 맞아야 공정하다고 느낄지 구체화한다.','무엇을 투입과 산출로 볼지는 사람마다 다르다.','herzberg,vroom,twa',{easy:'월급이 적어서가 아니라 옆 사람보다 덜 받아서 화가 납니다.',exam:'과다 보상을 받아도 긴장을 느낀다고 본다.'}),
N('alderfer','ERG 이론','Clayton Alderfer','1969','motive','존재, 관계, 성장, 좌절-퇴행','Maslow의 다섯 욕구를 존재·관계·성장 세 가지로 줄이고 순서의 엄격함을 풀었다.','존재(E)는 생리·안전, 관계(R)는 소속·대인 존중, 성장(G)은 자기 존중·자아실현에 해당한다. 여러 욕구가 동시에 작동할 수 있고, 상위 욕구가 좌절되면 하위 욕구가 더 커지는 좌절-퇴행이 일어난다.','성장 기회가 막힌 직장에서 급여에만 집착하게 됐다는 내담자를 좌절-퇴행으로 이해해 본다.','실증 근거는 제한적이다.','maslow,herzberg,mcclelland',{easy:'성장이 막히면 돈이나 관계에 더 매달리게 됩니다.',exam:'Maslow와의 차이: 동시 작동, 좌절-퇴행.'}),
N('orgcareer','조직 안의 경력 발달','Douglas Hall · Edgar Schein · Dalton','1976/1978','motive','경력 단계, 3차원 원뿔, 경력 정체, 멘토링','입사에서 퇴직까지 조직 안에서 경력이 움직이는 단계와 방향을 설명한다.','Hall의 경력 단계: 탐색 → 확립 → 유지 → 쇠퇴. Schein의 3차원 모형: 수직 이동(직급), 수평 이동(기능·부서), 중심 이동(핵심부로의 접근). 경력 개발 제도에는 직무 순환, 멘토링, 경력 워크숍, 사내 공모가 있다. 경력 정체(plateau)는 승진 가능성이 낮아진 상태다.','40대 중반의 승진 정체 호소를 수직 이동이 막힌 것으로 정리하고, 수평·중심 이동이나 조직 밖 이동을 함께 본다.','한 조직에서의 장기 근속을 전제로 한 모형이라 지금의 잦은 이동을 다 설명하지 못한다.','careeranchors,protean,super',{easy:'위로만 가는 것이 경력이 아닙니다. 옆으로도, 안쪽으로도 움직입니다.'}),
N('psycap','심리적 자본 HERO','Fred Luthans','2007','motive','희망, 효능감, 회복탄력성, 낙관성','개발할 수 있는 네 가지 긍정 심리 자원으로, 직무 수행과 구직 성과와 관련된다.','Hope(목표로 가는 길과 의지), Efficacy(해낼 수 있다는 믿음), Resilience(역경에서 회복), Optimism(긍정적 귀인). 성격처럼 고정된 것이 아니라 훈련으로 키울 수 있는 상태로 본다.','장기 구직자 집단 프로그램에서 네 요소를 회기 주제로 삼는다.','개인의 긍정성만 강조하면 구조적 문제를 가릴 수 있다.','positive,bandura,hat',{easy:'희망, 자신감, 다시 일어서는 힘, 긍정적 해석. 네 가지 마음 근육입니다.',now:1}),
N('lifedesign','생애설계 상담과 진로구성 면접','Mark Savickas 외','2009/2012','dev','생애설계, 진로구성 면접, 구성·해체·재구성·공동구성, 생애 초상','불확실한 시대에 직업을 맞추는 대신 삶의 이야기를 함께 다시 써서 다음 행동을 찾는 21세기 상담 패러다임이다.','진로구성 면접(CCI)의 다섯 질문: 역할 모델, 즐겨 보는 잡지·프로그램·웹사이트, 좋아하는 이야기, 좌우명, 초기 기억. 상담자는 작은 이야기들을 모아 생애 초상을 쓰고, 내담자와 함께 다음 장을 구상한다. 과정은 구성 → 해체 → 재구성 → 공동구성이다. 2012년 Savickas는 직업지도(매칭)·진로교육(발달)·생애설계(구성)를 세 패러다임으로 정리했다.','경력이 여러 갈래라 한 줄로 설명하기 어려운 40대 내담자와 그 경험들을 꿰는 주제 한 문장을 찾는다. 자기소개서의 뼈대가 된다.','이야기 작업에는 시간과 언어적 여유가 필요하다. 당장 생계가 급한 내담자에게는 뒤로 미룬다.','savickas,narrative,hat',{easy:'이력서의 빈칸이 아니라 내 이야기의 흐름을 봅니다.',now:1,core:[['다섯 질문이 보여 주는 것','역할 모델은 자기 개념, 매체는 선호 환경, 이야기는 각본, 좌우명은 스스로에게 주는 조언, 초기 기억은 몰두하는 문제'],['세 패러다임','점수(매칭) → 단계(발달) → 이야기(구성)']],ask:['어릴 때 존경한 사람 세 명을 꼽는다면 누구이고 어떤 점이 좋았나요?']}),
N('hat','희망-행동 이론','Spencer Niles · Norman Amundson · Hyung Joon Yoon','2011','dev','희망, 자기 성찰, 자기 명료화, 비전, 목표, 실행과 적응','희망을 중심에 두고 성찰에서 실행까지 여섯 역량을 키워 불확실한 진로를 헤쳐 나가게 한다.','여섯 역량: 희망, 자기 성찰, 자기 명료화, 비전 세우기, 목표 설정과 계획, 실행과 적응. 희망은 나머지 다섯을 움직이는 바람개비의 축이다. 실직자와 대학생 대상 개입 연구가 쌓이고 있다.','탈락이 이어진 내담자에게 계획을 다시 세우기 전에 희망을 먼저 다룬다. 그래도 가능하다고 느꼈던 순간을 찾는다.','희망을 낙관 강요로 오해하지 않는다. 현실 조건 점검과 함께 간다.','psycap,savickas,krumboltz',{easy:'될 것 같다는 느낌이 있어야 계획도 세우고 움직입니다.',now:1}),
N('kcm','만화경 경력 모형 KCM','Lisa Mainiero · Sherry Sullivan','2005','dev','진정성, 균형, 도전, 생애 시기','사람은 생애 시기에 따라 진정성·균형·도전 세 가지의 비중을 만화경처럼 바꿔 가며 경력을 만든다.','도전(Challenge)은 성장과 성취, 균형(Balance)은 일과 삶의 조화, 진정성(Authenticity)은 나답게 사는 것이다. 초기에는 도전, 중기에는 균형, 후기에는 진정성이 앞에 오는 패턴이 여성 경력에서 자주 관찰되었다.','지금 세 가지 중 무엇이 가장 앞에 있는지 물으면 40대 내담자의 이직 사유가 선명해진다.','패턴은 경향일 뿐이고 개인차가 크다.','hansen,workfamily,protean',{easy:'젊을 땐 도전, 아이 키울 땐 균형, 그다음엔 나다움. 시기마다 중요한 게 바뀝니다.',now:1}),
N('crm','경력 자원 모형과 전생애 커리어 설계','Andreas Hirschi','2012/2026','dev','인적 자본, 사회 자본, 심리 자원, 정체성 자원, 전생애','경력을 스스로 관리하는 데 필요한 자원을 네 묶음으로 정리하고, 일과 삶 전체를 함께 설계하도록 확장한 모형이다.','네 자원: 인적 자본(지식·기술·경험), 사회 자본(관계·멘토), 심리 자원(효능감·희망·회복탄력성), 경력 정체성 자원(나는 누구이며 무엇을 원하는가). Hirschi는 2026년 전생애 커리어 설계(Whole-Life Career Design) 틀에서 자원, 능동적 설계, 생애 주기와 생활 영역 전체를 보는 관점, 목표 설정에서 점검·조정으로 이어지는 순환을 강조했다.','네 자원을 0~10으로 스스로 매기게 하면 무엇부터 채울지 우선순위가 나온다.','자원 점검이 자기 탓으로 흐르지 않도록 환경 여건도 함께 본다.','sustainable,employability,psycap',{easy:'기술, 사람, 마음, 방향. 네 가지 통장의 잔고를 확인합니다.',now:1}),
N('employability','고용가능성','Mel Fugate · Angelo Kinicki · Blake Ashforth','2004','dev','경력 정체성, 개인 적응성, 사회·인적 자본','일자리를 찾고 유지하고 옮길 수 있게 하는 개인의 능동적 적응 역량이다.','세 차원: 경력 정체성(나는 어떤 일하는 사람인가), 개인 적응성(변화에 맞춰 바꾸려는 의지와 능력), 사회·인적 자본(관계망과 학력·경험·기술). 고용 보장이 줄어든 시대에 고용 안정 대신 고용가능성이 강조된다.','재직 중인 내담자에게 지금 회사를 떠나도 쓸 수 있는 것을 세 차원으로 점검하게 한다.','개인에게 책임을 모두 넘기는 논리로 쓰일 수 있다.','protean,crm,skillsfirst',{easy:'한 회사에 붙어 있는 힘이 아니라 어디서든 일할 수 있는 힘입니다.',now:1}),
N('calling','소명으로서의 일','Bryan Dik · Ryan Duffy','2009/2018','mind','소명, 의미, 친사회적 동기, 소명 실현','일을 삶의 목적과 연결되고 타인에게 기여하는 것으로 경험하는 태도다.','Dik과 Duffy는 소명을 초월적 부름, 목적과 의미, 친사회적 지향 세 요소로 정의했다. 소명으로서의 일 이론(2018)은 소명을 느끼는 것과 실제로 살아내는 것을 구분하고, 살아낼 기회가 없으면 오히려 고통이 될 수 있다고 본다.','의미 있는 일을 원하지만 생계 때문에 못 한다는 내담자와 지금 일 안에서 소명을 조금이라도 실현할 방법을 찾는다.','소명 의식은 과로와 착취를 견디게 하는 쪽으로 쓰일 위험이 있다.','workmeaning,frankl,jobcraft',{easy:'일이 밥벌이를 넘어 내가 사는 이유와 이어질 때 소명이라 부릅니다.',now:1}),
N('jobsearchsr','구직 자기조절','Ruth Kanfer · Connie Wanberg · Edwin van Hooft','2001/2021','learn','구직 강도, 구직의 질, 목표, 자기조절, 구직 효능감','구직은 스스로 목표를 세우고 감정을 다루며 행동을 유지해야 하는 자기조절 과정이다.','구직 행동의 양(강도)만이 아니라 질(목표 명료성, 준비, 피드백 반영)이 성과를 가른다. 메타분석에서 구직 효능감, 목표 명료성, 사회적 지지가 구직 행동과 취업에 일관되게 관련되었다. 효과적 개입은 구직 기술 훈련, 효능감 증진, 목표 설정, 사회적 지지 확보를 포함한다.','지원 건수만 세지 말고 공고 분석을 했는지, 탈락 후 무엇을 바꿨는지를 주간 점검표에 넣는다.','거절이 반복되면 자기조절 자원이 고갈된다. 휴식과 정서 지원이 계획의 일부다.','jobsearch,locke,bandura',{easy:'많이 지원하는 것보다 제대로 지원하고, 떨어진 뒤 고쳐 가는 것이 중요합니다.',now:1}),
N('soc','선택·최적화·보상 SOC','Paul Baltes · Margret Baltes','1990','dev','선택, 최적화, 보상, 성공적 노화, 중장년','나이 들며 자원이 줄어들 때 목표를 고르고, 가진 것을 갈고닦고, 부족한 것을 다른 방법으로 메우는 전략이다.','선택(Selection): 목표를 좁힌다. 최적화(Optimization): 고른 영역에 자원을 집중한다. 보상(Compensation): 잃은 기능을 도구·협력·방법 변경으로 대체한다. 중장년 근로자의 직무 수행과 일 능력 유지 연구에 널리 쓰인다.','체력이 예전 같지 않다는 50대 내담자와 줄일 것, 집중할 것, 바꿀 방법을 세 칸에 적는다.','선택할 여지가 없는 일자리에서는 적용에 한계가 있다.','super,sustainable,midlife',{easy:'다 하려 하지 말고 고르고, 집중하고, 요령으로 메웁니다.',now:1}),

const ALL=BASE.concat(NEWS);const T={};
ALL.forEach(x=>{Object.assign(x,PATCH[x.id]||{},ENRICH[x.id]||{});x.key=!!ENRICH[x.id]||KEYNEW.includes(x.id);x.ko=KO[x.id]||'';const m=String(x.year).match(/\d{4}/);x.y=m?+m[0]:9999;T[x.id]=x});
ALL.forEach(x=>{x.rel=String(x.related||'').split(',').map(s=>s.trim()).filter(id=>T[id]&&id!==x.id)});
const FAM={};FAMS.forEach(([id,name,q,h])=>FAM[id]={id,name,q,h});

function row(x){const b=x.now?'<span class="bd">요즘</span>':x.isNew?'<span class="bd w">추가</span>':'';
  return `<button class="row fam" style="--h:${hue(x)}" data-act="open" data-id="${x.id}"><span class="dot"></span><span class="rt"><b>${esc(x.title)}</b><small>${esc(x.ko?x.ko+' · ':'')}${esc(x.person)} · ${esc(x.year)}</small><em>${esc(store.easy&&x.easy||x.summary)}</em></span>${b}</button>`}
const list=ids=>{const a=ids.map(i=>typeof i==='string'?T[i]:i).filter(Boolean);return a.length?`<div class="list">${a.map(row).join('')}</div>`:''};
const mini=ids=>`<div class="mini">${ids.filter(i=>T[i]).map(i=>`<button class="fam" style="--h:${hue(T[i])}" data-act="open" data-id="${i}">${esc(T[i].title)}</button>`).join('')}</div>`;
const seg=(name,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="seg" data-name="${name}" data-v="${v}" aria-pressed="${st.seg[name]===v}">${l}</button>`).join('')}</div>`;
const searchBox=(ph)=>`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" placeholder="${ph}" value="${esc(st.q)}" aria-label="검색"></div>`;

function find(q){q=q.trim().toLowerCase();if(!q)return[];const out=[];
  for(const x of ALL){let s=0;const has=v=>String(v||'').toLowerCase().includes(q);
    if(has(x.title))s+=6;if(has(x.person)||has(x.ko))s+=4;if(has(x.keywords))s+=3;if(has(x.easy)||has(x.summary))s+=2;if(has(x.detail)||has(x.exam))s+=1;
    if(x.core&&x.core.some(c=>has(c[0])||has(c[1])))s+=2;if(s)out.push([s+(x.key?.5:0),x])}
  return out.sort((a,b)=>b[0]-a[0]).map(a=>a[1])}
const findDict=q=>{q=q.trim().toLowerCase();return q?DICT.filter(d=>d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q)):[]};
const dictRow=d=>`<div><dt>${esc(d[0])} <small class="hint">${esc(d[1])}</small></dt><dd>${esc(d[3])}${d[4]?`<br><span class="hint">예: ${esc(d[4])}</span>`:''}</dd></div>`;

/* 홈 */
function homeBody(){
  if(st.q.trim()){const r=find(st.q),d=findDict(st.q);
    return `<section class="sec"><div class="sh"><h2>이론 ${r.length}건</h2></div>${list(r.slice(0,40))||'<p class="empty">맞는 이론이 없습니다. 학자 이름이나 핵심어로 다시 찾아보세요.</p>'}</section>${d.length?`<section class="sec"><div class="sh"><h2>용어 ${d.length}건</h2></div><div class="card"><dl class="kv" style="margin:0">${d.slice(0,12).map(dictRow).join('')}</dl></div></section>`:''}`}
  const now=ALL.filter(x=>x.now),rec=store.recent.filter(i=>T[i]).slice(0,4);
  return `<section class="sec"><div class="sh"><h2>상황으로 찾기</h2><small>상담 장면에서 바로</small></div>
  ${SITS.map(([t,d,ids])=>`<details class="acc"><summary><span><b>${esc(t)}</b><small>${esc(d)}</small></span></summary><div class="in">${list(ids)}</div></details>`).join('')}</section>
  <section class="sec"><div class="sh"><h2>갈래로 보기</h2><small>${ALL.length}개 이론</small></div><div class="grid2">
  ${FAMS.map(([id,n,q,h])=>`<button class="tile fam" style="--h:${h}" data-act="fam" data-v="${id}"><b>${n}</b><small>${q}</small><small>${ALL.filter(x=>x.fam===id).length}개</small></button>`).join('')}</div></section>
  <section class="sec"><div class="sh"><h2>요즘 흐름</h2><button class="btn s" data-act="fam" data-v="now">모두 보기</button></div><div class="chips scroll">
  ${now.map(x=>`<button class="chip fam" style="--h:${hue(x)}" data-act="open" data-id="${x.id}"><span class="dot"></span>${esc(x.title)}</button>`).join('')}</div></section>
  ${rec.length?`<section class="sec"><div class="sh"><h2>이어 보기</h2></div>${list(rec)}</section>`:''}`}
function vHome(){return `<header class="hero"><h1>직업상담 이론 위키</h1><p>직업상담과 직업심리, 그리고 일반 상담·심리에서 가져다 쓸 이론 ${ALL.length}개를 쉬운 말과 상담 질문으로 정리했습니다.</p></header>${searchBox('이론, 학자, 핵심어로 찾기')}<div id="res" style="display:contents">${homeBody()}</div>
<footer>학습과 실무 참고용 자료입니다. 이론과 검사만으로 사람을 단정하지 말고 내담자의 동의, 현실 조건, 상담자의 역량 범위를 함께 확인하세요. 제도 수치는 2026년 11월 기준이며 해마다 바뀝니다. 스크랩과 복습 기록은 이 브라우저에만 저장됩니다. 각 이론의 설명은 이론가의 원저작과 표준 교재 내용을 바탕으로 이 자료실이 새로 쓴 요약이며, 원문을 옮기지 않았습니다. 이론의 이름과 창시자, 연도는 각 항목에 적었습니다.</footer>`}

/* 이론 목록 */
function thBody(){let a=st.q.trim()?find(st.q):ALL.slice();const f=st.filter;
  if(f==='now')a=a.filter(x=>x.now);else if(f==='new')a=a.filter(x=>x.isNew);else if(f==='saved')a=a.filter(x=>store.saved.includes(x.id));else if(f!=='all')a=a.filter(x=>x.fam===f);
  if(st.keyOnly)a=a.filter(x=>x.key);
  if(!st.q.trim())a.sort(st.sort==='yr'?(x,y)=>x.y-y.y||byKo(x,y):byKo);
  const fm=FAM[f];
  return `${fm?`<p class="hint">${esc(fm.q)}?</p>`:''}<div class="sh"><small>${a.length}개</small><div class="btns"><button class="btn s" data-act="keyonly" aria-pressed="${st.keyOnly}">${st.keyOnly?'핵심만 보는 중':'핵심만'}</button><button class="btn s" data-act="sort">${st.sort==='ko'?'가나다순':'연도순'}</button></div></div>${list(a)||'<p class="empty">조건에 맞는 이론이 없습니다.</p>'}`}
function vTheories(){const c=(v,l,h)=>`<button class="chip${h!=null?' fam':''}" ${h!=null?`style="--h:${h}"`:''} data-act="filter" data-v="${v}" aria-pressed="${st.filter===v}">${h!=null?'<span class="dot"></span>':''}${l}</button>`;
