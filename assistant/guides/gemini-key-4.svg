<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="만들어진 키를 복사해 비서 입력칸에 붙여넣는 화면">
  <rect width="320" height="200" rx="12" fill="#faf6ef"/>
  <rect x="12" y="12" width="296" height="88" rx="10" fill="#fffdf8" stroke="#d8ccb9"/>
