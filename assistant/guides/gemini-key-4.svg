  <path d="M160 100 L160 116" stroke="#c2452d" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M154 112 L160 120 L166 112" fill="none" stroke="#c2452d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="12" y="124" width="296" height="64" rx="10" fill="#f5efe4" stroke="#d8ccb9"/>
