<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 사이트 공통 테마: 첫 화면 설정(jc-theme)을 따른다. 자동이면 오전 7시~오후 7시는 밝게, 그 밖에는 어둡게. */
(function(){var m='auto';try{m=localStorage.getItem('jc-theme')||'auto';}catch(e){}
var h=new Date().getHours(),t=(m==='light'||m==='dark')?m:(h>=7&&h<19?'light':'dark');
document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef" id="metaTheme">
<meta name="description" content="면접 질문 38장을 카드 대전의 문법으로 연습합니다. 숨은 의도, 함정·방어·카운터·실드 카드, 말하기 구간 타이머, 기업 유형별 역질문, 약점 방어 조립기, 2026년 전형 변화.">
<title>면접 전술 덱 · 질문 카드로 연습하기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf6ef;--panel:#fffdf8;--soft:#f3ede2;--line:#e9e0d2;--line-2:#d8ccb9;
  --ink:#2a2521;--muted:#655c53;--dim:#6e645b;
  --acc:#1d4e6b;--acc-soft:rgba(29,78,107,.09);
  --c-trap:#6e645b;--c-defense:#1d4e6b;--c-counter:#8f4a00;--c-shield:#2f6b3a;
  --warn:#8f6200;--warn-soft:rgba(143,98,0,.10);--alert:#a8321f;--alert-soft:rgba(168,50,31,.08);
  --slot:#8a3b12;--slot-bg:rgba(138,59,18,.09);
  --shadow:0 1px 2px rgba(70,50,25,.05),0 10px 28px -18px rgba(70,50,25,.30);--edge:rgba(42,37,33,.14);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08090c;--panel:#10141d;--soft:#141a26;--line:#1e232f;--line-2:#2c3445;
  --ink:#e6e9ef;--muted:#9aa2b4;--dim:#8a93a8;
  --acc:#8cc8e8;--acc-soft:rgba(140,200,232,.11);
  --c-trap:#8a93a8;--c-defense:#8cc8e8;--c-counter:#f0b27a;--c-shield:#8fd19e;
  --warn:#f0c060;--warn-soft:rgba(240,192,96,.10);--alert:#f39a8a;--alert-soft:rgba(243,154,138,.10);
  --slot:#f0a57a;--slot-bg:rgba(240,165,122,.12);
  --shadow:none;--edge:rgba(230,233,239,.10);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;max-width:100%}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
body{font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 20px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (min-width:900px){.wrap{max-width:1280px;padding:0 28px 24px}}

.hd{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.ib{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.ib svg{width:20px;height:20px}
.brand{flex:0 1 auto;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap;overflow:hidden}
.brand svg{width:24px;height:24px;flex:none;color:var(--acc)}
.brand span{color:var(--acc)}
.hd>[data-jc-prefs]{margin-left:auto}
.rst{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-size:14px;font-weight:750}
.rst svg{width:18px;height:18px;color:var(--acc)}
@media (max-width:420px){.rst span{display:none}.rst{width:44px;padding:0;justify-content:center}}

.pv{margin:0 0 4px}
.pv-t{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 2px;border-radius:12px}
.pv-t svg{flex:none;width:20px;height:20px;color:var(--acc)}
.pv-tt{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--muted)}
.pv-tt b{color:var(--ink);font-weight:750;margin-right:8px;white-space:nowrap}
.pv-c{flex:none;font-size:14px;font-weight:700;color:var(--acc)}
.pv-b ul{margin:4px 0 12px;padding:0 0 0 2px;list-style:none;display:grid;gap:6px}
@media (min-width:900px){.pv-b ul{grid-template-columns:1fr 1fr;column-gap:24px}}
.pv-b li{position:relative;padding-left:16px;font-size:14px;line-height:1.65;color:var(--muted)}
.pv-b li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.pv-b li b{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 위쪽: 진입 · 탭 */
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 10px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 13px;border-radius:11px;font-size:14.5px;font-weight:750;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.when{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.when span{font-size:13px;font-weight:700;color:var(--dim)}
.when button{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:750}
.when button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
@media (max-width:899px){.when{margin-left:0;width:100%;flex-wrap:nowrap}.when button{flex:1 1 0;padding:0 6px}}
@media (max-width:520px){.when span{font-size:12px;max-width:4.6em;line-height:1.25}}

.box{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.two{grid-template-columns:320px minmax(0,1fr);gap:18px}}
.pane{display:flex;flex-direction:column;min-height:0;height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:360px}
@media (min-width:900px){.pane{height:calc(100vh - 212px);height:calc(100dvh - 212px)}}
.ph{flex:none;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.scr{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips+.chips{margin-top:6px}
.chips button{min-height:44px;padding:2px 11px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips button small{font-weight:600;opacity:.7;margin-left:3px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:7px 10px;border-radius:12px;text-align:left}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.row .no{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:12px;font-weight:850;color:var(--acc);transform:rotate(-5deg)}
.row .nm{flex:1;min-width:0;font-size:14.5px;font-weight:650;line-height:1.4}
.row .nm small{display:block;font-size:12px;font-weight:550;color:var(--dim)}
.row .lg{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (max-width:899px){
  .pane{height:auto;min-height:0}
  .scr,.fbody{overflow:visible}
  .field .fbar{position:sticky;top:0;z-index:5;background:var(--panel);border-radius:18px 18px 0 0}
  .trc{padding:5px 12px}
  .trc>summary{list-style:none;display:flex;flex-direction:column;gap:0;min-height:44px;cursor:pointer}
  .trc>summary .cf{margin:0 0 2px}
  .trc>summary h4{margin:0;font-size:14.5px}
  .tr{gap:6px}
  .trc>summary::-webkit-details-marker{display:none}
}
@media (min-width:900px){.trc>summary{list-style:none;pointer-events:none}.trc>summary::-webkit-details-marker{display:none}}
@media (max-width:899px){.list-pane{display:none}.list-pane.open{display:flex;position:fixed;inset:auto 0 0 0;z-index:40;height:auto;max-height:80vh;max-height:80dvh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:rise .28s cubic-bezier(.2,.9,.3,1)}}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(20,16,12,.42)}

/* 필드(한 턴) */
.field{display:flex;flex-direction:column;min-height:0}
.fbar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fbar .pos{flex:1;text-align:center;font-size:13.5px;font-weight:750;color:var(--muted)}
.fbar button{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:750}
.fbar .lst{display:none}
@media (max-width:899px){.fbar .lst{display:inline-block}}
.fbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 16px 18px}
.qcard{position:relative;padding:16px 16px 14px;border-radius:18px;background:var(--panel);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--edge)}
.qcard.land{animation:land .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes land{from{opacity:0;transform:translateY(-16px) scale(1.03)}to{opacity:1;transform:none}}
.qcard .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px;font-size:12.5px;font-weight:750;color:var(--dim)}
.qcard h2{margin:0 0 6px;font-size:clamp(19px,2.2vw,23px);line-height:1.45;letter-spacing:-.03em}
.qcard .ctx{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
.pips{display:inline-flex;gap:2px;align-items:center}
.pips i{width:7px;height:12px;border-radius:2px;background:var(--line-2)}
.pips i.on{background:var(--ink)}
.flag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:800}
.flag.caution{color:var(--warn);background:var(--warn-soft)}
.flag.violation_alert{color:var(--alert);background:var(--alert-soft)}
.mode{padding:1px 8px;border-radius:8px;background:var(--soft)}
/* 잉크 악보선 타이머 (design/studies/2026-11-16-면접-턴-타이머.md) */
.tt{margin:12px 0 0}
.tt-line{position:relative;height:16px;margin:0 0 4px}
.tt-line::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.tt-line .ink{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--acc);transform-origin:0 50%}
.tt.run .ink{animation:deplete var(--dur,60s) linear forwards}
.tt.pause .ink{animation-play-state:paused}
.tt.low .tt-line{animation:breath 1.2s ease-in-out 6}
@keyframes deplete{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes breath{50%{opacity:.45}}
.tt-line .mk{position:absolute;top:0;width:2px;height:16px;background:var(--ink);opacity:.55}
.tt-seg{position:relative;display:flex;font-size:11.5px;font-weight:750;color:var(--dim);margin:0 0 6px}
.tt-seg span{flex:0 0 auto;padding-left:4px;border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-seg span.now{color:var(--acc)}
.tt-len{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 6px}
.tt-len span{font-size:12px;font-weight:750;color:var(--dim);margin-right:2px}
.tt-len button{min-height:44px;padding:0 10px;border-radius:11px;background:var(--soft);font-size:13px;font-weight:750;color:var(--muted)}
.tt-len button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt-row .n{font-size:26px;font-weight:850;letter-spacing:-.03em;min-width:3.2em}
.tt-row .n small{font-size:13px;font-weight:700;color:var(--dim);margin-left:2px}
.tt-row .sg{font-size:13.5px;font-weight:750;color:var(--acc)}
.tt-row .over{color:var(--warn)}
.tt-row button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:800}
.tt-row button.g{background:var(--soft);color:var(--ink)}
.tt-row .sp{flex:1}
/* 한 겹 */
.lay{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft);border-left:3px solid var(--c,var(--acc))}
.lay h3{margin:0 0 4px;font-size:12.5px;font-weight:850;color:var(--c,var(--acc))}
.lay p{margin:0;font-size:14.5px;line-height:1.7}
.lay p+p{margin-top:6px}
.lay.in{animation:open .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes open{from{opacity:0;transform:translateY(8px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.next{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:50px;margin-top:12px;padding:0 14px;border-radius:14px;border:1.5px dashed var(--line-2);font-size:15px;font-weight:750;color:var(--acc);text-align:left}
.next span{font-size:12.5px;font-weight:600;color:var(--dim)}
.law{margin:12px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--panel))}
.law h3{margin:0 0 4px;font-size:12.5px;font-weight:850;color:var(--c)}
.law p{margin:0;font-size:14px;line-height:1.65}
.law .can{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2)}
.law .nl{margin-top:6px;font-size:12px;color:var(--dim)}
/* 핸드 */
.hand{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:14px 0 0}
@media (min-width:640px){.hand{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1180px){.hand.h4{grid-template-columns:repeat(4,minmax(0,1fr))}.hand.h3{grid-template-columns:repeat(3,minmax(0,1fr))}}

.hand.deal>.slot-c{animation:rise .3s cubic-bezier(.2,.9,.3,1) both}
.hand.deal>.slot-c:nth-child(2){animation-delay:34ms}.hand.deal>.slot-c:nth-child(3){animation-delay:68ms}.hand.deal>.slot-c:nth-child(4){animation-delay:102ms}
.card{display:block;width:100%;text-align:left;transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.card .back{display:none}
.card.flip .front{display:none}
.card.flip .back{display:block;animation:turn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes turn{from{opacity:.3;transform:perspective(900px) rotateY(-80deg)}to{opacity:1;transform:none}}
.card:disabled{cursor:default}
.face{display:block;min-height:132px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--c);background:var(--panel);box-shadow:3px 3px 0 var(--edge)}
.face.back{background:color-mix(in srgb,var(--c) 5%,var(--panel))}
.card:disabled .face.front{opacity:.5}
@media (hover:hover){.card:not(:disabled):not(.flip):hover{transform:translateY(-5px)}}
.face .ty,.face h4,.face p,.face .rd,.face .ex{display:block}
.face .ty{display:flex}.face .ex{display:inline-flex}.face .rd{display:inline-block}
.card:not(:disabled):active .face.front{transform:scale(.975)}
.face .ty{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:12px;font-weight:850;color:var(--c)}
.face .ty b{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--c);color:var(--bg);font-size:12px}
.face h4{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.face .hint{margin:0;font-size:12.5px;color:var(--dim)}
.face.front .rd{display:inline-block;margin-top:6px;padding:1px 7px;border-radius:7px;font-size:11.5px;font-weight:800;background:var(--ink);color:var(--bg)}
.trap .face h4{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--ink) 55%,transparent)}
.face.back p{margin:0 0 6px;font-size:13.5px;line-height:1.6}
.face.back .why{color:var(--muted)}
.face.back .pc{font-size:12px;font-weight:750;color:var(--c)}
.slot{padding:0 3px;border-radius:5px;color:var(--slot);background:var(--slot-bg);border-bottom:1.5px dashed var(--slot);font-weight:700}
.ex{display:inline-flex;align-items:center;gap:5px;margin:0 0 4px;padding:1px 7px;border-radius:7px;font-size:11.5px;font-weight:800;color:var(--slot);background:var(--slot-bg);transform:rotate(-1.5deg)}
.win{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--acc-soft);font-size:13.5px;line-height:1.6}
.win b{color:var(--acc)}
/* 역질문·약점·변화 */
.solo{padding:14px}
.rq{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:900px){.rq{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rqc{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--edge)}
.rqc .av{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);font-size:13px;line-height:1.55}
.rqc .av b{color:var(--warn)}
.rqc h4{margin:0 0 6px;font-size:15.5px;line-height:1.55}
.rqc dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;line-height:1.55}
.rqc dt{font-weight:800;color:var(--acc)}
.rqc dd{margin:0;color:var(--muted)}
.wp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:640px){.wp{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wp button{min-height:48px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:750;text-align:left}
.wp button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.steps{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
@media (min-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{padding:12px 14px;border-radius:14px;background:var(--soft);border-top:3px solid var(--acc)}
.step h4{margin:0 0 4px;font-size:12.5px;font-weight:850;color:var(--acc)}
.step p{margin:0;font-size:14px;line-height:1.65}
.step.wait{opacity:.35}
.tr{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:900px){.tr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trc{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.trc h4{margin:0 0 4px;font-size:15px;line-height:1.45}
.trc p{margin:0 0 4px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.trc p.im{color:var(--ink)}
.cf{display:inline-flex;margin:0 0 6px;padding:1px 8px;border-radius:8px;font-size:11.5px;font-weight:800;background:var(--soft);color:var(--muted)}
.cf.single_source{background:var(--warn-soft);color:var(--warn)}
.src{margin:12px 0 0;padding:0 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--dim)}
.src a{color:var(--acc)}
.foot{margin:10px 0 0;font-size:12.5px;color:var(--dim);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html[data-jc-imm] .qcard.land,html[data-jc-imm] .hand.deal>.slot-c,html[data-jc-imm] .lay.in,html[data-jc-imm] .tt .ink,html[data-jc-imm] .tt.low .tt-line{animation:none!important}

<div class="wrap">
  <header class="hd">

    <a class="brand" href="./" id="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>면접 <span>전술 덱</span></a>

      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="pv-tt"><b>이용 안내</b>로그인 없이 사용 <span aria-hidden="true">·</span> <span style="white-space:nowrap">참고·실습용 자료</span></span>
      <span class="pv-c" id="pvL">펼치기</span>
    </button>
    <div class="pv-b" id="pvB" hidden><ul>
      <li><b>합격을 보장하지 않습니다.</b> 카드의 문장은 자료실이 만든 예시이고, [ ] 자리는 내 사실로 채워야 완성됩니다.</li>
      <li><b>법률 자문이 아닙니다.</b> 법적 신호는 질문을 읽는 기준이며, 회사를 평가하는 말이 아닙니다.</li>
      <li><b>타이머는 말하기 리듬을 보는 장치입니다.</b> 시간이 지나도 막지 않고, 넘긴 시간만 기록합니다.</li>
      <li><b>입력한 내용은 없고, 고른 것은 이 화면에서만 기억합니다.</b> 서버로 보내지 않습니다.</li>
    </ul></div>
