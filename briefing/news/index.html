<!DOCTYPE html>
<html lang="ko">
<head>
<script>
(function(){var m='auto';try{m=localStorage.getItem('jc-theme')||'auto';}catch(e){}
var h=new Date().getHours(),t=(m==='light'||m==='dark')?m:(h>=7&&h<19?'light':'dark');
document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta charset="UTF-8">
<script src="../../assets/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef" id="metaTheme">
<meta name="description" content="원문 재게시와 AI 번역이 허용된 공공·공개 자료만 모은 고용·AI 원문 피드. 원문과 한국어 번역을 화면 안에서 나란히 읽습니다.">
<title>오늘의 원문 · 오늘의 브리핑</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf6ef;--panel:#fffdf8;--soft:#f5efe4;--line:#e9e0d2;--line-2:#d8ccb9;
  --ink:#2a2521;--muted:#655c53;--dim:#6e645b;
  --acc:#a33a1f;--acc-soft:rgba(163,58,31,.08);
  --ta:#1f5f8b;--ta-soft:rgba(31,95,139,.10);
  --warn:#8f5f00;--warn-soft:rgba(143,95,0,.10);
  --shadow:0 1px 2px rgba(70,50,25,.05),0 10px 28px -18px rgba(70,50,25,.30);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08090c;--panel:#10141d;--soft:#141a26;--line:#1e232f;--line-2:#2c3445;
  --ink:#e6e9ef;--muted:#9aa2b4;--dim:#7c859a;
  --acc:#f08a6b;--acc-soft:rgba(240,138,107,.10);
  --ta:#7cc4f0;--ta-soft:rgba(124,196,240,.12);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.10);
  --shadow:none;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;max-width:100%}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
body{font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body.rd-open{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
select{font-family:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
@media (min-width:900px){.wrap{max-width:1180px;padding:0 32px 72px}}
.hd{display:flex;align-items:center;gap:8px;padding:12px 0}
.ib{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.ib svg{width:20px;height:20px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap;min-height:44px}
.brand svg{width:26px;height:26px;flex:none}
.brand span{color:var(--acc)}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:750;color:var(--acc);text-decoration:none}

.notice{margin:0 0 10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);font-size:13.5px;color:var(--muted)}
.notice b{color:var(--ink)}
.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:6px 0 8px;border-bottom:2px solid var(--ink)}
.mast .mt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.mast select{min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:13.5px;font-weight:700}
.mast h1{margin:0;font-size:26px;font-weight:850;letter-spacing:-.05em}
@media (min-width:900px){.mast h1{font-size:34px}}
.mast span{font-size:13.5px;font-weight:700;color:var(--muted)}
.status{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);font-size:14px}
.status b{color:var(--warn)}

/* 키워드 띠: 활자 색인 */
.kw{display:flex;flex-wrap:wrap;gap:0;margin:10px 0 0;padding:4px 0;border-bottom:1px solid var(--line-2)}
.kw button{min-height:44px;padding:6px 12px;font-size:15px;font-weight:750;letter-spacing:-.02em;border-right:1px solid var(--line)}
.kw button:last-child{border-right:0}
.kw button sup{font-size:11px;color:var(--dim);margin-left:2px;font-variant-numeric:tabular-nums}
.kw button[aria-pressed="true"]{color:var(--acc);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}

.sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.sh h2{margin:0;font-size:19px;font-weight:850;letter-spacing:-.04em}
.sh small{font-size:13px;color:var(--dim)}

/* 배지·스탬프 */
.bd{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:3px 9px;line-height:1.45;border-radius:6px;white-space:nowrap;background:var(--ta-soft);color:var(--ta)}
.stamp{display:inline-block;font-size:11px;font-weight:850;letter-spacing:.02em;padding:3px 8px;line-height:1.45;border:1.5px solid currentColor;border-radius:4px;color:var(--acc);transform:rotate(-2deg)}
.bd.ed{background:none;border:1px solid currentColor;padding:3px 8px}.bd.ed.kr{color:var(--acc)}.bd.ed.gl{color:var(--ta)}
.why a{display:inline-flex;align-items:center;min-height:44px;font-weight:750;color:var(--acc)}
.ai{font-size:11.5px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:6px;white-space:nowrap}

/* 머리기사 */
.heads{display:grid;gap:14px}
@media (min-width:900px){.heads{grid-template-columns:1fr 1fr;gap:20px}}
.head{display:flex;flex-direction:column;gap:8px;width:100%;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)}
.head h3{margin:0;font-size:19px;line-height:1.45;font-weight:850;letter-spacing:-.035em}
.head .orig{font-size:13px;color:var(--muted)}
.jobs{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted)}
.jobs span::before{content:"#"}

/* 좁히기 */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbtn,.chip{min-height:44px;padding:8px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.flt fieldset{border:0;margin:0 0 10px;padding:0;min-width:0}
.flt legend{font-size:13.5px;font-weight:800;padding:0;margin-bottom:6px}
.flt .chips{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:899px){
  .flt{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:72vh;max-height:72dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;box-shadow:0 -12px 32px -18px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);visibility:hidden}
  .flt.open{transform:none;visibility:visible}
  .flt .done{display:flex;width:100%;justify-content:center;margin-top:6px}
}
@media (min-width:900px){.fbtn{display:none}.flt{margin-top:8px}.flt .done{display:none}.flt{display:grid;grid-template-columns:1fr 1fr;gap:16px}}

/* 피드 */
.feed{list-style:none;margin:0;padding:0}
.feed li{border-bottom:1px solid var(--line)}
.feed button{display:grid;grid-template-columns:1fr;gap:2px;width:100%;min-height:56px;padding:10px 2px;text-align:left}
.feed .t{font-size:15.5px;font-weight:750;line-height:1.45;letter-spacing:-.02em}
.feed .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--dim)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pbtn{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:750}
.pbtn[disabled]{opacity:.4;cursor:default}
.empty{padding:16px;border-radius:14px;background:var(--soft);font-size:14.5px;color:var(--muted)}
.empty b{color:var(--ink)}

.lic{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media (min-width:900px){.lic{grid-template-columns:1fr 1fr;column-gap:20px}}
.lic li{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.lic li small{display:block;color:var(--dim);font-size:12.5px}
.lic a,.td a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;color:var(--muted);font-weight:700;text-underline-offset:3px;vertical-align:middle}
.why,.td{font-size:13.5px;color:var(--muted);line-height:1.7}

/* 리더: 전체 화면 */
.reader{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(12px);transition:opacity .22s,transform .26s cubic-bezier(.2,.9,.3,1);pointer-events:none;visibility:hidden}
.reader.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.rd-in{max-width:880px;margin:0 auto;padding:0 16px 120px}
@media (min-width:900px){.rd-in{max-width:1180px;padding:0 32px 120px}}
.rd-top{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.rd-top .sp{flex:1}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.modes button{min-height:44px;padding:8px 14px;font-size:14px;font-weight:750;color:var(--muted)}
.modes button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.rd-h{margin:18px 0 6px;font-size:24px;line-height:1.4;font-weight:850;letter-spacing:-.04em}
@media (min-width:900px){.rd-h{font-size:30px}}
.rd-sub{margin:0 0 10px;font-size:14px;color:var(--muted)}
.rd-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)}
.rd-body{margin-top:18px;max-width:40em;font-size:17px;line-height:1.85}
.rd-body p{margin:0 0 1em}
.rd-body.pair{max-width:none;display:grid;gap:0}
.pair-row{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line-2)}
@media (min-width:900px){.pair-row{grid-template-columns:1fr 1fr;gap:28px}}
.pair-row p{margin:0}
.pair-row .o{color:var(--muted);font-size:15.5px}
.rd-foot{position:sticky;bottom:0;margin-top:24px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line-2);border-radius:14px 14px 0 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.rd-foot a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;font-weight:750;color:var(--ink)}
.rd-link{display:inline-flex;align-items:center;min-height:44px;font-weight:750;color:var(--acc)}
.loading{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.reader,.flt{transition:none!important}}
html[data-jc-imm] .reader,html[data-jc-imm] .flt{transition:none!important}
</style>
