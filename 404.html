<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="/assets/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
<meta name="theme-color" content="#faf6ef">
<title>찾는 지면이 없습니다 · Walk into Work</title>
<!-- 없는 주소로 들어왔을 때 Cloudflare Pages가 404 상태로 보여 주는 화면(2026-11-23 공개 전 점검).
     이 파일이 없으면 Pages가 대문(index.html)을 그 주소 그대로 내보내, 상대 경로(./assets/…)가 깨진 채 대문이 떴다.
     어느 깊이의 주소에서 떠도 되도록 모든 경로를 뿌리(/) 기준으로 적는다. -->
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/assets/core.css">
<style>
:root{--bg:#faf6ef;--panel:#fffdf8;--ink:#1b1611;--muted:#5d554d;--line:#e3d9ca;--acc:#1e6b5c}
:root[data-theme="dark"]{--bg:#0f1420;--panel:#151b28;--ink:#f3efe8;--muted:#a9b0bb;--line:#2a3242;--acc:#7fc3b2}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
main{max-width:460px;width:100%;text-align:center}
.mk{width:64px;height:64px;margin:0 auto 18px;display:block}
.mk path{fill:none;stroke:var(--ink);stroke-width:9}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 8px}
p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.6;word-break:keep-all}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--acc);color:var(--acc);font-weight:700;text-decoration:none}
.go:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.hd{position:fixed;top:12px;right:12px}
</style>
</head>
<body>
<span class="hd"><span data-jc-prefs></span></span>
<main>
  <svg class="mk" viewBox="0 0 274 274" aria-hidden="true"><path d="M137 3.5L270.5 137L137 270.5L3.5 137Z"/><path d="M137 51.5L222.5 137L137 222.5L51.5 137Z"/></svg>
  <h1>찾는 지면이 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력되었습니다. 대문에서 자료를 다시 찾아 주세요.</p>
  <a class="go" href="/">자료실 대문으로</a>
</main>
<script src="/assets/prefs.js" defer></script>
</body>
</html>
