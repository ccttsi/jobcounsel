<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 사이트 공통 테마: 첫 화면 설정(jc-theme)을 따른다. 자동이면 오전 7시~오후 7시는 밝게, 그 밖에는 어둡게. */
(function(){var m='auto';try{m=localStorage.getItem('jc-theme')||'auto';}catch(e){}
var h=new Date().getHours(),t=(m==='light'||m==='dark')?m:(h>=7&&h<19?'light':'dark');
document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef" id="metaTheme">
<meta name="description" content="학과 501개와 직업 552개를 접는 선 하나로 마주 놓고, 연결 근거와 함께 오가며 살펴보는 직업상담 참고·실습 도구">
<title>커리어데칼코마니 · 학과와 직업의 거울 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 색: 사이트 첫 화면과 같은 팔레트 ── */
:root{
  --bg:#faf6ef;--panel:#fffdf8;--soft:#f5efe4;--line:#e9e0d2;--line-2:#d8ccb9;
  --ink:#2a2521;--muted:#655c53;--dim:#7b7168;
  --dept:#0f766e;--dept-soft:rgba(15,118,110,.09);
  --job:#b4532a;--job-soft:rgba(180,83,42,.09);
  --stamp:#be123c;
  --glass:rgba(255,253,248,.6);
  --shadow:0 1px 2px rgba(70,50,25,.05),0 10px 28px -18px rgba(70,50,25,.22);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  /* 크기: 8의 배수 간격, 글자 13·17·21·27(1.25배) */
  --fs-s:13px;--fs-b:17px;--fs-m:21px;--fs-l:27px;
  --fold:24px;--peek:clamp(72px,12.7%,96px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08090c;--panel:#10141d;--soft:#111623;--line:#1e232f;--line-2:#2c3445;
  --ink:#e6e9ef;--muted:#9aa2b4;--dim:#7c859a;
  --dept:#2dd4bf;--dept-soft:rgba(45,212,191,.09);
  --job:#fbbf24;--job-soft:rgba(251,191,36,.09);
  --stamp:#fb7185;
  --glass:rgba(16,20,29,.6);
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-b);line-height:1.6;-webkit-text-size-adjust:100%;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ── 머리말: 한 줄 + 접히는 안내 한 줄 ── */
.hd{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:10}
.bar{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px}
.ib{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.ib svg{width:20px;height:20px}
.brand{display:none;font-weight:800;font-size:var(--fs-b);letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--stamp)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--dept)}
.theme{font-size:var(--fs-s);font-weight:650;width:auto;padding:0 10px}
.note{margin:0;max-height:48px;overflow:hidden;padding:0 16px 8px;font-size:var(--fs-s);line-height:1.5;color:var(--muted);transition:max-height .3s,padding .3s}
.note b{color:var(--ink);font-weight:700}
.app.scrolled .note{max-height:0;padding-bottom:0}
#results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch;z-index:30}
#results[hidden]{display:none}
.res{display:block;width:100%;text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res b{font-size:16px}
.res .ty{font-size:12px;font-weight:700;margin-left:8px;padding:0 6px;border-radius:6px;vertical-align:1px}
.ty.d{background:var(--dept-soft);color:var(--dept)}.ty.j{background:var(--job-soft);color:var(--job)}.ty.e{border:1px dashed var(--dim);color:var(--muted)}
.res .pth{display:block;font-size:var(--fs-s);color:var(--muted)}
.res-empty{padding:16px;font-size:14px;color:var(--muted)}

/* ── 무대: 학과트리 / 접는 선 / 직업트리 ── */
.stage{flex:1 1 0;min-height:0;display:flex;flex-direction:column;position:relative;padding-bottom:env(safe-area-inset-bottom)}
.pane{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pane.top{flex:0 0 calc(100% - var(--fold) - var(--peek));transition:flex-basis .4s cubic-bezier(.2,.8,.2,1)}
.pane.bottom{flex:1 1 0}
.stage.flip .pane.top{flex-basis:var(--peek)}
.content{flex:1;min-height:0;display:flex;flex-direction:column;transition:filter .4s,opacity .4s}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px}
.wrap{max-width:640px}
.stage:not(.flip) #paneJob .content,.stage.flip #paneDept .content{filter:blur(3px);opacity:.5;pointer-events:none}
.peek{display:none;position:absolute;inset:0;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:8px 16px;flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.stage:not(.flip) #peekJob,.stage.flip #peekDept{display:flex}
.plabel{font-size:var(--fs-s);font-weight:700;display:flex;align-items:center;gap:6px}
#peekJob .plabel{color:var(--job)}#peekDept .plabel{color:var(--dept)}
.plabel span{font-weight:500;color:var(--muted)}
.prow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-right:72px}
.prow::-webkit-scrollbar{display:none}
.pchip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line-2);background:var(--panel);font-size:15px;white-space:nowrap}

/* 접는 선: 보이는 두께 24px, 누르는 영역 44px */
.fold{flex:0 0 var(--fold);position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .4s}
.fold::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1px dashed var(--line-2)}
.fold::after{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.stage.moving .fold{box-shadow:0 0 16px rgba(0,0,0,.18)}
.handle{position:relative;z-index:1;width:40px;height:4px;border-radius:4px;background:var(--line-2)}
.stamp{position:relative;z-index:1;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-s);font-weight:800;line-height:18px;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 8px;background:var(--panel);transform:rotate(-3deg)}
.stamp.r{transform:rotate(3deg)}
.stamp.off{color:var(--dim);border-color:var(--line-2);font-weight:600}
.stamp.press{animation:press .4s ease-out}
.stamp.r.press{animation-name:pressR}
@keyframes press{0%{transform:scale(1.35);opacity:0}60%{transform:scale(.95) rotate(-3deg);opacity:1}}
@keyframes pressR{0%{transform:scale(1.35);opacity:0}60%{transform:scale(.95) rotate(3deg);opacity:1}}

/* 경로 칩: 두 경로가 접는 선에서 만난다 */
.crumbs{flex:0 0 auto;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;background:var(--bg);white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
#paneDept .crumbs{order:2;border-top:1px solid var(--line)}
#paneJob .crumbs{border-bottom:1px solid var(--line)}
.crumb{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.crumb.root{border:0;background:none;padding:0 4px;font-weight:800}
#paneDept .crumb.root{color:var(--dept)}#paneJob .crumb.root{color:var(--job)}
.crumb.cur{font-weight:700;border-color:var(--line-2)}
.sep{color:var(--dim);font-size:12px}

/* 목록 */
.up{font-size:15px;color:var(--muted);height:32px;margin-bottom:8px}
.lvl{font-size:var(--fs-s);color:var(--muted);margin:0 0 8px}
.item{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 16px;margin-bottom:8px;box-shadow:var(--shadow)}
.item .nm{flex:1;min-width:0;font-weight:700}
.item .ct{font-size:var(--fs-s);color:var(--muted);text-align:right;flex:none}
.item .ch{color:var(--dim);font-size:var(--fs-m);line-height:1;flex:none}
#paneJob .item .ch{order:-1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--line-2)}
#paneJob .item.lk .dot{background:var(--dept);border-color:var(--dept)}
#paneDept .item.lk .dot{background:var(--job);border-color:var(--job)}
.badge{display:inline-block;font-size:12px;font-weight:700;line-height:20px;padding:0 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.b-lic{background:var(--stamp);color:#fff}
.b-soft{background:var(--soft);color:var(--muted);font-weight:600}

/* 상세 */
.dt h2{margin:0;font-size:var(--fs-l);line-height:1.3;letter-spacing:-.02em}
.dpath{font-size:var(--fs-s);color:var(--muted);margin:4px 0 16px}
.lead{margin:0 0 16px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.sec h3{margin:0 0 8px;font-size:var(--fs-b);line-height:1.4}
.sec h3 small{font-weight:500;font-size:var(--fs-s);color:var(--muted);margin-left:6px}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:4px 0}
.sec p{margin:0 0 8px}.sec p:last-child{margin-bottom:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tg{font-size:15px;line-height:1.5;padding:2px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.course{border-top:1px dashed var(--line);padding:4px 0}
.course:first-of-type{border-top:0}
.course summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:600}
.course p{font-size:15px;color:var(--muted);margin:0 0 8px}
.uni{display:block;padding:8px 24px 8px 0;border-top:1px dashed var(--line);color:inherit;text-decoration:none;position:relative}
.uni::after{content:'›';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:20px}
.uni:hover b{color:var(--dept)}
.sec .names a{text-decoration:none;color:inherit;display:block}
.uni:first-child{border-top:0}
.uni .m{display:block;font-size:var(--fs-s);color:var(--muted)}
.uni.closed{opacity:.6}
.filt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px;padding-bottom:2px}
.filt::-webkit-scrollbar{display:none}
.fb{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--soft);font-size:14px}
.fb[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pg{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:12px}
.pg button{min-width:36px;height:40px;padding:0 6px;border-radius:12px;border:1px solid transparent;background:none;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pg button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pg button:disabled{opacity:.35}
.pg .gap{min-width:16px;text-align:center;color:var(--dim)}
.pg-info{text-align:center;font-size:var(--fs-s);color:var(--dim);margin-top:2px}
.sec h3 .go{float:right;margin-left:8px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--dept);color:var(--dept);background:var(--dept-soft);font-size:14px;font-weight:700}
.tmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:400px;margin:4px auto 8px}
.tile{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:15px;font-weight:700;line-height:1.25;
  background:color-mix(in srgb,var(--dept) var(--h,0%),var(--panel));color:var(--ink);transition:transform .15s}
.tile small{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.hot{color:#fff}.tile.hot small{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .tile.hot{color:#05201d}:root[data-theme="dark"] .tile.hot small{color:rgba(5,32,29,.8)}
.tile:disabled{opacity:.4}
.tile[aria-pressed="true"]{outline:3px solid var(--stamp);outline-offset:2px}
.tile:active{transform:scale(.95)}
.mode{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.sec ul.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0 0;padding:0;list-style:none}
.sec .names li{margin:0;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:15px;font-weight:600;line-height:1.4}
.names li small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.more{width:100%;height:44px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:15px;font-weight:600}
.link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px}
.link .nm{flex:1;min-width:0;font-weight:700}
.link .meta{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lk-j .dot{background:var(--job);border-color:var(--job)}.lk-d .dot{background:var(--dept);border-color:var(--dept)}
.rel{flex:none;font-size:12px;font-weight:700;line-height:22px;padding:0 8px;border-radius:6px;white-space:nowrap}
.r-면허필수{background:var(--stamp);color:#fff}
.r-전공우대{background:color-mix(in srgb,var(--stamp) 14%,transparent);color:var(--stamp)}
.r-관련전공{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.r-전공무관{border:1px dashed var(--dim);color:var(--muted)}
.legend{font-size:var(--fs-s);color:var(--muted);margin-top:8px}
.legend summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.legend dl{margin:4px 0 0}.legend dt{font-weight:700;color:var(--ink)}.legend dd{margin:0 0 8px}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 8px;align-items:center;font-size:15px}
.br .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.br .tr i{display:block;height:100%;border-radius:4px;background:var(--dept)}
.jside .br .tr i{background:var(--job)}
.br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:12px;padding:8px 12px}
.kv b{display:block;font-size:var(--fs-m);line-height:1.3;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.warn{font-size:var(--fs-s);color:var(--muted);border-left:3px solid var(--line-2);padding-left:8px;margin-top:8px}
.src{font-size:12px;color:var(--muted);margin:0 0 8px}
.src a{color:var(--dept)}
.foot{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:16px;padding-top:8px}
.state{padding:24px 16px;color:var(--muted);font-size:15px}

/* ── 넓은 화면(960px 이상): 좌우 1:1 데칼코마니 ── */
.wide-only{display:none}
@media (min-width:600px){.brand{display:block}.wide-only{display:inline}}
@media (min-width:960px){
  .app{max-width:1440px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .stage{flex-direction:row}
  .pane.top,.stage.flip .pane.top,.pane.bottom{flex:1 1 0}
  .content{filter:none!important;opacity:1!important;pointer-events:auto!important}
  .peek{display:none!important}
  .fold{flex:0 0 64px;flex-direction:column;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);cursor:default}
  .fold::before{left:50%;right:auto;top:8px;bottom:8px;border-top:0;border-left:1px dashed var(--line-2)}
  .fold::after,.handle{display:none}
  .stamp{max-width:none;max-height:42%;writing-mode:vertical-rl;padding:8px 0}
  #paneDept .crumbs{order:0;border-top:0;border-bottom:1px solid var(--line)}
  .scroll{padding:24px}
  #paneDept .wrap{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hd">
    <div class="bar">
      <a class="ib" href="../" aria-label="자료실 첫 화면으로" title="자료실 첫 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg></a>
      <span class="brand">커리어<em>데칼코마니</em></span>
      <div class="search">
        <input id="q" type="search" placeholder="학과·대학 학과명·직업 검색" autocomplete="off" enterkeyhint="search" aria-label="학과·대학 학과명·직업 검색" disabled>
        <div id="results" hidden></div>
      </div>
      <button class="ib theme" id="themeBtn" type="button" title="자동은 오전 7시~오후 7시 밝게, 그 밖에는 어둡게">자동</button>
    </div>
    <p class="note" id="note"><b>커리어데칼코마니</b> · 이 자료는 정답이 아닌 참고·실습용 도구입니다.<span class="wide-only"> 연결은 가능성을 보여 줄 뿐 진로를 정해 주지 않습니다.</span></p>
  </header>
  <main class="stage" id="stage">
    <section class="pane top" id="paneDept" aria-label="학과트리">
      <div class="content" id="deptContent"><div class="state">자료를 불러오는 중입니다…</div></div>
      <div class="peek" id="peekDept" role="button" tabindex="0" aria-label="학과트리 펼치기"></div>
    </section>
    <div class="fold" id="fold" role="button" tabindex="0" aria-label="학과트리와 직업트리 뒤집기">
      <span class="stamp off" id="stampD">학과</span><span class="handle" aria-hidden="true"></span><span class="stamp r off" id="stampJ">직업</span>
    </div>
    <section class="pane bottom" id="paneJob" aria-label="직업트리">
      <div class="content" id="jobContent"><div class="state">자료를 불러오는 중입니다…</div></div>
      <div class="peek" id="peekJob" role="button" tabindex="0" aria-label="직업트리 펼치기"></div>
    </section>
  </main>
</div>
<script>
(function(){
'use strict';

var M,J,E,majors={},jobs={},univ={},rowsBy={},estByMinor={},eFrom={},eTo={},jgFrom={},jgTo={},jgName={},cols,DEPT=[],JOB=[],INDEX=[];

/* 시도 이름을 17개 짧은 이름으로 맞춘다(공시 연도마다 표기가 다르다) */
var REGS=['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
var REG_FULL={서울:'서울특별시',부산:'부산광역시',대구:'대구광역시',인천:'인천광역시',광주:'광주광역시',대전:'대전광역시',울산:'울산광역시',세종:'세종특별자치시',경기:'경기도',강원:'강원특별자치도',충북:'충청북도',충남:'충청남도',전북:'전북특별자치도',전남:'전라남도',경북:'경상북도',경남:'경상남도',제주:'제주특별자치도'};
function normReg(r){r=String(r||'');if(REGS.indexOf(r)>=0)return r;
  if(/전남광주/.test(r))return '전남';
  var M2={'충청북':'충북','충청남':'충남','전라북':'전북','전북특':'전북','전라남':'전남','경상북':'경북','경상남':'경남','강원':'강원','제주':'제주','경기':'경기','세종':'세종'};
  for(var k in M2)if(r.indexOf(k)===0)return M2[k];
  for(var i=0;i<REGS.length;i++)if(r.indexOf(REGS[i])===0)return REGS[i];
  return r;}
/* 쪽 나누기: 1 2 3 … 형식 */
function pager(key,total,size){
  var n=Math.ceil(total/size);if(n<=1)return '';var c=Math.min(st.pg[key]||0,n-1),b=[];
  var want={0:1};want[n-1]=1;for(var i=c-1;i<=c+1;i++)if(i>=0&&i<n)want[i]=1;
  if(c<=2)for(i=0;i<Math.min(n,4);i++)want[i]=1;if(c>=n-3)for(i=Math.max(0,n-4);i<n;i++)want[i]=1;
  var last=-1;Object.keys(want).map(Number).sort(function(a,b){return a-b;}).forEach(function(i){if(last>=0&&i-last>1)b.push('<span class="gap">…</span>');b.push('<button data-pg="'+key+'" data-v="'+i+'" aria-current="'+(i===c)+'" aria-label="'+(i+1)+'쪽">'+(i+1)+'</button>');last=i;});
  return '<nav class="pg" aria-label="쪽 넘기기" data-pgbox="'+key+'"><button data-pg="'+key+'" data-v="'+(c-1)+'" aria-label="이전 쪽"'+(c===0?' disabled':'')+'>‹</button>'+b.join('')+'<button data-pg="'+key+'" data-v="'+(c+1)+'" aria-label="다음 쪽"'+(c===n-1?' disabled':'')+'>›</button></nav>'+
    '<p class="pg-info">'+num(c*size+1)+'–'+num(Math.min(total,(c+1)*size))+' / '+num(total)+'</p>';
}
function page(key,arr,size){var n=Math.max(1,Math.ceil(arr.length/size)),c=Math.min(st.pg[key]||0,n-1);st.pg[key]=c;return arr.slice(c*size,(c+1)*size);}
function load(u){return fetch(u,{cache:'force-cache'}).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
Promise.all([load('./data/majors.json'),load('./data/jobs.json'),load('./data/edges.json')]).then(function(a){
  M=a[0];J=a[1];E=a[2];build();$('q').disabled=false;openHash()||render();
}).catch(function(){
  $('deptContent').innerHTML=$('jobContent').innerHTML='<div class="state">자료를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로 고침해 주세요.</div>';
});

function build(){
  cols=M.department_columns;
  (M.universities||[]).forEach(function(u){u.reg=normReg(u.region);univ[u.id]=u;});
  M.majors.forEach(function(m){majors[m.id]=m;rowsBy[m.id]=[];});
  J.jobs.forEach(function(j){jobs[j.id]=j;});
  (J.classifications.job_class_group||[]).forEach(function(g){jgName[g.id]=g.name;});
  var ci={};cols.forEach(function(c,i){ci[c]=i;});
  var rows=M.departments.map(function(r){var o={};for(var k in ci)o[k]=r[ci[k]];return o;});
  /* 표준학과 미연결 학과는 같은 소계열에서 가장 흔한 표준학과로 추정한다 */
  var minorCnt={};
  rows.forEach(function(r){
    if(r.major_id&&rowsBy[r.major_id])rowsBy[r.major_id].push(r);
    if(r.major_id&&r.standard_class_minor&&r.standard_class_minor.indexOf('N.C.E')<0){var k=r.standard_class_major+'|'+r.standard_class_minor;(minorCnt[k]=minorCnt[k]||{})[r.major_id]=(minorCnt[k][r.major_id]||0)+1;}
  });
  for(var k in minorCnt){var best=null,bn=0;for(var id in minorCnt[k])if(minorCnt[k][id]>bn){bn=minorCnt[k][id];best=id;}estByMinor[k]=best;}
  E.edges.forEach(function(e){
    if(e.to.indexOf('JG-')===0){(jgFrom[e.from]=jgFrom[e.from]||[]).push(e);(jgTo[e.to]=jgTo[e.to]||[]).push(e);}
    else{(eFrom[e.from]=eFrom[e.from]||[]).push(e);(eTo[e.to]=eTo[e.to]||[]).push(e);}
  });
  /* 학과트리: 커리어넷 7계열 > 중분류(개설 학과들의 대학알리미 중계열 중 가장 많은 것) > 표준학과 */
  var cats={};
  (M.classifications.major_category||[]).forEach(function(c,i){cats[c.name]={id:'C'+i,name:c.name,kids:[],mid:{}};DEPT.push(cats[c.name]);});
  M.majors.forEach(function(m){
    var cat=cats[m.category];if(!cat){cat=cats[m.category]={id:'C'+DEPT.length,name:m.category||'계열 미지정',kids:[],mid:{}};DEPT.push(cat);}
    var cnt={},best='그 밖의 학과',bn=0;
    rowsBy[m.id].forEach(function(r){var md=r.standard_class_middle;if(r.source==='academyinfo'&&md&&md.indexOf('N.C.E')<0)cnt[md]=(cnt[md]||0)+1;});
    for(var x in cnt)if(cnt[x]>bn){bn=cnt[x];best=dot(x);}
    var mid=cat.mid[best];if(!mid){mid=cat.mid[best]={id:cat.id+'-M'+cat.kids.length,name:best,kids:[]};cat.kids.push(mid);}
    mid.kids.push(m.id);
  });
  DEPT.forEach(function(c){
    c.kids.forEach(function(md){md.kids.sort(function(a,b){return majors[a].name.localeCompare(majors[b].name,'ko');});md.kids.forEach(function(id){deptLoc[id]=[c.id,md.id];});});
    c.kids.sort(function(a,b){return a.name==='그 밖의 학과'?1:b.name==='그 밖의 학과'?-1:b.kids.length-a.kids.length;});
  });
  /* 직업트리: 한국고용직업분류 2025 대분류 > 중분류 > 직업 */
  var keco=J.classifications.keco_2025||[],ki={};
  keco.forEach(function(g){var node={id:'K'+g.code,name:g.name,kids:[],mid:{}};(g.middle||[]).forEach(function(m){var mn={id:'K'+m.code,name:m.name,kids:[]};node.mid[m.code]=mn;node.kids.push(mn);});ki[g.code]=node;JOB.push(node);});
  var none={id:'Kx',name:'고용직업분류 코드가 없는 직업',kids:[{id:'Kx0',name:'분류 코드 없음',kids:[]}],mid:{}};
  J.jobs.forEach(function(j){var k=j.keco||{},g=ki[k.class_code],m=g&&g.mid[k.middle_code];(m||none.kids[0]).kids.push(j.id);});
  JOB.push(none);
  JOB=JOB.filter(function(g){g.kids=g.kids.filter(function(m){m.kids.sort(function(a,b){return jobs[a].name.localeCompare(jobs[b].name,'ko');});return m.kids.length;});return g.kids.length;});
  JOB.forEach(function(g){g.kids.forEach(function(m){m.kids.forEach(function(id){jobLoc[id]=[g.id,m.id];});});});
  buildIndex(rows);
}
function linksOfMajor(id){return (eFrom[id]||[]).slice().sort(function(a,b){return (REL_ORDER[a.relation]-REL_ORDER[b.relation])||jobs[a.to].name.localeCompare(jobs[b.to].name,'ko');});}
function linksOfJob(id){return (eTo[id]||[]).slice().sort(function(a,b){return (REL_ORDER[a.relation]-REL_ORDER[b.relation])||majors[a.from].name.localeCompare(majors[b.from].name,'ko');});}
function findNode(tree,id){for(var i=0;i<tree.length;i++){if(tree[i].id===id)return tree[i];for(var k=0;k<tree[i].kids.length;k++)if(tree[i].kids[k].id===id)return tree[i].kids[k];}return null;}

var st={flip:false,dp:[],jp:[],uf:{region:'',closed:false},pg:{},map:null};
var stage=$('stage'),wide=window.matchMedia('(min-width:960px)');
function setFlip(f){

/* ───────── 그리기 ───────── */
function crumbs(k,tree,path,leaves,rootName){
  var h='<button class="crumb root" data-'+k+'-go="0">'+rootName+'</button>';
  path.forEach(function(id,i){var n=i===2?leaves[id].name:findNode(tree,id).name;h+='<span class="sep">›</span><button class="crumb'+(i===path.length-1?' cur':'')+'" data-'+k+'-go="'+(i+1)+'">'+esc(n)+'</button>';});
  return '<nav class="crumbs" aria-label="'+rootName+' 경로">'+h+'</nav>';
}
function list(k,tree,path,linked){
  var names=k==='d'?['계열','중분류','표준학과']:['직업 대분류','직업 중분류','직업'];
  var items=path.length?findNode(tree,path[path.length-1]).kids:tree,lv=path.length,h='';
  if(lv)h+='<button class="up" data-'+k+'-go="'+(lv-1)+'">‹ 위로</button>';
  var note=k==='d'?(lv===1?' · 중분류는 개설 학과들의 대학알리미 표준분류(중계열) 중 가장 많은 것입니다':lv===0?' · 커리어넷 7계열':''):(lv===0?' · 한국고용직업분류 2025':'');
  h+='<p class="lvl">'+names[lv]+' '+items.length+'개'+note+'</p>';
  items.forEach(function(it){
    var leaf=typeof it==='string',id=leaf?it:it.id,nm,ct,lk=false,extra='';
    if(leaf){
      if(k==='d'){var m=majors[id];nm=m.name;ct=(m.school_type||'').replace(/\(.*\)/,'')+' · 개설 '+num(m.department_count_open!=null?m.department_count_open:m.department_count||0)+'곳';}
      else{var j=jobs[id];nm=j.name;ct='';if(j.license_required)extra='<span class="badge b-lic">면허</span>';}
      lk=!!linked[id];
    }else{
      nm=it.name;var n=0;it.kids.forEach(function(c){n+=typeof c==='string'?1:c.kids.length;if(typeof c==='string'){if(linked[c])lk=true;}else c.kids.forEach(function(x){if(linked[x])lk=true;});});
      ct=(lv===0?names[1]+' '+it.kids.length+' · ':'')+(k==='d'?'학과 ':'직업 ')+n;
    }
    h+='<button class="item'+(lk?' lk':'')+'" data-'+k+'-open="'+esc(id)+'"><span class="dot"></span><span class="nm">'+esc(nm)+extra+'</span><span class="ct">'+esc(ct)+'</span><span class="ch">'+(k==='d'?'›':'‹')+'</span></button>';
  });
  return h;
}
function relBtn(e,to){
  var t=to==='j'?jobs[e.to]:majors[e.from];
  var meta=[e.note,e.source,e.year].filter(Boolean).join(' · ');
  return '<button class="link lk-'+to+'" data-'+to+'-jump="'+esc(to==='j'?e.to:e.from)+'"><span class="dot"></span><span class="nm">'+esc(t.name)+'<span class="meta">'+esc(meta)+'</span></span><span class="rel r-'+esc(e.relation)+'">'+esc(e.relation)+'</span></button>';
}
function legend(){
  var defs=E.relation_definitions||{},h='';['면허필수','전공우대','관련전공','전공무관','진출통계'].forEach(function(k){if(defs[k])h+='<dt>'+k+'</dt><dd>'+esc(defs[k])+'</dd>';});
  return '<details class="legend"><summary>연결 종류는 무엇을 뜻하나요?</summary><dl>'+h+'</dl><p>연결은 가능성과 근거를 보여 줄 뿐, 이 학과를 나오면 이 직업을 갖는다는 뜻이 아닙니다.</p></details>';
}
function bars(arr,lab,val,max){
  if(!arr||!arr.length)return '';max=max||Math.max.apply(null,arr.map(function(x){return +x[val]||0;}))||1;
  return '<div class="bars">'+arr.map(function(x){var v=+x[val]||0;return '<div class="br"><span>'+esc(x[lab])+'</span><span class="v">'+v+'%</span><span class="tr"><i style="width:'+Math.max(2,Math.round(v/max*100))+'%"></i></span></div>';}).join('')+'</div>';
}
function sec(title,body,small){return body?'<div class="sec"><h3>'+title+(small?'<small>'+small+'</small>':'')+'</h3>'+body+'</div>':'';}
function ul(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'';}
function tags(a){return a&&a.length?'<div class="tags">'+a.map(function(x){return '<span class="tg">'+esc(x)+'</span>';}).join('')+'</div>':'';}

  if(s.first_job_salary_pct&&s.first_job_salary_pct.length)stat+='<p style="margin:16px 0 8px;font-weight:700">첫 직장 월평균 임금</p>'+bars(s.first_job_salary_pct,'range','pct');

function cho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);o+=(c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:s[i];}return o;}
function norm(s){return String(s).toLowerCase().replace(/[\s·・\-_(),.\/]/g,'');}
function strip(s){return s.replace(/(학과|학부|전공|과)$/,'');}

    add(r.department_name,est?'e':'d','',target,est?3:2);
    var it=INDEX[INDEX.length-1];it.uni=u.name||'';it.std=majors[target].name;it.cnt=o;
  });
}
var q=$('q'),res=$('results'),timer=null;
function doSearch(){
  var raw=q.value.trim();if(!raw){res.hidden=true;res.innerHTML='';return;}
  var nq=norm(raw),isCho=/^[ㄱ-ㅎ]+$/.test(nq),sq=strip(nq)||nq,hits=[];
  for(var i=0;i<INDEX.length;i++){var e=INDEX[i],sc=-1;
    if(isCho){if(e.c.indexOf(nq)===0)sc=1;else if(e.c.indexOf(nq)>0)sc=2;}
    else{if(e.n===nq||e.s===sq)sc=0;else if(e.n.indexOf(nq)===0)sc=1;else if(e.n.indexOf(nq)>0||e.s.indexOf(sq)>=0)sc=2;}
    if(sc>=0)hits.push([sc*10+e.r,e]);}
  hits.sort(function(a,b){return a[0]-b[0]||a[1].label.length-b[1].label.length;});
  var out=hits.slice(0,40);
  res.innerHTML=out.length?out.map(function(h,i){var e=h[1],ty=e.ty==='j'?'직업':e.ty==='e'?'추정':'학과',sub=e.sub;
    if(e.cnt){var where=e.uni+(e.cnt.n>1?' 외 '+(e.cnt.n-1)+'곳':'');sub=where+' → 표준학과 '+e.std+(e.ty==='e'?' (같은 소계열에서 가장 가까운 학과로 추정)':'');}
    return '<button class="res" data-i="'+INDEX.indexOf(e)+'"><b>'+esc(e.label)+'</b><span class="ty '+e.ty+'">'+ty+'</span><span class="pth">'+esc(sub)+'</span></button>';}).join('')
    :'<div class="res-empty">찾는 학과·직업이 없습니다. 띄어쓰기를 빼거나 더 짧게(예: 인스타 → 미디어) 찾아보세요.</div>';
  res.hidden=false;
}
q.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(doSearch,120);});
q.addEventListener('focus',function(){if(q.value)doSearch();});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){res.hidden=true;q.blur();}if(e.key==='Enter'){var b=res.querySelector('.res');if(b){e.preventDefault();b.click();}}});
res.addEventListener('click',function(e){var b=e.target.closest('.res');if(!b)return;e.stopPropagation();var it=INDEX[+b.dataset.i];(it.ty==='j'?openJob:openMajor)(it.go);q.value='';res.hidden=true;q.blur();});
d.addEventListener('pointerdown',function(e){if(!e.target.closest('.search'))res.hidden=true;});
})();
</script>
