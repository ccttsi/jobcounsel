<!doctype html><meta charset="utf-8">
<title>QA harness</title>
<style>html,body{margin:0;background:#444}iframe{border:0;display:block;background:#fff}</style>
<script>
var q=new URLSearchParams(location.search);
var w=+(q.get('w')||390), h=+(q.get('h')||844), src=q.get('src')||'/';
var f=document.createElement('iframe');f.id='f';f.width=w;f.height=h;f.src=src;
document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(f);});
</script>
